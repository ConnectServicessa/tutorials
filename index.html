<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Form Builder Tutorial</title>
<style>
:root{--p:#002b30;--s:#005c51;--txt:#555;--app:#1a5c4c;--app-d:#13463a;--mint:#22c9a0;--mint-l:#7be0c3}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0b1719;overflow:hidden;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}
.player{display:flex;flex-direction:column;height:100%}
.vp{flex:1;position:relative;overflow:hidden;cursor:pointer}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;background:#eef1f3}
.ic{width:1em;height:1em;flex:none;vertical-align:-.125em}
button{font:inherit;cursor:pointer}

/* ---------- instant mode (seeking) ---------- */
.instant,.instant *{transition:none!important;animation:none!important}

/* ---------- layers ---------- */
.layer{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s,visibility 0s .5s}
.layer.on{opacity:1;visibility:visible;transition:opacity .5s}

/* ---------- intro / outro ---------- */
.hero{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;
  background:radial-gradient(circle at 78% 18%,rgba(34,201,160,.28),transparent 42%),radial-gradient(circle at 12% 90%,rgba(34,201,160,.18),transparent 40%),linear-gradient(135deg,#002b30,#005c51 65%,#0a6e5f)}
.hero .lgw{background:#fff;border-radius:18px;padding:18px 30px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.hero .lgw img{height:62px;display:block}
.hero h1{font-size:64px;margin:34px 0 10px;font-weight:700;letter-spacing:-.02em}
.hero p{font-size:24px;margin:0;color:#bfe9dd}
.pills{display:flex;gap:10px;margin-top:38px;flex-wrap:wrap;justify-content:center}
.pills span{border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.08);border-radius:30px;padding:9px 16px;font-size:15px;color:#e6f7f2}
.layer.on .hero>*{animation:up .6s both}
.layer.on .hero>:nth-child(2){animation-delay:.15s}.layer.on .hero>:nth-child(3){animation-delay:.3s}.layer.on .hero>:nth-child(4){animation-delay:.45s}
@keyframes up{from{opacity:0;transform:translateY(18px)}}
.hero .done{width:78px;height:78px;border-radius:50%;background:var(--mint);display:grid;place-items:center;font-size:40px;color:#06352c;margin-bottom:26px}
.hero .sub2{font-size:16px;color:#9fd3c5;margin-top:30px}

/* ---------- portal ---------- */
#L-portal{background:#eef1f3;color:var(--txt)}
.ps{position:absolute;left:0;top:0;bottom:0;width:120px;background:#fff;box-shadow:0 0 15px rgba(94,94,94,.15);border-radius:0 5px 5px 0;z-index:6}
.ps .logo{width:92%;margin:20px auto 0;padding-bottom:18px;border-bottom:1px dashed #ccc}
.ps .logo img{width:100%;display:block}
.mi{position:relative;padding:7px 10px}
.mi:after{content:'';display:block;width:80px;height:1px;background:#e3e3e3;margin:7px auto 0}
.mi:last-child:after{display:none}
.mm{display:flex;flex-direction:column;align-items:center;gap:6px;padding:9px 4px;border-radius:5px;transition:background .25s,color .25s}
.mm .ic{font-size:22px;color:var(--txt)}
.mm span{font-size:12.5px;font-weight:500;line-height:1;color:var(--txt)}
.mm.active{background:var(--p)}.mm.active .ic,.mm.active span{color:#fff}
.fly{position:absolute;left:calc(100% + 1px);top:7px;background:#fff;box-shadow:0 0 15px rgba(94,94,94,.2);min-width:180px;opacity:0;visibility:hidden;transform:translateX(20px);transition:.22s;z-index:9}
.fly.on{opacity:1;visibility:visible;transform:none}
.fly a{display:block;padding:12px 25px;border-bottom:1px solid #e2e2e2;font-size:14px;color:var(--txt)}
.fly a:last-child{border-bottom:0}
.fly a.hl{background:#f0f5f4;color:var(--p)}
.phdr{position:absolute;left:120px;right:0;top:0;height:60px;background:linear-gradient(45deg,var(--s),var(--p));display:flex;align-items:center;justify-content:space-between;padding:0 30px;color:#fff;z-index:5;box-shadow:0 0 15px rgba(94,94,94,.1)}
.phdr .ic{font-size:22px}
.phdr .hr{display:flex;align-items:center;gap:30px}
.bell{position:relative}.bell i{position:absolute;top:-7px;right:-9px;background:#e74c3c;font-style:normal;font-size:10px;border-radius:9px;padding:1px 5px;font-weight:700}
.usr{display:flex;align-items:center;gap:9px;font-size:14px}.usr .ic{font-size:14px}
.av{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;font-weight:700}
.pm{position:absolute;left:120px;right:0;top:60px;bottom:0;overflow:hidden}
.si{transition:transform .45s cubic-bezier(.4,0,.2,1);padding-bottom:110px}
.pg{display:none}.pg.on{display:block;animation:fade .3s both}
@keyframes fade{from{opacity:0}}
.bc{background:#f7f7f7;padding:13px 30px;font-size:13px;color:#8a8f98;display:flex;align-items:center;gap:8px;border-bottom:1px solid #e9ebee}
.bc b{color:#4b525c;font-weight:500}.bc .ic{font-size:12px}
.phd{display:flex;justify-content:space-between;align-items:center;padding:20px 30px}
.pt{display:flex;align-items:center;gap:14px}
.pic{width:44px;height:44px;border-radius:8px;background:#fff;display:grid;place-items:center;color:var(--s);font-size:22px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.pt h1{margin:0;font-size:22px;color:var(--p);font-weight:600}
.pt small{display:block;color:#9aa2b1;font-size:12.5px;margin-top:3px}
.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 20px;border-radius:3px;font-size:14px;font-weight:500;border:1px solid transparent;transition:filter .15s}
.btn.pri{background:var(--p);color:#fff}.btn.sec{background:var(--s);color:#fff}.btn.lg{background:#eceef1;color:#2b2f38}
.btn.sm{padding:8px 14px;font-size:13px}
.box{background:#fff;border-radius:3px;margin:0 30px 18px;padding:20px 28px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.badge{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:600}
.badge.active{background:#e3f6e9;color:#1e9e52}.badge.draft{background:#eef0f6;color:#5b6577}.badge.paused{background:#fff4e5;color:#b5730f}.badge.closed{background:#eceef3;color:#76808f}
.vb{display:inline-block;background:#eef2ff;color:#3f51b5;border-radius:10px;padding:1px 8px;font-size:11px;font-weight:600;margin-left:6px}
.sw{display:inline-block;width:42px;height:22px;border-radius:30px;background:#ced4da;position:relative;transition:background .25s;vertical-align:middle;flex:none}
.sw:after{content:'';position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .25s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw.on{background:var(--s)}.sw.on:after{transform:translateX(20px)}
.fg label{display:block;font-weight:600;font-size:13px;color:#3d434d;margin-bottom:6px}
.fg label em{color:#dc3545;font-style:normal}
.fi,.dd{border:1px solid #d5d9e0;border-radius:3px;padding:0 12px;height:38px;font-size:14px;color:#2b2f38;background:#fff;position:relative;display:flex;align-items:center;transition:border-color .2s,box-shadow .2s;white-space:nowrap;overflow:hidden}
.fi.empty:before{content:attr(data-ph);position:absolute;left:12px;color:#a0a7b4;pointer-events:none}
.fi.focus{border-color:var(--s);box-shadow:0 0 0 3px rgba(0,92,81,.13);overflow:visible}
.fi.focus .v:after{content:'';display:inline-block;width:1.5px;height:1.1em;background:#2b2f38;vertical-align:-3px;margin-left:1px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.dd{justify-content:space-between;gap:8px}.dd .lbl{overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:7px}
.dd .lbl.ph{color:#a0a7b4}.dd>.ic{color:#7a828f;font-size:14px}
.dd.open{border-color:var(--s);box-shadow:0 0 0 3px rgba(0,92,81,.13)}
.chipv{background:#e7f1ef;color:var(--s);border-radius:3px;padding:2px 8px;font-size:13px}
.pr{filter:brightness(.9)}
.ib{width:30px;height:30px;border-radius:4px;border:1px solid #e1e4ea;background:#fff;color:#5b6577;display:inline-grid;place-items:center;font-size:15px;padding:0}
.ib.red{color:#dc3545;border-color:#f3c9cd;background:#fff7f7}.ib.teal{color:var(--s);border-color:#bfdcd7;background:#f1f8f6}

/* dashboard */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin:0 30px 18px}
.stat{background:#fff;border-radius:3px;padding:18px 20px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.stat small{color:#8a909b;font-size:13px}.stat b{display:block;font-size:28px;color:var(--p);margin-top:6px}
.bars{display:flex;align-items:flex-end;gap:16px;height:240px;padding-top:10px}
.bars i{flex:1;background:linear-gradient(var(--s),#0b7a68);border-radius:3px 3px 0 0;opacity:.85}

/* list table */
.tctl{display:flex;align-items:center;gap:20px;padding-bottom:16px}
.srch{width:280px;height:38px;border:1px solid #d5d9e0;border-radius:3px;display:flex;justify-content:space-between;align-items:center;padding:0 12px;color:#a0a7b4;font-size:14px}
.adv,.arch{display:flex;align-items:center;gap:8px;font-size:14px;color:#4b525c}
.adv .ic,.arch .ic{color:#76808f;font-size:17px}
.tr{display:grid;align-items:center;column-gap:10px;padding:0 10px;min-height:52px;border-bottom:1px solid #f0f1f4;font-size:13.5px;color:#3a3f4a;max-height:60px;transition:max-height .4s,opacity .35s,min-height .4s,background 1s}
.tr.th{background:#f7f8fa;color:#76808f;font-weight:600;min-height:44px;border-bottom:1px solid #e8eaee}
.tr.lst{grid-template-columns:28px 2.2fr 1.3fr .9fr .9fr .8fr 130px}
.tr.rsp{grid-template-columns:70px 1.2fr .8fr 1fr 1.6fr 1.25fr 100px 120px}
.tr .ac{display:flex;gap:6px;justify-content:flex-end}
.tr.gone{max-height:0;min-height:0;opacity:0;overflow:hidden}
.tr.flash{background:#fff8dd}
.tr.in{animation:fade .4s both}
.cb{display:inline-block;width:16px;height:16px;border:1.5px solid #c3c8d1;border-radius:3px}
.tt{font-weight:600;color:#22304a}
.lnk{color:#1b7ced;text-decoration:underline}
.sd{color:var(--s);display:inline-flex;gap:6px;align-items:center;font-weight:500}
.rvb{font-size:12px;font-weight:600;border-radius:10px;padding:2px 9px;background:#e3f6e9;color:#1e9e52}.rvb.p{background:#fff4e5;color:#b5730f}
.rfil{display:grid;grid-template-columns:1fr 1fr 1.5fr 1fr 1fr auto;gap:14px;align-items:end;padding-bottom:18px}
.fi.date{justify-content:space-between}.fi.date>.ic{position:absolute;right:11px;color:#7a828f}

/* builder */
.fsb{display:flex;align-items:center;gap:12px;padding:18px 30px 14px}
.fsb h2{margin:0;font-size:21px;color:var(--p);font-weight:600}
.uns{font-size:13px;color:#9aa2b1}
.g5{display:grid;grid-template-columns:2fr 1.25fr 1fr 1fr 1.1fr;gap:16px}
.swrow{display:flex;align-items:center;gap:10px;height:38px;font-size:13px;color:#5b6577}
.sechdr{display:flex;align-items:center;gap:18px;margin:4px 30px 10px}
.sechdr h3{flex:1;margin:0;font-size:17px;color:var(--p)}
.brt{display:flex;align-items:center;gap:9px;font-size:14px;color:#3d434d;font-weight:500}
.scard{background:#fbfcfe;border:1px solid #e3e7ee;border-radius:6px;margin:0 30px 12px}
.sch{display:flex;align-items:center;gap:10px;padding:12px 16px;font-size:14px;color:#22304a;border-bottom:1px solid #edf0f4}
.scard.col .sch{border-bottom:0}
.sch .ic{color:#6b7280}.sch .stt{color:#5b6577}.sch .cnt{margin-left:auto;color:#9aa2b1;font-size:12.5px}
.qa{padding:12px 16px}
.qc{background:#fff;border:1px solid #e3e7ee;border-left:3px solid var(--s);border-radius:6px;padding:12px 14px;margin-bottom:10px;animation:qin .35s both}
@keyframes qin{from{opacity:0}}
.qrow{display:flex;align-items:center;gap:10px}
.grip{color:#b4bac5;font-size:16px}
.qb{background:#e7f1ef;color:var(--s);font-weight:700;font-size:12px;border-radius:4px;padding:3px 8px}
.qrow .fi{flex:1;font-weight:600;color:#22304a}
.qctl{display:flex;align-items:center;gap:14px;margin-top:10px;padding-left:26px}
.qctl .qtype{width:210px;height:34px;font-size:13.5px}
.qctl .qtype .lbl .ic{color:var(--s)}
.req{display:flex;align-items:center;gap:8px;font-size:13px;color:#4b525c}
.sp{flex:1}
.qbody{padding-left:26px}
.op{display:flex;align-items:center;gap:10px;margin-top:8px}
.op .rc{width:16px;height:16px;border:2px solid #b9c0cc;border-radius:50%;flex:none}
.op .fi{flex:1;height:34px;background:#f7f8fb}
.op .goto{display:none;width:220px;height:34px;font-size:13px}
.br .op .goto{display:flex;animation:fade .3s both}
.opa{display:flex;align-items:center;gap:22px;margin:8px 0 2px 26px;font-size:13px}
.opa a{color:#1b7ced}.opa label{display:flex;gap:8px;align-items:center;color:#5b6577}
.opa .sw{transform:scale(.85)}
.qcfg{display:flex;align-items:center;gap:12px;margin-top:10px;font-size:13px;color:#5b6577}
.qcfg .dd{width:64px;height:32px}
.stars{display:flex;gap:4px;font-size:22px;color:#f5b50a;margin-left:10px}
.stars .ic{fill:#f5b50a}
.sigbox{margin-top:10px;height:70px;border:1.5px dashed #c8ced8;border-radius:6px;background:#fafbfd;display:flex;align-items:center;justify-content:center;gap:10px;color:#8e96a3;font-size:13px}
.sigbox .ic{font-size:18px}
.addq{display:inline-block;color:#1b7ced;font-size:14px;font-weight:500;padding:4px 2px}
.pnl{margin:6px 30px 14px;background:#fff;border:1px solid #e3e7ee;border-radius:4px}
.pnh{background:#f8f9fb;padding:12px 18px;font-weight:600;color:#22304a;border-bottom:1px solid #e3e7ee;font-size:15px}
.pnb{padding:14px 18px}
.hint{display:block;color:#8a909b;font-size:12.5px;margin-bottom:12px}
.g4{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr auto;gap:14px;align-items:end}
.atb{margin-top:14px;border:1px solid #edf0f4;border-radius:4px}
.atb .tr{grid-template-columns:1.2fr 1fr 1fr 1fr 50px;min-height:42px}
.empty{padding:14px;text-align:center;color:#a0a7b4;font-size:13px}
.fa{display:flex;justify-content:flex-end;gap:10px;margin:0 30px}

/* overlays */
#ov{position:absolute;inset:0;z-index:50;pointer-events:none}
.ddp{position:absolute;background:#fff;border-radius:4px;box-shadow:0 6px 22px rgba(0,0,0,.18);padding:4px 0;font-size:14px;color:#333;z-index:3;animation:pop .16s both}
.ddp div{padding:0 14px;height:36px;display:flex;align-items:center;gap:9px;white-space:nowrap}
.ddp div .ic{color:var(--s)}
.ddp div.hl{background:#e8f1ef;color:var(--s)}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}}
.toast{position:absolute;right:24px;top:76px;width:340px;background:#e4f8f0;border-left:6px solid #1ea97c;border-radius:6px;padding:13px 16px;display:flex;gap:12px;box-shadow:0 6px 18px rgba(0,0,0,.14);animation:tin .35s both;font-size:14px}
.toast .ic{font-size:22px;color:#1ea97c;margin-top:1px}
.toast b{display:block;color:#1a7a5a}.toast p{margin:3px 0 0;color:#2f6b55;font-size:13px;line-height:1.35}
.toast.out{animation:tout .35s both}
@keyframes tin{from{opacity:0;transform:translateX(40px)}}
@keyframes tout{to{opacity:0;transform:translateX(40px)}}
.mbg{position:absolute;inset:0;background:rgba(10,20,24,.42);display:flex;align-items:center;justify-content:center;animation:fade .2s both}
.cdlg{background:#fff;border-radius:6px;width:450px;box-shadow:0 20px 50px rgba(0,0,0,.3);animation:fade .2s both}
.cdh{padding:16px 20px;font-weight:600;font-size:17px;color:#22304a;display:flex;justify-content:space-between;align-items:center}
.cdh .ic{color:#9aa2b1}
.cdb{display:flex;gap:14px;padding:4px 20px 18px;font-size:14.5px;color:#4b525c;line-height:1.45;align-items:flex-start}
.cdb>.ic{font-size:30px;color:#f0a020}
.cdb p{margin:0}
.cdf{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid #eef0f3}
.rmd{background:#fff;border-radius:6px;width:620px;box-shadow:0 20px 50px rgba(0,0,0,.3);animation:fade .2s both;overflow:hidden}
.rmd .cdh{border-bottom:1px solid #eef0f3}
.rmeta{display:grid;grid-template-columns:1fr 1fr;gap:10px 24px;padding:14px 22px;background:#f8f9fb;font-size:13px}
.rmeta small{display:block;color:#8a909b}.rmeta b{color:#22304a;font-weight:600}
.ans{padding:6px 22px 16px}
.an{display:grid;grid-template-columns:200px 1fr;padding:10px 0;border-bottom:1px solid #f0f1f4;font-size:14px;align-items:center}
.an span{color:#6b7280}.an b{color:#22304a;font-weight:600}
.an .st{color:#f5b50a;font-size:18px;display:flex;gap:2px}.an .st .ic{fill:#f5b50a}.an .st .o{color:#d6d6d6;fill:none}
.rsig{height:84px;border:1px solid #e3e7ee;border-radius:6px;background:#fff;width:260px}
.rsig path{fill:none;stroke:#13325b;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.dlc{position:absolute;right:24px;top:76px;width:330px;background:#fff;border-radius:8px;box-shadow:0 10px 28px rgba(0,0,0,.2);padding:14px;display:flex;gap:12px;align-items:center;animation:tin .3s both}
.xl{width:38px;height:44px;border-radius:5px;background:#1d6f42;color:#fff;font-weight:800;display:grid;place-items:center;font-size:15px;flex:none}
.dlc b{font-size:13.5px;color:#22304a;display:block}
.dlc small{color:#6b7280;font-size:12px}
.dlb{height:4px;background:#e6e9ee;border-radius:3px;margin:7px 0 5px;overflow:hidden}
.dlb i{display:block;height:100%;width:0;background:#1d6f42;transition:width .6s}
.dlc.ok .dlb i{width:100%}

/* ---------- mobile ---------- */
#L-mobile{background:radial-gradient(circle at 85% 20%,rgba(26,92,76,.12),transparent 40%),linear-gradient(160deg,#eaf2ef,#f7f9f8)}
.mside{position:absolute;left:110px;top:105px;width:480px;color:#1d2b28;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.mside .eye{color:var(--app);letter-spacing:.14em;font-weight:700;font-size:13px}
.mside h2{font-size:36px;margin:10px 0 10px;letter-spacing:-.01em}
.mside p{font-size:17px;color:#56635f;margin:0 0 24px;line-height:1.45}
.mside ol{list-style:none;margin:0;padding:0}
.mside li{display:flex;gap:14px;align-items:center;padding:12px 14px;border-radius:12px;font-size:17px;color:#83908d;transition:background .3s,color .3s,box-shadow .3s;margin-bottom:4px}
.mside li .n{width:30px;height:30px;border-radius:50%;background:#dfe7e5;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none;transition:.3s}
.mside li.on{background:#fff;color:#1d2b28;box-shadow:0 6px 18px rgba(26,92,76,.12)}
.mside li.on .n{background:var(--app);color:#fff}
.mside li.done .n{background:var(--mint-l);color:#0f3d33}
.phone{position:absolute;left:720px;top:26px;width:300px;height:612px;background:#0c0f10;border-radius:46px;padding:10px;box-shadow:0 30px 60px rgba(0,0,0,.3),inset 0 0 0 2px #2b3133}
.pscreen{position:relative;width:100%;height:100%;border-radius:36px;overflow:hidden;background:#f2f5f4;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#1d2b28}
.island{position:absolute;top:9px;left:50%;width:86px;height:25px;margin-left:-43px;background:#000;border-radius:14px;z-index:40}
.sbar{position:absolute;top:0;left:0;right:0;height:40px;display:flex;justify-content:space-between;align-items:center;padding:4px 26px 0 30px;font-size:13px;font-weight:600;color:#fff;z-index:35}
.ms{position:absolute;inset:0;transform:translateX(100%);transition:transform .35s cubic-bezier(.4,0,.2,1);background:#f2f5f4;display:flex;flex-direction:column}
.ms.on{transform:none}.ms.prev{transform:translateX(-30%)}
.mab{background:var(--app);color:#fff;padding:46px 14px 13px;display:flex;align-items:center;gap:10px;font-size:16px;font-weight:600}
.mab .ic{font-size:20px}
.mh{background:linear-gradient(160deg,var(--app),var(--app-d));color:#fff;padding:48px 16px 16px;border-radius:0 0 24px 24px}
.mhh{display:flex;justify-content:space-between;align-items:center}
.mhh small{font-size:12px;opacity:.8;display:block}.mhh b{font-size:19px}
.mav{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;font-weight:700;font-size:14px}
.mcard{background:#fff;color:#1d2b28;border-radius:16px;padding:12px;margin-top:14px;box-shadow:0 8px 20px rgba(0,0,0,.12)}
.mcard .r1{display:flex;gap:9px;align-items:center;font-size:14px}
.mcard .r1 .ic{color:var(--app);font-size:20px}
.mcard small{display:block;font-size:11.5px;color:#7a8784}
.mcard .r2{display:flex;justify-content:space-between;align-items:flex-end;margin-top:12px;font-size:14px}
.mbtn{border:0;border-radius:11px;padding:9px 12px;font-weight:600;font-size:13px;display:inline-flex;gap:6px;align-items:center;justify-content:center;transition:filter .15s}
.mbtn.red{background:#fdecec;color:#c0392b}
.mbtn.grn{background:var(--app);color:#fff}
.mbtn.ghost{background:#eef2f1;color:#3d4b47}
.mbtn.full{width:100%;padding:13px;font-size:15px;margin-top:12px}
.mbody{padding:14px;flex:1;position:relative;overflow:hidden}
.pend{display:flex;align-items:center;gap:10px;background:#fff7e8;border:1px solid #f5d699;color:#7a5200;border-radius:14px;padding:11px 12px;font-size:13.5px}
.pend>.ic:first-child{background:#f5b041;color:#fff;border-radius:10px;width:34px;height:34px;padding:8px}
.pend small{display:block;font-size:11.5px;color:#a37a2c}
.pend div{flex:1}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.tile{background:#fff;border-radius:14px;padding:14px 4px 11px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;color:#33413d;position:relative;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.tile .ti{width:38px;height:38px;border-radius:12px;background:#e7f1ee;color:var(--app);display:grid;place-items:center;font-size:19px}
.bdg{position:absolute;top:7px;right:16px;background:#e74c3c;color:#fff;font-size:10px;border-radius:9px;min-width:17px;height:17px;display:grid;place-items:center;font-weight:700}
.mnav{display:flex;justify-content:space-around;background:#fff;border-top:1px solid #e5e9e8;padding:10px 0 22px;color:#a3aeab;font-size:21px}
.mnav .ic:first-child{color:var(--app)}
.mtabs{display:flex;background:var(--app);padding:0 14px}
.mtabs span{flex:1;text-align:center;color:rgba(255,255,255,.7);padding:9px 0 10px;font-size:13px;border-bottom:3px solid transparent}
.mtabs span.on{color:#fff;border-color:var(--mint-l)}
.fc{display:flex;align-items:center;gap:11px;background:#fff;border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.fci{width:40px;height:40px;border-radius:12px;background:#e7f1ee;color:var(--app);display:grid;place-items:center;font-size:19px;flex:none}
.fcb{flex:1}.fcb b{font-size:14px;display:block}.fcb small{font-size:11.5px;color:#7a8784;display:block;margin:2px 0 6px}
.fc>.ic{color:#a3aeab}
.tg{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:10px;margin-right:5px}
.tg.rq{background:#fdecec;color:#c0392b}.tg.dl{background:#eef2f1;color:#5b6b67}
.mprog{height:4px;background:#d7e4e0}.mprog i{display:block;height:100%;width:0;background:var(--mint);transition:width .4s}
.mbody .si{padding:0 0 20px}
.qh small{color:var(--app);font-weight:700;font-size:11px;letter-spacing:.08em}.qh b{display:block;font-size:15px;margin-top:2px}
.mq{background:#fff;border-radius:14px;padding:12px;margin-top:10px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.mq label{display:block;font-size:13.5px;font-weight:600;margin-bottom:8px}.mq label em{color:#d64545;font-style:normal}
.phone .fi{border:0;border-bottom:2px solid #d4dedb;border-radius:0;padding:0 2px;height:32px;font-size:14px}
.phone .fi.empty:before{left:2px}
.phone .fi.focus{border-color:var(--app);box-shadow:none}
.rad{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;font-size:13.5px;color:#33413d;transition:background .2s}
.rad i{width:18px;height:18px;border-radius:50%;border:2px solid #b9c6c2;transition:.2s}
.rad.sel{background:#e7f1ee}.rad.sel i{border-color:var(--app);background:var(--app);box-shadow:inset 0 0 0 3px #fff}
.mstars{display:flex;gap:7px;font-size:30px;color:#cfd8d5}
.mstars span{transition:color .2s,transform .2s}
.mstars span.f{color:#f5b50a;transform:scale(1.12)}.mstars span.f .ic{fill:#f5b50a}
.rtl{font-size:12px;color:#7a8784;margin-top:4px;display:block}
.pad{position:relative;height:96px;border:1.5px dashed #b9c6c2;border-radius:10px;background:#fafcfb}
.pph{position:absolute;inset:0;display:grid;place-items:center;color:#a5b2ae;font-size:13px;transition:opacity .3s}
.pad svg{position:absolute;inset:0;width:100%;height:100%}
.pad path{fill:none;stroke:#13325b;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:2000;stroke-dashoffset:2000}
.clr{font-size:12px;color:#7a8784;float:right;margin-top:5px}
.spin{display:none;width:18px;height:18px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:rot .7s linear infinite}
.ld .spin{display:inline-block}.ld .bt{display:none}
@keyframes rot{to{transform:rotate(360deg)}}
.mdlg{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:18px;opacity:0;visibility:hidden;transition:opacity .25s,visibility 0s .25s;z-index:30}
.mdlg.on{opacity:1;visibility:visible;transition:opacity .25s}
.mdc{background:#fff;border-radius:20px;padding:20px 16px 16px;text-align:center;width:100%;transform:scale(.92);transition:transform .25s}
.mdlg.on .mdc{transform:none}
.wic{width:52px;height:52px;border-radius:50%;background:#fff3dc;color:#e08e0b;display:grid;place-items:center;font-size:26px;margin:0 auto 10px}
.mdc h4{margin:0 0 6px;font-size:16px}.mdc p{margin:0 0 12px;font-size:13px;color:#5d6b67;line-height:1.4}
.miss{display:flex;align-items:center;gap:10px;background:#fdf1f1;border:1px solid #f4cccc;border-radius:12px;padding:10px;text-align:left;margin-bottom:14px}
.miss .fci{background:#fde0e0;color:#c0392b;width:34px;height:34px;font-size:16px}
.miss b{font-size:13.5px;display:block}.miss small{font-size:11.5px;color:#c0392b}
.mdr{display:flex;gap:8px}.mdr .mbtn{flex:1;padding:11px}
.msucc{position:absolute;inset:0;background:linear-gradient(160deg,var(--app),var(--app-d));display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;opacity:0;visibility:hidden;transition:opacity .35s,visibility 0s .35s;z-index:25;text-align:center;padding:30px}
.msucc.on{opacity:1;visibility:visible;transition:opacity .35s}
.msucc svg{width:96px;height:96px}
.msucc circle{fill:rgba(255,255,255,.12);stroke:var(--mint-l);stroke-width:3}
.msucc path{fill:none;stroke:#fff;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60}
.msucc.on path{animation:draw .5s .25s forwards}
.msucc.on svg{animation:pop2 .45s both}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop2{from{transform:scale(.5);opacity:0}}
.msucc h3{font-size:22px;margin:20px 0 6px}.msucc p{font-size:13.5px;opacity:.85;margin:0 0 24px}
.msucc .mbtn{background:rgba(255,255,255,.16);color:#fff;padding:11px 26px}
.nday{position:absolute;inset:0;background:rgba(10,30,26,.82);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:22px;font-weight:700;opacity:0;visibility:hidden;transition:opacity .35s,visibility 0s .35s;z-index:45;gap:8px}
.nday.on{opacity:1;visibility:visible;transition:opacity .35s}
.nday small{font-size:13px;font-weight:400;opacity:.8}

/* ---------- caption & cursor ---------- */
#cap{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:rgba(0,32,36,.93);color:#fff;border-radius:14px;padding:10px 20px 11px 12px;display:flex;gap:13px;align-items:center;max-width:820px;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:80;transition:opacity .3s;white-space:nowrap}
#cap.hide{opacity:0}
#cap .cn{width:34px;height:34px;border-radius:10px;background:var(--mint);color:#04332a;display:grid;place-items:center;font-weight:800;font-size:16px;flex:none}
#cap small{display:block;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mint-l);font-weight:700}
#cap .tx{font-size:17px;margin-top:1px}
#cap .tx b{color:#9ff0d6}
#cap .tx.sw2{animation:fade .3s both}
#cur{position:absolute;left:0;top:0;z-index:100;pointer-events:none;opacity:0;transition:transform .45s cubic-bezier(.45,.05,.25,1),opacity .3s}
#cur.vis{opacity:1}
#cur svg.ar{position:absolute;left:-4px;top:-3px;width:28px;height:28px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35));transform-origin:4px 3px}
#cur .touch{display:none;position:absolute;left:-19px;top:-19px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.35);border:2.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.2),0 4px 14px rgba(0,0,0,.3)}
#cur.t svg.ar{display:none}#cur.t .touch{display:block}
#cur.p svg.ar{animation:cp .25s}#cur.t.p .touch{animation:tp .3s}
@keyframes cp{50%{transform:scale(.78)}}
@keyframes tp{50%{transform:scale(.72);background:rgba(34,201,160,.55)}}
.rip{position:absolute;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;border:2.5px solid var(--mint);z-index:99;pointer-events:none;animation:rip .55s ease-out forwards}
@keyframes rip{from{transform:scale(.2);opacity:1}to{transform:scale(1.4);opacity:0}}

/* ---------- controls ---------- */
.ctl{height:48px;flex:none;background:#0f1d20;display:flex;align-items:center;gap:6px;padding:0 12px;color:#cfe3de;font-size:13px;user-select:none}
.ctl button{background:none;border:0;color:#e9f6f2;width:36px;height:36px;border-radius:8px;display:grid;place-items:center;flex:none}
.ctl button:hover{background:rgba(255,255,255,.08)}
.ctl button svg{width:20px;height:20px}
#tm{font-variant-numeric:tabular-nums;min-width:86px;text-align:center;flex:none}
#bar{position:relative;flex:1;height:28px;cursor:pointer;touch-action:none}
#bar .trk{position:absolute;left:0;right:0;top:12px;height:5px;border-radius:3px;background:rgba(255,255,255,.16)}
#fill{position:absolute;left:0;top:12px;height:5px;border-radius:3px;background:var(--mint);width:0}
#knob{position:absolute;top:8px;width:13px;height:13px;margin-left:-6.5px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.tick{position:absolute;top:10px;width:2px;height:9px;background:#0f1d20;margin-left:-1px}
#chap{flex:none;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#9fcfc3;padding-left:8px}
@media (max-width:560px){#chap{display:none}#tm{min-width:70px;font-size:12px}.ctl{padding:0 6px;gap:2px}}
#big{position:absolute;left:50%;top:50%;width:76px;height:76px;margin:-38px 0 0 -38px;border-radius:50%;background:rgba(0,43,48,.85);display:grid;place-items:center;opacity:0;transition:opacity .25s;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.35)}
#big svg{width:34px;height:34px;color:#fff;margin-left:4px}
.paused #big{opacity:1}
</style>
</head>

let cx=0,cy=0,seeking=false;
function rel(el){const s=stage.getBoundingClientRect(),r=el.getBoundingClientRect();return{x:(r.left-s.left)/SC,y:(r.top-s.top)/SC,w:r.width/SC,h:r.height/SC};}
function setXY(x,y,dur,ease){cx=x;cy=y;cur.style.transitionDuration=dur+'ms, 300ms';cur.style.transitionTimingFunction=ease?ease+', ease':'';cur.style.transform=`translate(${x}px,${y}px)`;}
// position an element will have once any needed scroll finishes (and start that scroll)
function finalRect(el){
  const r=rel(el), sc=el.closest('.scroll'); if(!sc) return r;
  const inner=sc.firstElementChild, ri=rel(inner), rs=rel(sc), tIn=r.y-ri.y;
  const off=+sc.dataset.off||0, vh=sc.clientHeight, mb=+(sc.dataset.mb||100), top=tIn-off; let n=off;
  if(top<16||top+r.h>vh-mb){n=tIn-vh*.35;n=Math.max(0,Math.min(Math.max(0,inner.offsetHeight-vh),n));}
  if(Math.abs(n-off)>1){inner.style.transform=`translateY(${-n}px)`;sc.dataset.off=n;}else n=off;
  return{x:r.x,w:r.w,h:r.h,y:rs.y+tIn-n};
}
function cursorTo(el,dur,o={}){if(!el)return;const r=finalRect(el);setXY(r.x+r.w*(o.fx??.5)+(o.dx||0),r.y+r.h*(o.fy??.5)+(o.dy||0),dur);}

  d.innerHTML=`<div class="qrow"><span class="grip">${ic('grip')}</span><span class="qb">Q${n}</span>${fiH('q'+n+'t','Question text','qt')}</div>
   <div class="qctl"><div class="dd qtype"><span class="lbl">${TYPE_ITEMS[0]}</span>${ic('chev')}</div><label class="req">Required <span class="sw"></span></label><span class="sp"></span><button class="ib">${ic('copy')}</button><button class="ib red">${ic('trash')}</button></div><div class="qbody"></div>`;
  $('#qs').appendChild(d);$('#s1cnt').textContent=n+(n>1?' questions':' question');
}
function setType(n,k){
  const b=$('#q'+n+' .qbody');
  if(k==='mc') b.innerHTML=[1,2,3].map(i=>`<div class="op o${i}"><i class="rc"></i>${fiH('q'+n+'o'+i,'Option '+i)}<div class="dd goto"><span class="lbl ph">Go to section…</span>${ic('chev')}</div><button class="ib">${ic('x')}</button></div>`).join('')+`<div class="opa"><a>+ Add option</a><label>Allow "Other" <span class="sw"></span></label></div>`;
  if(k==='rating') b.innerHTML=`<div class="qcfg"><span>Max rating</span>${ddH('5')}<span class="stars">${ic('star').repeat(5)}</span></div>`;
  if(k==='sig') b.innerHTML=`<div class="sigbox">${ic('pen')}<span>Signature pad — the employee signs with a finger</span></div>`;
}
function addAsg(){$('#arows').innerHTML=`<div class="tr flash in"><span>Connect Services</span><span>Jeddah</span><span>Mall Store</span><span>All employees (12)</span><span><button class="ib red">${ic('trash')}</button></span></div>`;}

/* mobile */
function mscr(id){$$('.ms').forEach(s=>{if(s.id===id){s.classList.add('on');s.classList.remove('prev');}else if(s.classList.contains('on')){s.classList.remove('on');s.classList.add('prev');}});}
function mhome(){$$('.ms').forEach(s=>{s.classList.toggle('on',s.id==='s-home');s.classList.remove('prev');});}
const SIDE={
 4:{h:'Filling a form on mobile',p:'Assigned employees see the form in the app as soon as it is active.',s:['Open <b>Forms</b> from the home screen','Pick a pending form','Answer each question','Sign and tap <b>Submit</b>']},
 5:{h:'Checkout protection',p:'Forms marked “Required before checkout” must be submitted before the employee can check out.',s:['Employee taps <b>Check Out</b>','The app lists missing required forms','Complete the form, then check out']}
};
function side(k){const d=SIDE[k];$('#ms-h').textContent=d.h;$('#ms-p').textContent=d.p;$('#ms-steps').innerHTML=d.s.map((s,i)=>`<li><span class="n">${i+1}</span><span>${s}</span></li>`).join('');}
function sideStep(i){$$('#ms-steps li').forEach((l,j)=>{l.classList.toggle('on',j===i);l.classList.toggle('done',j<i);});}
function sigPt(f){const p=$('#sigp'),L=p.getTotalLength(),pt=p.getPointAtLength(L*f),r=rel(p.ownerSVGElement);return{x:r.x+pt.x*r.w/240,y:r.y+pt.y*r.h/90,L};}

/* ======================= timeline DSL ======================= */
const E=[];let base=0;
const at=(t,fn)=>E.push({t:base+t,fn,o:E.length});
const mv=(t,sel,dur=450,o)=>at(t,()=>cursorTo($(sel),dur,o));
const clk=(t,sel,fn)=>at(t,()=>{press(sel);fn&&fn();});
function mc(t,sel,fn,dur=450,o){mv(t,sel,dur,o);clk(t+dur+60,sel,()=>{if(!(sel||'').includes('.fi')&&!/#(f-title|r-from|r-to|mf-name)/.test(sel))blurAll();fn&&fn();});return t+dur+60;}
function typ(t,sel,text,step=40){at(t,()=>focusEl(sel));for(let i=1;i<=text.length;i++)at(t+i*step,()=>setVal(sel,text.slice(0,i)));return t+text.length*step;}
function DD(t,sel,items,i,after,label){
  const c=mc(t,sel,()=>ddOpen(sel,items),380), it=`#ddp [data-i="${i}"]`;
  mv(c+180,it,330);at(c+400,()=>{const e=$(it);e&&e.classList.add('hl');});
  clk(c+570,it,()=>{ddPick(sel,label||items[i]);after&&after();});
  return c+570;
}
let tid=0;
function toast(t,title,msg,dur=2600){const id='t'+(tid++);at(t,()=>toastShow(id,title,msg));at(t+dur,()=>{const e=$('#'+id);e&&e.classList.add('out');});at(t+dur+400,()=>{const e=$('#'+id);e&&e.remove();});}
const cap=(t,n,l,h)=>at(t,()=>setCap(n,l,h));

/* ======================= scenes ======================= */
function S_intro(){at(0,()=>{layer('L-intro');curShow(false);$('#cap').classList.add('hide');});return 3500;}

function S_create(){
  const C=(t,h)=>cap(t,1,'Create a form',h);
  at(0,()=>{layer('L-portal');page('pg-dash');});at(350,()=>curShow(true,false));
  C(250,'Open <b>Forms → Form Builder</b> from the sidebar');
  let t=mc(450,'#m-forms .mm',()=>fly(true),550);
  at(t+200,()=>$('#fl-builder').classList.add('hl'));
  t=mc(t+250,'#fl-builder',()=>{fly(false);navForms();page('pg-list');renderList();},350);
  C(t+100,'Click <b>New Form</b> to open the builder');
  t=mc(t+350,'#btn-new',()=>page('pg-build'),450);
  C(t+100,'Give the form a title');
  t=mc(t+300,'#f-title',()=>focusEl('#f-title'),400,{fx:.3});
  t=typ(t+60,'#f-title','Daily Store Inspection',36);at(t,()=>$('#uns').textContent='· Unsaved changes');
  C(t+150,'Add a <b>Short Answer</b> question');
  t=mc(t+200,'#addq',()=>addQ(1),450);
  t=typ(t+250,'#q1t','Employee Name',32);
  C(t+100,'Add a <b>Multiple Choice</b> question with options');
  t=mc(t+150,'#addq',()=>addQ(2),380);
  t=typ(t+250,'#q2t','City',45);
  t=DD(t+100,'#q2 .qtype',TYPE_ITEMS,2,()=>setType(2,'mc'));
  t=mc(t+250,'#q2o1',()=>focusEl('#q2o1'),320,{fx:.2});t=typ(t+20,'#q2o1','Jeddah',30);
  t=mc(t+60,'#q2o2',()=>focusEl('#q2o2'),220,{fx:.2});t=typ(t+20,'#q2o2','Riyadh',30);
  t=mc(t+60,'#q2o3',()=>focusEl('#q2o3'),220,{fx:.2});t=typ(t+20,'#q2o3','Makkah',30);
  C(t+50,'Turn <b>Required</b> on so it can’t be skipped');
  t=mc(t+150,'#q2 .req .sw',()=>sw('#q2 .req .sw',true),380);
  C(t+250,'Add a <b>Rating</b> question with 5 stars');
  t=mc(t+300,'#addq',()=>addQ(3),400);t=typ(t+250,'#q3t','Store Cleanliness',26);
  t=DD(t+80,'#q3 .qtype',TYPE_ITEMS,7,()=>setType(3,'rating'));
  C(t+100,'Add a <b>Signature</b> question');
  t=mc(t+200,'#addq',()=>addQ(4),400);t=typ(t+250,'#q4t','Supervisor Signature',24);
  t=DD(t+80,'#q4 .qtype',TYPE_ITEMS,8,()=>setType(4,'sig'));
  C(t+100,'Turn on <b>Branching</b> to jump to another section based on the answer');
  t=mc(t+250,'#sw-br',()=>{sw('#sw-br',true);$('#pg-build').classList.add('br');},450);
  C(t+400,'If the answer is <b>Jeddah</b> → <b>Go to Section 2</b>');
  t=DD(t+400,'#q2 .o1 .goto',GOTO,1,null,'Go to Section 2');
  C(t+100,'Enable <b>Required before checkout</b>');
  t=mc(t+250,'#sw-rbc',()=>{sw('#sw-rbc',true);$('#rbc-t').textContent='Yes';},550);
  C(t+150,'Click <b>Save</b>');
  t=mc(t+350,'#btn-save',()=>$('#uns').textContent='· Saved just now',550);
  toast(t+120,'Success','Form saved successfully');
  return t+1700;
}

function S_assign(){
  const C=(t,h)=>cap(t,2,'Assign to employees',h);
  C(0,'In <b>Assignments</b>, choose the client, city and store');
  let t=DD(300,'#a-client',['Connect Services','Panda Retail','Al Othaim Markets'],0);
  t=DD(t+150,'#a-city',['All cities','Jeddah','Riyadh','Makkah','Dammam'],1);
  t=DD(t+150,'#a-store',['All stores','Mall Store','Red Sea Mall','Tahlia Street'],1);
  C(t+50,'Click <b>Assign</b>');
  t=mc(t+200,'#btn-assign',addAsg,400);
  toast(t+100,'Form assigned','12 employees at Mall Store, Jeddah will see it in the app');
  C(t+300,'Done — the form is now live for these employees');
  return t+2300;
}

function S_fill(){
  const C=(t,h)=>cap(t,3,'Employee fills the form',h);
  at(0,()=>{layer('L-mobile');side(4);sideStep(0);mhome();curShow(false,true);setXY(870,560,0);});
  at(500,()=>curShow(true,true));
  C(100,'The home screen shows <b>2 forms pending</b>');
  let t=mc(900,'#t-forms',()=>mscr('s-forms'),550);
  at(t,()=>sideStep(1));C(t+100,'Required forms are flagged with a red <b>Required</b> badge');
  t=mc(t+700,'#fc-dsi',()=>mscr('s-fill'),450);
  at(t,()=>sideStep(2));C(t+100,'Answer each question');
  t=mc(t+600,'#mf-name',()=>focusEl('#mf-name'),400,{fx:.3});t=typ(t+50,'#mf-name','Ahmed Ali',55);at(t,()=>$('#mprog').style.width='25%');
  t=mc(t+200,'#mf-jeddah',()=>{$('#mf-jeddah').classList.add('sel');$('#mprog').style.width='50%';},400,{fx:.25});
  t=mc(t+250,'#ms4',null,450);
  for(let k=1;k<=4;k++)at(t+k*80,()=>$('#ms'+k).classList.add('f'));
  at(t+380,()=>{$('#rtl').textContent='4 / 5 · Good';$('#mprog').style.width='75%';});
  at(t+450,()=>sideStep(3));C(t+450,'Sign on the pad, then tap <b>Submit</b>');
  at(t+550,()=>{finalRect($('#pad'));});
  at(t+1000,()=>{const p=sigPt(0);setXY(p.x,p.y,450);});
  const d0=t+1550,N=30,D=1400;
  at(d0,()=>{$('#pph').style.opacity=0;});
  for(let i=0;i<=N;i++)at(d0+i*D/N,()=>{const f=i/N,p=sigPt(f),path=$('#sigp');path.style.strokeDasharray=p.L;path.style.strokeDashoffset=p.L*(1-f);setXY(p.x,p.y,D/N,'linear');});
  t=d0+D;at(t,()=>$('#mprog').style.width='100%');
  t=mc(t+250,'#mf-submit',()=>$('#mf-submit').classList.add('ld'),450);
  at(t+650,()=>{$('#msucc').classList.add('on');$$('#ms-steps li').forEach(l=>{l.classList.remove('on');l.classList.add('done');});});
  C(t+650,'Submitted — the response reaches the portal instantly');
  return t+2500;
}

function S_checkout(){
  const C=(t,h)=>cap(t,4,'Checkout blocking',h);
  at(0,()=>{$('#nday').classList.add('on');side(5);sideStep(0);});
  at(450,()=>{$('#msucc').classList.remove('on');mhome();$('#pend-t').textContent='1 form pending';$('#t-bdg').textContent='1';$('#hrs').textContent='8h 56m';});
  C(0,'Next day: the employee tries to <b>Check Out</b> without filling the form');
  at(1000,()=>$('#nday').classList.remove('on'));
  let t=mc(1200,'#btn-co',()=>$('#mdlg').classList.add('on'),550);
  at(t+100,()=>sideStep(1));C(t+100,'Blocked — <b>Please complete required forms before checking out</b>');
  mv(t+1500,'#dlg-fill',500);at(t+2100,()=>sideStep(2));
  return t+3300;
}

  const C=(t,h)=>cap(t,5,'View responses',h);
  at(0,()=>{layer('L-portal');curShow(false,false);setXY(640,380,0);$$('#ov > *').forEach(e=>e.remove());});
  at(450,()=>curShow(true,false));
  C(100,'Open <b>Forms → Responses</b>');
  let t=mc(500,'#m-forms .mm',()=>fly(true),500);
  at(t+200,()=>$('#fl-resp').classList.add('hl'));
  t=mc(t+250,'#fl-resp',()=>{fly(false);page('pg-resp');renderResp(false);},350);
  C(t+100,'Filter by <b>date range</b> and <b>form</b>');
  t=mc(t+300,'#r-from',()=>focusEl('#r-from'),400,{fx:.3});t=typ(t+30,'#r-from','01/10/2026',30);
  t=mc(t+60,'#r-to',()=>focusEl('#r-to'),350,{fx:.3});t=typ(t+30,'#r-to','20/10/2026',30);
  t=DD(t+100,'#r-form',['All forms','Daily Store Inspection','Weekly Stock Check','Shift Handover Checklist','Customer Feedback Survey'],1);
  t=mc(t+100,'#r-search',()=>renderResp(true),400);
  C(t+300,'Open a response to see every answer and the signature');
  t=mc(t+500,'#rr1 .sd',()=>modal(respModal(),'rm'),450);
  mv(t+700,'#rm-sig',500,{fx:.65});
  t=mc(t+2000,'#rm-close',()=>unmodal('rm'),400);
  C(t+100,'Click <b>Export to Excel</b> to download the filtered responses');
  t=mc(t+250,'#btn-export',()=>{const d=document.createElement('div');d.className='dlc';d.id='dlc';d.innerHTML=`<span class="xl">X</span><div style="flex:1"><b>Form_Responses_20-10-2026.xlsx</b><div class="dlb"><i></i></div><small id="dls">Downloading…</small></div>`;$('#ov').appendChild(d);},450);
  at(t+80,()=>$('#dlc').classList.add('ok'));
  at(t+700,()=>{$('#dls').innerHTML='✓ Completed · 24 KB';});
  at(t+2200,()=>{const d=$('#dlc');d&&d.remove();});

function S_del(){
  const C=(t,h)=>cap(t,6,'Delete & restore',h);
  C(0,'Back in <b>Form Builder</b>, click the <b>delete</b> icon on a form');
  let t=mc(250,'#m-forms .mm',()=>fly(true),450);
  at(t+150,()=>$('#fl-builder').classList.add('hl'));
  t=mc(t+200,'#fl-builder',()=>{fly(false);ST.forms.unshift({id:'dsi',t:'Daily Store Inspection',s:'Daily',st:'active',r:3});page('pg-list');renderList();},300);
  t=mc(t+300,'#r-cfs .del',()=>modal(confirmHTML('Are you sure you want to delete “Customer Feedback Survey”? It will be moved to the archive.','Yes, delete'),'cf'),450);
  t=mc(t+400,'#cf-yes',()=>{unmodal('cf');$('#r-cfs').classList.add('gone');},380);
  at(t+450,()=>{const f=ST.forms.find(x=>x.id==='cfs');ST.forms=ST.forms.filter(x=>x!==f);f.st='closed';ST.arch.unshift(f);renderList();});
  toast(t+100,'Deleted','Form moved to the archive',2000);
  C(t+500,'Turn on <b>Show Archived</b> to see deleted forms');
  t=mc(t+600,'#sw-arch',()=>{sw('#sw-arch',true);ST.showArch=true;renderList();},450);
  C(t+150,'Deleted forms show a gray <b>Closed</b> badge — click <b>Restore</b>');
  t=mc(t+600,'#r-cfs .rst',()=>modal(confirmHTML('Restore “Customer Feedback Survey”? It will return to the active list as a Draft.','Yes, restore'),'cf'),450);
  t=mc(t+400,'#cf-yes',()=>{unmodal('cf');$('#r-cfs').classList.add('gone');},380);
  at(t+450,()=>{const f=ST.arch.find(x=>x.id==='cfs');ST.arch=ST.arch.filter(x=>x!==f);f.st='draft';f.flash=1;ST.forms.splice(2,0,f);renderList();});
  toast(t+100,'Restored','Form restored as Draft',2000);
  t=mc(t+600,'#sw-arch',()=>{sw('#sw-arch',false);ST.showArch=false;renderList();},400);
  C(t+100,'The form is back in the active list as <b>Draft</b>');
  mv(t+300,'#r-cfs .badge',450);
  return t+2000;
}

function S_outro(){at(0,()=>{layer('L-outro');curShow(false);$('#cap').classList.add('hide');$$('#ov > *').forEach(e=>e.remove());});return 4000;}

const SCENES=[['Intro',S_intro],['Create a form',S_create,1,'Create'],['Assign to employees',S_assign,2,'Assign'],['Employee fills form',S_fill,3,'Fill on mobile'],['Checkout blocking',S_checkout,4,'Checkout rule'],['View responses',S_resp,5,'Responses'],['Delete & restore',S_del,6,'Delete & restore'],['Outro',S_outro]];
const CH=[];let TOTAL=0;
for(const [n,f,num,short] of SCENES){base=TOTAL;CH.push({n,t:TOTAL,num,short});TOTAL+=f();}
E.sort((a,b)=>a.t-b.t||a.o-b.o);

/* ======================= player ======================= */
let clock=0,idx=0,playing=false,last=0,frozen=[];
const run=e=>{try{e.fn()}catch(err){console.warn(err)}};
function freeze(){frozen=document.getAnimations().filter(a=>a.playState==='running');frozen.forEach(a=>a.pause());}
function thaw(){frozen.forEach(a=>{if(a.playState==='paused')a.play();});frozen=[];}
function seek(ms){
  ms=Math.max(0,Math.min(TOTAL,ms));seeking=true;stage.classList.add('instant');build();
  idx=0;clock=ms;while(idx<E.length&&E[idx].t<=ms)run(E[idx++]);
  void stage.offsetWidth;
  requestAnimationFrame(()=>{
    stage.classList.remove('instant');seeking=false;
    // entry animations restart when 'instant' is lifted — jump them to their end state
    document.getAnimations().forEach(a=>{if(isFinite(a.effect.getComputedTiming().endTime))a.finish();});
    if(!playing)freeze();
  });
}
function play(){if(clock>=TOTAL)seek(0);playing=true;thaw();ui();}
function pause(){playing=false;freeze();ui();}
const toggle=()=>playing?pause():play();
const fmt=ms=>{const s=Math.floor(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
const bp=document.getElementById('bp');
function ui(){
  const f=clock/TOTAL;document.getElementById('fill').style.width=f*100+'%';document.getElementById('knob').style.left=f*100+'%';
  document.getElementById('tm').textContent=fmt(clock)+' / '+fmt(TOTAL);
  let c=CH[0];for(const x of CH)if(x.t<=clock)c=x;document.getElementById('chap').textContent=c.n;
  bp.innerHTML=playing?'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>':'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4l13 8-13 8z"/></svg>';
  document.getElementById('player').classList.toggle('paused',!playing);
}
function loop(now){
  const dt=Math.min(100,now-(last||now));last=now;
  if(playing){clock+=dt;while(idx<E.length&&E[idx].t<=clock)run(E[idx++]);if(clock>=TOTAL){clock=TOTAL;pause();}}
  ui();requestAnimationFrame(loop);
}
function fit(){const w=vp.clientWidth,h=vp.clientHeight;SC=Math.min(w/1280,h/720);stage.style.transform=`translate(${(w-1280*SC)/2}px,${(h-720*SC)/2}px) scale(${SC})`;}
window.addEventListener('resize',fit);
bp.onclick=toggle;
document.getElementById('br').onclick=()=>{seek(0);play();};
vp.addEventListener('click',toggle);
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();toggle();}});
document.getElementById('ticks').innerHTML=CH.slice(1).map(c=>`<i class="tick" style="left:${c.t/TOTAL*100}%" title="${c.n}"></i>`).join('');
const bar=document.getElementById('bar');let drag=false,wasPlaying=false;
const barMs=e=>{const r=bar.getBoundingClientRect();return Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*TOTAL;};
bar.addEventListener('pointerdown',e=>{drag=true;wasPlaying=playing;bar.setPointerCapture(e.pointerId);if(playing){playing=false;}seek(barMs(e));});
bar.addEventListener('pointermove',e=>{if(drag){clock=barMs(e);}});
bar.addEventListener('pointerup',e=>{if(!drag)return;drag=false;seek(barMs(e));if(wasPlaying)play();else freeze();});

fit();
const hp=new URLSearchParams(location.hash.slice(1));
seek((parseFloat(hp.get('t'))||0)*1000);
if(!hp.has('p'))play();else pause();
requestAnimationFrame(loop);
</script>
