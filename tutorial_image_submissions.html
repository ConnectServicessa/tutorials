<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Image Submissions Tutorial</title>
<style>
:root{
 --bp:#1a5c4c;--bph:#154d40;--bpd:#0f3d32;--ac:#1D9E75;--acs:#e3f4ee;--bg:#F5F5F5;--sm:#F8F9FA;--bd:#E8E8E8;--in:#D9DEDC;
 --t1:#333;--t2:#666;--t3:#999;--err:#EF4444;--ok:#22C55E;--warn:#F59E0B;
 --g:#2E7D32;--gbg:#E8F5E9;--o:#E65100;--obg:#FFF3E0;--rd:#C62828;--rdbg:#FFEBEE;
 --shc:0 2px 8px rgba(0,0,0,.08);--shp:0 12px 32px rgba(0,0,0,.14);
 --app:#1a5c4c;--app-d:#0f3d32;--mint:#1D9E75;--mint-l:#8fe0c4;
 --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0c1a17;overflow:hidden;font-family:var(--font)}
.player{display:flex;flex-direction:column;height:100%}
.vp{flex:1;position:relative;overflow:hidden;cursor:pointer}
#stage{position:absolute;left:0;top:0;width:1440px;height:810px;transform-origin:0 0;overflow:hidden;background:var(--bg)}
.ic{width:1em;height:1em;flex:none;vertical-align:-.125em}
button{font:inherit;cursor:pointer}
.instant,.instant *{transition:none!important;animation:none!important}
.layer{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s,visibility 0s .5s}
.layer.on{opacity:1;visibility:visible;transition:opacity .5s}

/* ---------- intro / outro ---------- */
.hero{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;
  background:radial-gradient(circle at 78% 18%,rgba(29,158,117,.35),transparent 42%),radial-gradient(circle at 12% 90%,rgba(29,158,117,.22),transparent 40%),linear-gradient(135deg,#0f3d32,#1a5c4c 65%,#1f6d5a)}
.hero .lgw{background:#fff;border-radius:18px;padding:18px 30px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.hero .lgw img{height:66px;display:block}
.hero h1{font-size:68px;margin:36px 0 12px;font-weight:700;letter-spacing:-.02em}
.hero p{font-size:26px;margin:0;color:#cdeee2}
.pills{display:flex;gap:10px;margin-top:40px;flex-wrap:wrap;justify-content:center;max-width:1100px}
.pills span{border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.08);border-radius:30px;padding:9px 16px;font-size:16px;color:#e6f7f2}
.layer.on .hero>*{animation:up .6s both}
.layer.on .hero>:nth-child(2){animation-delay:.15s}.layer.on .hero>:nth-child(3){animation-delay:.3s}.layer.on .hero>:nth-child(4){animation-delay:.45s}
@keyframes up{from{opacity:0;transform:translateY(18px)}}
.hero .done{width:80px;height:80px;border-radius:50%;background:var(--ac);display:grid;place-items:center;font-size:40px;color:#fff;margin-bottom:26px}
.hero .sub2{font-size:17px;color:#a9dccb;margin-top:30px}

/* ---------- portal shell (new design) ---------- */
#L-portal{background:var(--bg);color:var(--t1)}
.sb{position:absolute;left:0;top:0;bottom:0;width:250px;background:var(--bp);color:#fff;display:flex;flex-direction:column;box-shadow:2px 0 12px rgba(0,0,0,.12);z-index:6}
.sb-brand{flex:none;height:60px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.sb-logo{width:100%;height:42px;padding:6px 14px;background:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center}
.sb-logo img{max-height:100%;max-width:100%;display:block}
.sb-search{flex:none;padding:12px 14px 4px}
.sb-sbox{height:36px;display:flex;align-items:center;gap:9px;padding:0 11px;border:1px solid rgba(255,255,255,.14);border-radius:8px;background:rgba(255,255,255,.08);font-size:13px;color:rgba(255,255,255,.55)}
.sb-sbox .ic{font-size:13px;color:rgba(255,255,255,.6)}
.sb-nav{flex:1;position:relative;overflow:hidden;padding:4px 0 10px}
.sb-sec+.sb-sec{margin-top:6px}
.sb-st{padding:14px 20px 6px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.5);white-space:nowrap}
.sb-h,.sb-l{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:42px;padding:0 18px 0 15px;border-left:3px solid transparent;color:rgba(255,255,255,.86);font-size:14px;font-weight:500;transition:background .15s,color .15s;white-space:nowrap}
.sb-h>.ic:first-child{font-size:17px;width:20px}
.sb-h .lb{flex:1;overflow:hidden;text-overflow:ellipsis}
.sb-h .car{font-size:11px;opacity:.7;transition:transform .2s}
.sb-g.open>.sb-h .car{transform:rotate(180deg)}
.sb-g.has>.sb-h{color:#fff}
.sb-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .25s ease}
.sb-g.open>.sb-b{grid-template-rows:1fr}
.sb-in{min-height:0;overflow:hidden}
.sb-l{min-height:38px;padding-left:47px;font-size:13.5px;color:rgba(255,255,255,.72)}
.sb-l:before{content:'';position:absolute;left:24px;width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.55}
.sb-l.wi:before{display:none}
.sb-l>.ic{position:absolute;left:19px;font-size:14px}
.sb-l.active,.sb-h.active{color:#fff;background:rgba(255,255,255,.12);border-left-color:var(--ac)}
.sb-l.active:before{opacity:1;background:var(--ac)}
.hov{background:rgba(255,255,255,.07)!important;color:#fff!important}
.sb-p{flex:none;display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.12)}
.sb-av{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:#fff;color:var(--bp);display:grid;place-items:center;font-weight:800;font-size:12px}
.sb-p div{flex:1;line-height:1.25;min-width:0}.sb-p b{display:block;font-size:13px}.sb-p small{display:block;font-size:11.5px;color:rgba(255,255,255,.65)}
.sb-p>.ic{font-size:16px;color:rgba(255,255,255,.8)}
.tb{position:absolute;left:250px;right:0;top:0;height:60px;background:#fff;box-shadow:0 1px 0 var(--bd),0 2px 8px rgba(0,0,0,.04);display:flex;align-items:center;gap:12px;padding:0 20px;z-index:5}
.tbi{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;min-width:38px;padding:0 10px;border-radius:8px;color:var(--t2);font-size:18px;position:relative}
.tbi small{font-size:12px;font-weight:700}
.tbb{position:absolute;top:4px;right:4px;min-width:17px;height:17px;border-radius:9px;background:var(--err);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px;border:2px solid #fff}
.bcn{flex:1;display:flex;align-items:center;font-size:13.5px;color:var(--t2);white-space:nowrap;padding-left:14px}
.bcn span{display:inline-flex;align-items:center;gap:6px}
.bcn span+span:before{content:'';width:6px;height:6px;border-right:1.5px solid var(--t3);border-top:1.5px solid var(--t3);transform:rotate(45deg);margin:0 14px 0 10px}
.bcn span .ic{color:var(--t3);font-size:15px}
.bcn span:last-child{color:var(--t1);font-weight:600}
.tbp{display:flex;align-items:center;gap:10px;padding:4px 8px;margin-left:6px}
.tbp .av{width:36px;height:36px;border-radius:50%;background:var(--bp);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;border:2px solid var(--acs)}
.tbp div{line-height:1.25}.tbp b{display:block;font-size:13px;color:var(--t1)}.tbp small{font-size:11.5px;color:var(--t3)}
.tbp>.ic{color:var(--t3);font-size:12px}
.pm{position:absolute;left:250px;right:0;top:60px;bottom:0;overflow:hidden}
.si{transition:transform .45s cubic-bezier(.4,0,.2,1)}
.pm>.si{padding-bottom:120px}
.pg{display:none}.pg.on{display:block;animation:fade .3s both}
@keyframes fade{from{opacity:0}}
.phd{display:flex;align-items:center;gap:12px;padding:24px 28px}
.pit{flex:1;display:flex;align-items:center;gap:14px}
.pic{width:44px;height:44px;border-radius:12px;background:var(--acs);color:var(--bp);display:grid;place-items:center;font-size:22px;flex:none}
.pit h1{margin:0;font-size:21.6px;font-weight:700;color:var(--t1)}
.pit small{display:block;color:var(--t2);font-size:13px;margin-top:2px}
.pc{padding:0 28px 28px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 16px;border-radius:8px;font-size:14px;font-weight:600;border:1px solid transparent;white-space:nowrap;line-height:1;transition:filter .15s,background .15s}
.btn.pri{background:var(--bp);border-color:var(--bp);color:#fff}
.btn.sec{background:#fff;border-color:var(--bp);color:var(--bp)}
.btn.sm{height:32px;padding:0 12px;font-size:13px}
.btn.dis{opacity:.55}
.pr{filter:brightness(.88)}
.card{background:#fff;border-radius:8px;box-shadow:var(--shc)}
.lab{display:block;font-size:12.5px;font-weight:600;color:var(--t2);margin-bottom:8px;letter-spacing:.01em;white-space:nowrap}
.lab em{color:var(--err);font-style:normal;font-weight:700;margin-left:2px}
.fi,.dd{border:1px solid var(--in);border-radius:8px;padding:0 12px;height:38px;font-size:14px;color:var(--t1);background:#fff;position:relative;display:flex;align-items:center;transition:border-color .15s,box-shadow .15s;white-space:nowrap;overflow:hidden}
.fi.empty:before{content:attr(data-ph);position:absolute;left:12px;color:var(--t3);pointer-events:none;white-space:nowrap}
.fi.focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(29,158,117,.15);overflow:visible}
.fi.focus .v:after{content:'';display:inline-block;width:1.5px;height:1.1em;background:var(--t1);vertical-align:-3px;margin-left:1px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.fi.date>.ic{position:absolute;right:11px;color:var(--t2);font-size:15px}
.dd{justify-content:space-between;gap:8px}.dd .lbl{overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:8px;min-width:0}
.dd .lbl .ic{color:var(--bp)}
.dd .lbl.ph{color:var(--t3)}.dd>.ic{color:var(--t2);font-size:13px;flex:none}
.dd.open{border-color:var(--ac);box-shadow:0 0 0 3px rgba(29,158,117,.15)}
.ck{display:inline-grid;place-items:center;width:18px;height:18px;border:1.5px solid #b9c2bf;border-radius:4px;background:#fff;color:#fff;font-size:12px;transition:.15s;flex:none}
.ck .ic{opacity:0}.ck.on{background:var(--bp);border-color:var(--bp)}.ck.on .ic{opacity:1}
.sw{display:inline-block;width:42px;height:24px;border-radius:30px;background:#ced4da;position:relative;transition:background .25s;vertical-align:middle;flex:none}
.sw:after{content:'';position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .25s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw.on{background:var(--ac)}.sw.on:after{transform:translateX(18px)}
.pill{display:inline-flex;align-items:center;justify-content:center;min-width:72px;height:24px;padding:0 10px;border-radius:16px;font-size:12px;font-weight:700;white-space:nowrap;background:#eef0ef;color:var(--t2)}
.pill.active{background:var(--gbg);color:var(--g)}.pill.paused{background:var(--obg);color:var(--o)}.pill.closed{background:var(--rdbg);color:var(--rd)}
.opill{display:inline-flex;align-items:center;justify-content:center;min-width:84px;height:24px;padding:0 10px;border-radius:16px;background:#fff;font-size:12px;font-weight:700;color:var(--t2);box-shadow:inset 0 0 0 1.5px var(--bd);white-space:nowrap}
.opill.rv{color:var(--g);background:var(--gbg);box-shadow:inset 0 0 0 1.5px var(--g)}
.opill.active{color:var(--g);background:var(--gbg);box-shadow:inset 0 0 0 1.5px var(--g)}

/* filter bars */
.flt{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;padding:16px;margin-bottom:16px;background:#fff;border-radius:8px;box-shadow:var(--shc)}
.fg{display:flex;flex-direction:column;flex:1 1 160px;min-width:140px}
.fg.date{flex:0 1 160px}.fg.search{flex:2 1 240px}.fg.auto{flex:0 0 auto;min-width:0}
.chkl{display:inline-flex;align-items:center;gap:8px;height:38px;font-size:13px;color:var(--t2);white-space:nowrap}
/* tables */
.tcard{padding:0;overflow:hidden}
.tr{display:grid;align-items:center;column-gap:0;min-height:46px;border-bottom:1px solid rgba(0,0,0,.05);font-size:13.5px;color:var(--t1);max-height:60px;transition:max-height .4s,opacity .35s,min-height .4s,background 1s}
.tr>span{padding:0 12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr.th{background:var(--sm);color:var(--t2);font-weight:700;font-size:12.5px;min-height:42px;border-bottom:1px solid var(--bd)}
.th .so{font-size:10px;opacity:.35;margin-left:6px}
.tr.gone{max-height:0;min-height:0;opacity:0;overflow:hidden;border:0}
.tr.flash{background:#fff6d6}
.tr.in{animation:fade .4s both}
.tr .c{text-align:center}
.tr.lst{grid-template-columns:44px 1.9fr 1.3fr 1fr .9fr .9fr .95fr .95fr 1.2fr 56px}
.tr.rsp{grid-template-columns:36px 74px 142px 90px 106px 60px 1fr 1fr 134px 100px 110px;font-size:13px}
.tr.th.rsp>span{white-space:normal;line-height:1.2}
.tr.rsp>span{padding:0 8px}
.nm{font-weight:600}
.cntb{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:16px;background:var(--acs);color:var(--bp);font-size:12.5px;font-weight:700}
.cntb .ic{font-size:12px}
.rbtn{width:30px;height:30px;border:1px solid var(--bd);border-radius:8px;background:#fff;color:var(--t2);display:inline-grid;place-items:center;font-size:15px;padding:0}
.rbtn.on{border-color:var(--bp);color:var(--bp)}
.tlink{display:inline-flex;align-items:center;gap:6px;color:var(--bp);font-weight:600}
.tfoot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-top:1px solid var(--bd)}
.tfe{display:flex;align-items:center;gap:16px;margin-left:auto;font-size:13px;color:var(--t2)}
.psz{display:inline-flex;align-items:center;gap:8px}
.psz .sel{height:32px;min-width:72px;border:1px solid var(--in);border-radius:8px;display:inline-flex;align-items:center;justify-content:space-between;gap:10px;padding:0 8px 0 10px;color:var(--t1)}
.psz .sel .ic{font-size:11px;color:var(--t2)}
.pgr{display:flex;align-items:center;gap:4px}
.pgr b{min-width:32px;height:32px;padding:0 8px;border:1px solid var(--bd);border-radius:8px;background:#fff;color:var(--t2);font-weight:600;font-size:13.5px;display:inline-grid;place-items:center;transition:background .2s,color .2s}
.pgr b.cur{background:var(--bp);border-color:var(--bp);color:#fff}
.pgr b.dis{opacity:.45}.pgr b .ic{font-size:12px}
/* KPI */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}
.kpi{display:flex;align-items:center;gap:14px;padding:16px;border-left:5px solid var(--bp);border-radius:8px;background:#fff;box-shadow:var(--shc)}
.kpi .ki{flex:none;width:44px;height:44px;border-radius:12px;background:var(--acs);color:var(--bp);display:grid;place-items:center;font-size:20px}
.kpi b{display:block;font-size:26px;font-weight:700;line-height:1.1;color:var(--t1)}
.kpi small{font-size:12.5px;font-weight:600;color:var(--t2)}
.chartc{padding:18px 20px}.chartc h3{margin:0 0 6px;font-size:15px;font-weight:700}
.bars{display:flex;align-items:flex-end;gap:16px;height:260px;padding-top:14px;border-bottom:1px solid var(--bd)}
.bars i{flex:1;background:linear-gradient(var(--ac),var(--bp));border-radius:6px 6px 0 0;opacity:.9}

/* builder */
.fsb{display:flex;align-items:center;gap:10px;padding:24px 28px}
.sbadge{display:inline-flex;align-items:center;height:24px;padding:0 12px;border-radius:16px;background:#fff;font-size:12px;font-weight:700;color:var(--t2);box-shadow:inset 0 0 0 1.5px var(--bd);transition:.3s}
.sbadge.active{color:var(--g);background:var(--gbg);box-shadow:inset 0 0 0 1.5px var(--g)}
.uns{font-size:12px;color:var(--o);font-weight:600}.uns.sv{color:var(--t3);font-weight:400}
.fbp{display:flex;flex-direction:column;gap:16px}
.fbc{padding:18px 20px;background:#fff;border-radius:8px;box-shadow:var(--shc)}
.fbh{display:flex;align-items:center;gap:12px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--bd)}
.fbt{display:inline-flex;align-items:center;gap:10px;margin:0 auto 0 0;font-size:16px;font-weight:700;color:var(--t1)}
.fbt>span{width:32px;height:32px;border-radius:8px;background:var(--acs);color:var(--bp);display:grid;place-items:center;font-size:15px}
.frow{display:grid;gap:16px;margin-bottom:20px}.frow:last-child{margin-bottom:0}
.frow.c2{grid-template-columns:1fr 1fr}.frow.c3{grid-template-columns:1fr 1fr 1fr}.frow.c1{grid-template-columns:1fr}
.ta{height:62px;align-items:flex-start;padding-top:9px}
.swb{display:flex;align-items:center;height:38px;gap:10px;font-size:13px;color:var(--t2)}
.brt{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 8px 0 14px;border:1px solid var(--bd);border-radius:16px;background:var(--sm);font-size:13px;font-weight:600;color:var(--t2)}
.scard{margin-bottom:14px;border:1px solid var(--bd);border-left:4px solid var(--bp);border-radius:12px;background:var(--sm);overflow:hidden}
.scard:last-child{margin-bottom:0}
.sch{display:flex;align-items:center;gap:10px;padding:12px 14px;background:#fff;border-bottom:1px solid var(--bd)}
.scard.col .sch{border-bottom:0}
.sch>.ic{color:var(--t2);font-size:13px;width:16px}
.grip{flex:none;width:28px;height:28px;display:inline-grid;place-items:center;color:var(--t3);font-size:13px;border-radius:6px}
.snum{flex:none;min-width:26px;height:26px;padding:0 6px;border-radius:16px;background:var(--bp);color:#fff;font-size:12px;font-weight:700;display:inline-grid;place-items:center}
.sch .fi{flex:1;font-size:15px;font-weight:700}
.scnt{font-size:12px;font-weight:600;color:var(--t3);white-space:nowrap}
.ib{flex:none;width:38px;height:38px;border:1px solid var(--bd);border-radius:8px;background:#fff;color:var(--t2);display:inline-grid;place-items:center;font-size:14px;padding:0}
.qa{padding:14px}
.qc{position:relative;padding:14px 16px;margin-bottom:12px;border:1px solid var(--bd);border-radius:8px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.04);animation:fade .35s both;transition:border-color .2s,box-shadow .2s}
.qc:has(.focus){border-color:var(--ac);box-shadow:0 0 0 3px rgba(29,158,117,.12)}
.qrow{display:flex;align-items:center;gap:10px}
.qb{flex:none;padding:3px 10px;border-radius:16px;background:var(--acs);color:var(--bp);font-size:12px;font-weight:700}
.qrow .fi{flex:1;height:44px;font-size:16px;font-weight:600}
.qind{margin-left:38px}
.qctl{display:flex;align-items:center;gap:10px;margin-top:12px}
.qctl .qtype{width:220px;flex:none}
.reqt{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 8px 0 12px;border:1px solid var(--bd);border-radius:8px;background:var(--sm);font-size:13px;font-weight:600;color:var(--t2)}
.sp{flex:1}
.hrow{margin-top:10px}.hrow .fi{font-size:13px;font-style:italic}
.qcfg{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;font-weight:600;color:var(--t2)}
.qcfg .dd{width:110px}
.va{margin-top:10px;padding:10px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--sm);display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;color:var(--t2)}
.opts{margin-top:12px}
.op{display:flex;align-items:center;gap:8px;margin-bottom:8px;animation:fade .3s both}
.op .fi{flex:1}
.op .goto{display:none;width:200px;flex:none;font-size:13.5px}
.br .op .goto{display:flex;animation:fade .3s both}
.opa{display:flex;align-items:center;gap:12px;margin-top:4px}
.addb{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 12px;border:1px dashed var(--ac);border-radius:8px;background:transparent;color:var(--bp);font-size:13px;font-weight:600}
.addb .ic{font-size:12px}
.addb.full{width:100%;height:40px}
.oth{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--t2)}
.aft{display:none;align-items:center;gap:10px;margin-top:14px;padding:10px 12px;border:1px dashed var(--ac);border-radius:8px;background:var(--acs);font-size:13px;font-weight:600;color:var(--bp)}
.br .aft{display:flex;animation:fade .3s both}
.aft .dd{width:280px}
.hint{margin:-4px 0 14px;font-size:12.5px;color:var(--t3)}
.arow{display:flex;align-items:flex-end;gap:12px}
.arow .fg{flex:1 1 180px}
.atb{margin-top:16px;border:1px solid var(--bd);border-radius:8px;overflow:hidden;display:none}
.atb.on{display:block}
.atb .tr{grid-template-columns:1fr 1.4fr 1fr 60px;min-height:44px}
.atb .ib{width:30px;height:30px;font-size:13px}
.fba{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;background:#fff;border-radius:8px;box-shadow:var(--shc)}

/* overlays */
#ov{position:absolute;inset:0;z-index:50;pointer-events:none}
.ddp{position:absolute;background:#fff;border:1px solid var(--bd);border-radius:8px;box-shadow:var(--shp);padding:4px;font-size:14px;color:var(--t1);z-index:3;animation:pop .16s both}
.ddp div{padding:0 12px;height:36px;display:flex;align-items:center;gap:9px;white-space:nowrap;border-radius:6px}
.ddp div .ic{color:var(--bp)}
.ddp div.hl{background:var(--acs);color:var(--bp)}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}}
.menu{position:absolute;width:220px;padding:6px;background:#fff;border:1px solid var(--bd);border-radius:12px;box-shadow:var(--shp);animation:pop .16s both}
.menu div{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:6px;font-size:13.5px;font-weight:500;color:var(--t1)}
.menu div .ic{width:16px;color:var(--t2)}
.menu div.hl{background:var(--acs);color:var(--bp)}.menu div.hl .ic{color:var(--bp)}
.menu div.dng,.menu div.dng .ic{color:var(--rd)}
.menu div.dng.hl{background:var(--rdbg)}
.toast{position:absolute;right:16px;top:72px;width:360px;background:#fff;border-left:4px solid var(--ok);border-radius:8px;padding:14px 16px;display:flex;gap:12px;box-shadow:var(--shp);animation:tin .35s both;font-size:14px;color:var(--t1)}
.toast>.ic{font-size:22px;color:var(--ok);margin-top:1px}
.toast b{display:block;font-weight:700}.toast p{margin:2px 0 0;color:var(--t2);font-size:13.5px;line-height:1.35}
.toast.out{animation:tout .35s both}
@keyframes tin{from{opacity:0;transform:translateX(40px)}}
@keyframes tout{to{opacity:0;transform:translateX(40px)}}
.mbg{position:absolute;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;animation:fade .2s both}
.dlg{background:#fff;border-radius:12px;box-shadow:0 24px 64px rgba(0,0,0,.25);overflow:hidden;animation:fade .2s both}
.dh{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;border-bottom:1px solid var(--bd);font-size:17px;font-weight:700;color:var(--t1)}
.dh .x{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;color:var(--t2);font-size:16px}
.cdlg{width:460px}
.cdb{display:flex;gap:12px;padding:20px 24px;font-size:14.5px;color:var(--t1);line-height:1.5;align-items:flex-start}
.cdb>.ic{font-size:24px;color:var(--warn);margin-top:-1px}
.cdb p{margin:0}
.df{display:flex;justify-content:flex-end;gap:10px;padding:14px 24px;border-top:1px solid var(--bd)}
.rmd{width:720px}
.rbody{padding:18px 24px 6px;max-height:600px;overflow:hidden}
.rtr{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--bd)}
.rtr h3{margin:0;font-size:17px;font-weight:700}
.rmeta{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 18px;margin-bottom:16px}
.rmeta small{display:block;font-size:11.5px;font-weight:600;color:var(--t3)}.rmeta b{font-size:13.5px;font-weight:600}
.dsec{margin-bottom:14px;border:1px solid var(--bd);border-radius:8px;overflow:hidden}
.dsec h4{margin:0;padding:10px 14px;background:var(--acs);border-left:4px solid var(--bp);font-size:14px;font-weight:700;color:var(--bp)}
.dans{padding:9px 14px;border-top:1px solid var(--bd);font-size:14px}.dsec h4+.dans{border-top:0}
.dans .q{font-weight:600;margin-bottom:3px}.dans .a{color:var(--t2)}
.dstars{display:inline-flex;align-items:center;gap:2px;color:#F5B50A;font-size:16px}.dstars .ic{fill:#F5B50A}.dstars .o{fill:none;color:#d6d6d6}
.dstars em{font-style:normal;color:var(--t2);font-weight:700;font-size:13px;margin-left:8px}
.sigf{display:inline-flex;padding:6px;border:1px solid var(--bd);border-radius:8px;background:#fff}
.sigf svg{width:230px;height:72px;display:block}
.sigf path{fill:none;stroke:#13325b;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.dlc{position:absolute;right:16px;top:72px;width:340px;background:#fff;border-radius:12px;box-shadow:var(--shp);padding:14px;display:flex;gap:12px;align-items:center;animation:tin .3s both}
.xl{width:38px;height:44px;border-radius:6px;background:#1d6f42;color:#fff;font-weight:800;display:grid;place-items:center;font-size:15px;flex:none}
.dlc b{font-size:13.5px;color:var(--t1);display:block}
.dlc small{color:var(--t2);font-size:12px}
.dlb{height:4px;background:#e6e9ee;border-radius:3px;margin:7px 0 5px;overflow:hidden}
.dlb i{display:block;height:100%;width:0;background:#1d6f42;transition:width .6s}
.dlc.ok .dlb i{width:100%}

/* image submissions */
.qaw{position:relative}
#qa .qcar{font-size:11px;transition:transform .15s}#qa.open .qcar{transform:rotate(180deg)}
.ikpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.ikpi{--kc:var(--bp);--kb:var(--acs);display:flex;align-items:center;gap:14px;padding:16px;border:2px solid transparent;border-left:5px solid var(--kc);border-radius:8px;background:#fff;box-shadow:var(--shc);transition:background .2s,border-color .2s}
.ikpi.ok{--kc:var(--g);--kb:var(--gbg)}.ikpi.pa{--kc:var(--o);--kb:var(--obg)}.ikpi.mi{--kc:var(--rd);--kb:var(--rdbg)}
.ikpi .ki{flex:none;width:44px;height:44px;border-radius:12px;background:var(--kb);color:var(--kc);display:grid;place-items:center;font-size:20px;transition:.2s}
.ikpi.sel{border-color:var(--kc);background:var(--kb)}.ikpi.sel .ki{background:var(--kc);color:#fff}
.ikpi b{display:block;font-size:26px;font-weight:700;line-height:1.1}.ikpi small{font-size:12.5px;font-weight:600;color:var(--t2)}
.tr.img{grid-template-columns:30px 86px 1.15fr 88px 106px 56px .9fr 92px 70px 70px 56px 46px 56px 108px;font-size:13px;min-height:44px}
.tr.img>span{padding:0 6px}
.tr.th.img{font-size:12px}
.tr.th.img>span{white-space:normal;line-height:1.25}
.th .so{margin-left:4px}.th.img>span:nth-child(2) .so{opacity:1;color:var(--bp)}.th.img>span:nth-child(2){color:var(--bp);background:var(--acs);align-self:stretch;display:flex;align-items:center}
.tr.img .tg{color:var(--t3)}
.row-completed{background:var(--gbg)}.row-partial{background:var(--obg)}.row-missed{background:var(--rdbg)}
.tr.exp{border-bottom-color:transparent}
.c-ok{color:var(--g);font-weight:600}.c-pa{color:var(--o);font-weight:600}.c-mi{color:var(--rd);font-weight:600}
.ipill{display:inline-flex;align-items:center;justify-content:center;min-width:84px;height:24px;padding:0 10px;border-radius:16px;background:#fff;font-size:12px;font-weight:700;white-space:nowrap}
.ipill.completed,.ipill.ev-onTime{color:var(--g);box-shadow:inset 0 0 0 1.5px var(--g)}
.ipill.partial,.ipill.ev-late{color:var(--o);box-shadow:inset 0 0 0 1.5px var(--o)}
.ipill.missed,.ipill.ev-missed{color:var(--rd);box-shadow:inset 0 0 0 1.5px var(--rd)}
.ipill.ev-upcoming{color:#1565C0;box-shadow:inset 0 0 0 1.5px #1565C0}
.ipill.sm{min-width:0;height:20px;padding:0 8px;font-size:11px}
.idet{padding:16px 20px 20px;border-bottom:2px solid var(--bd);background:#fff}
.ick{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-bottom:14px;font-size:13px;color:var(--t2)}
.ick b{color:var(--t1);display:inline-flex;align-items:center;gap:6px}.ick small{flex-basis:100%;font-size:12px;color:var(--t3)}
.rng{padding:2px 8px;border-radius:10px;background:var(--gbg);color:var(--g);font-weight:700;font-size:12px}
.itl{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.iev{--ec:var(--bd);display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--bd);border-left:4px solid var(--ec);border-radius:8px;background:#fff}
.iev.ev-onTime{--ec:var(--g)}.iev.ev-late{--ec:var(--o)}.iev.ev-missed{--ec:var(--rd)}.iev.ev-upcoming{--ec:#1565C0}
.evd{color:var(--ec);font-size:18px;display:grid}
.evb{flex:1;min-width:0}.evh{display:flex;align-items:center;gap:8px;margin-bottom:4px;font-size:13.5px}
.lby{color:var(--o);font-weight:700;font-size:12px}
.evm{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--t2)}.evm .ic{font-size:11px;margin-right:4px}.evm b{color:var(--t1)}
.ith{flex:none;width:56px;height:56px;border:1px solid var(--bd);border-radius:8px;overflow:hidden;background:var(--sm);display:grid;place-items:center;color:var(--t3);font-size:18px}
.ith svg{width:100%;height:100%;display:block}
.pdlg{width:760px}.pvb{padding:16px}.pvb svg{display:block;width:100%;height:520px;border-radius:8px}

/* ---------- caption & cursor ---------- */
#cap{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:rgba(15,61,50,.95);color:#fff;border-radius:14px;padding:11px 22px 12px 12px;display:flex;gap:14px;align-items:center;max-width:1000px;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:80;transition:opacity .3s;white-space:nowrap}
#cap.hide{opacity:0}
#cap .cn{width:38px;height:38px;border-radius:10px;background:var(--ac);color:#fff;display:grid;place-items:center;font-weight:800;font-size:17px;flex:none}
#cap small{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mint-l);font-weight:700}
#cap .tx{font-size:18px;margin-top:1px}
#cap .tx b{color:#a8f0d6}
#cap .tx.sw2{animation:fade .3s both}
#cur{position:absolute;left:0;top:0;z-index:100;pointer-events:none;opacity:0;transition:transform .45s cubic-bezier(.45,.05,.25,1),opacity .3s}
#cur.vis{opacity:1}
#cur svg.ar{position:absolute;left:-4px;top:-3px;width:28px;height:28px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35));transform-origin:4px 3px}
#cur .touch{display:none;position:absolute;left:-19px;top:-19px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.35);border:2.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.2),0 4px 14px rgba(0,0,0,.3)}
#cur.t svg.ar{display:none}#cur.t .touch{display:block}
#cur.p svg.ar{animation:cp .25s}#cur.t.p .touch{animation:tp .3s}
@keyframes cp{50%{transform:scale(.78)}}
@keyframes tp{50%{transform:scale(.72);background:rgba(29,158,117,.55)}}
.rip{position:absolute;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;border:2.5px solid var(--ac);z-index:99;pointer-events:none;animation:rip .55s ease-out forwards}
@keyframes rip{from{transform:scale(.2);opacity:1}to{transform:scale(1.4);opacity:0}}

/* ---------- controls ---------- */
.ctl{height:48px;flex:none;background:#0f2420;display:flex;align-items:center;gap:6px;padding:0 12px;color:#cfe3de;font-size:13px;user-select:none}
.ctl button{background:none;border:0;color:#e9f6f2;width:36px;height:36px;border-radius:8px;display:grid;place-items:center;flex:none}
.ctl button:hover{background:rgba(255,255,255,.08)}
.ctl button svg{width:20px;height:20px}
#stp{flex:none;background:rgba(29,158,117,.2);color:#bdf0dd;border-radius:6px;padding:3px 8px;font-weight:700;font-size:12px;font-variant-numeric:tabular-nums}
#tm{font-variant-numeric:tabular-nums;min-width:86px;text-align:center;flex:none}
#bar{position:relative;flex:1;height:28px;cursor:pointer;touch-action:none}
#bar .trk{position:absolute;left:0;right:0;top:12px;height:5px;border-radius:3px;background:rgba(255,255,255,.16)}
#fill{position:absolute;left:0;top:12px;height:5px;border-radius:3px;background:var(--ac);width:0}
#knob{position:absolute;top:8px;width:13px;height:13px;margin-left:-6.5px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.tick{position:absolute;top:10px;width:2px;height:9px;background:#0f2420;margin-left:-1px}
#chap{flex:none;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#9fcfc3;padding-left:8px}
@media (max-width:560px){#chap,#stp{display:none}#tm{min-width:70px;font-size:12px}.ctl{padding:0 6px;gap:2px}}
#big{position:absolute;left:50%;top:50%;width:76px;height:76px;margin:-38px 0 0 -38px;border-radius:50%;background:rgba(15,61,50,.88);display:grid;place-items:center;opacity:0;transition:opacity .25s;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.35)}
#big svg{width:34px;height:34px;color:#fff;margin-left:4px}
.paused #big{opacity:1}
</style>
</head>

function setXY(x,y,dur,ease){cx=x;cy=y;cur.style.transitionDuration=dur+'ms, 300ms';cur.style.transitionTimingFunction=ease?ease+', ease':'';cur.style.transform=`translate(${x}px,${y}px)`;}
function finalRect(el){
  const r=rel(el), sc=el.closest('.scroll'); if(!sc) return r;
  const inner=sc.firstElementChild, ri=rel(inner), rs=rel(sc), tIn=r.y-ri.y;
  const off=+sc.dataset.off||0, vh=sc.clientHeight, mb=+(sc.dataset.mb||110), top=tIn-off; let n=off;
  if(top<16||top+r.h>vh-mb){n=tIn-vh*.35;n=Math.max(0,Math.min(Math.max(0,inner.offsetHeight-vh),n));}
  if(Math.abs(n-off)>1){inner.style.transform=`translateY(${-n}px)`;sc.dataset.off=n;}else n=off;
  return{x:r.x,w:r.w,h:r.h,y:rs.y+tIn-n};
}

function toastShow(id,title,msg){const t=document.createElement('div');t.className='toast';t.id=id;t.innerHTML=`${ic('checkc')}<div>${title?`<b>${title}</b>`:''}<p>${msg}</p></div>`;$('#ov').appendChild(t);}
function modal(html,id){const m=document.createElement('div');m.className='mbg';m.id=id;m.innerHTML=html;$('#ov').appendChild(m);}
function unmodal(id){const m=$('#'+id);m&&m.remove();}
const confirmHTML=(head,msg)=>`<div class="dlg cdlg"><div class="dh">${head}<span class="x">${ic('x')}</span></div><div class="cdb">${ic('warn')}<p>${msg}</p></div><div class="df"><button class="btn pri" id="cf-yes">${ic('check')}Yes</button><button class="btn sec">${ic('x')}No</button></div></div>`;
function menuOpen(btnSel,items){const b=$(btnSel),r=rel(b),m=document.createElement('div');m.className='menu';m.id='rmenu';m.style.left=(r.x+r.w-220)+'px';m.style.top=(r.y+r.h+4)+'px';
  m.innerHTML=items.map(([i,l,id,d])=>`<div id="${id}"${d?' class="dng"':''}>${ic(i)}${l}</div>`).join('');$('#ov').appendChild(m);b.classList.add('on');}
function menuClose(){const m=$('#rmenu');m&&m.remove();$$('.rbtn.on').forEach(b=>b.classList.remove('on'));}



/* image submissions views */
function rowH(r,i){const e=EMP[r[0]];return `<div class="tr img row-${r[9]} in" id="ir${i+1}"><span class="c tg">${ic('chevR')}</span><span>${e[0]}</span><span class="nm">${e[1]}</span><span>${e[2]}</span><span>${r[1]}</span><span>${r[2]}</span><span>${r[3]}</span><span>21 Oct 2026</span><span class="c">${r[4]}</span><span class="c"><b>${r[5]}</b></span><span class="c c-ok">${r[6]}</span><span class="c c-pa">${r[7]}</span><span class="c c-mi">${r[8]}</span><span><span class="ipill ${r[9]}">${STL[r[9]]}</span></span></div>`;}
function renderImg(set,status){
  const rows=(set==='all'?ROWS_ALL:set==='ruh'?ROWS_RUH:[ROWS_RUH[1]]).filter(r=>!status||r[9]===status);
  $('#irows').innerHTML=rows.map(rowH).join('');
  KPI[set].forEach((v,i)=>$('#kv'+i).textContent=v);
  ['all','completed','partial','missed'].forEach(k=>$('#k-'+k).classList.toggle('sel',(status||'all')===k));
  const total=status?KPI[set][['all','completed','partial','missed'].indexOf(status)]:KPI[set][0];
  $('#icount').textContent=total>100?`Showing 100 of ${total} employees`:`Showing ${total} of ${total} employees`;$('#ipgr').innerHTML=total>100?`<b class="dis">${ic('back')}</b><b class="cur">1</b><b>2</b><b>${ic('chevR')}</b>`:'';
}
function expand(){
  const r=$('#ir1');r.classList.add('exp');r.querySelector('.tg').innerHTML=ic('chev');
  r.insertAdjacentHTML('afterend',`<div class="idet in" id="idet"><div class="ick"><b>${ic('pin')}Check-in location</b><span>35 m from the store</span><span class="rng">In range</span><span class="tlink">${ic('ext')}Map</span>
   <small>Photos are uploaded without a location, so the day's check-in location is shown.</small></div>
   <div class="itl">${IMGS.map((m,i)=>`<div class="iev ev-${m[2]}"><span class="evd">${ic(EVI[m[2]])}</span><div class="evb"><div class="evh"><strong>${m[0]}</strong><span class="ipill sm ev-${m[2]}">${EVL[m[2]]}</span>${m[5]?`<span class="lby">${m[5]}</span>`:''}</div>
    <div class="evm"><span>${ic('cal')}Scheduled: <b>${m[3]}</b></span><span>${ic('clock')}Actual: <b>${m[4]}</b></span></div></div>
    ${m[2]==='onTime'||m[2]==='late'?`<span class="ith" id="th${i}">${photo(m[1],'t'+i)}</span>`:`<span class="ith emp">${ic('image')}</span>`}</div>`).join('')}</div></div>`);
}
function previewOpen(i){const m=IMGS[i];modal(`<div class="dlg pdlg"><div class="dh">Khalid Al-Zahrani · ${m[0]} · ${m[4]}<span class="x" id="pv-x">${ic('x')}</span></div><div class="pvb">${photo(m[1],'big')}</div></div>`,'pv');}
function qaMenu(on){const q=$('#qa');q.classList.toggle('open',on);const m=$('#qam');if(m)m.remove();if(!on)return;
  const r=rel(q),d=document.createElement('div');d.className='menu';d.id='qam';d.style.width='240px';d.style.left=(r.x+r.w-240)+'px';d.style.top=(r.y+r.h+6)+'px';
  d.innerHTML=`<div id="qa-sum">${ic('file')}Export Summary Excel</div><div id="qa-det">${ic('list')}Export Detailed Excel</div>`;$('#ov').appendChild(d);}
function dl(name,size){const o=$('#dlc');o&&o.remove();const d=document.createElement('div');d.className='dlc';d.id='dlc';d.innerHTML=`<span class="xl">X</span><div style="flex:1"><b>${name}</b><div class="dlb"><i></i></div><small id="dls">Downloading…</small></div>`;$('#ov').appendChild(d);
  requestAnimationFrame(()=>d.classList.add('ok'));}

/* ======================= timeline DSL ======================= */
const E=[];let base=0;
const at=(t,fn)=>E.push({t:base+t,fn,o:E.length});
const mv=(t,sel,dur=450,o)=>at(t,()=>cursorTo($(sel),dur,o));
const clk=(t,sel,fn)=>at(t,()=>{press(sel);fn&&fn();});
function mc(t,sel,fn,dur=450,o){mv(t,sel,dur,o);clk(t+dur+60,sel,()=>{const e=$(sel);if(!(e&&e.classList.contains('fi')))blurAll();fn&&fn();});return t+dur+60;}
function typ(t,sel,text,step=40){at(t,()=>focusEl(sel));for(let i=1;i<=text.length;i++)at(t+i*step,()=>setVal(sel,text.slice(0,i)));return t+text.length*step;}
function DD(t,sel,items,i,after,label){
  const c=mc(t,sel,()=>ddOpen(sel,items),380), it=`#ddp [data-i="${i}"]`;
  mv(c+180,it,330);at(c+400,()=>{const e=$(it);e&&e.classList.add('hl');});
  clk(c+570,it,()=>{ddPick(sel,label||items[i]);after&&after();});
  return c+570;
}
function MENU(t,btn,items,id,after){
  const c=mc(t,btn,()=>menuOpen(btn,items),420);
  mv(c+250,'#'+id,380);at(c+560,()=>{const e=$('#'+id);e&&e.classList.add('hl');});
  clk(c+700,'#'+id,()=>{menuClose();after&&after();});
  return c+700;
}
let tid=0;
function toast(t,title,msg,dur=2600){const id='t'+(tid++);at(t,()=>toastShow(id,title,msg));at(t+dur,()=>{const e=$('#'+id);e&&e.classList.add('out');});at(t+dur+400,()=>{const e=$('#'+id);e&&e.remove();});}
const cap=(t,n,l,h)=>at(t,()=>setCap(n,l,h));



/* ======================= scenes ======================= */
function S_intro(){at(0,()=>{layer('L-intro');curShow(false);$('#cap').classList.add('hide');capN=0;});return 3800;}

function S_open(){
  const C=(t,h)=>cap(t,1,'Open the page',h);
  at(0,()=>{layer('L-portal');page('pg-dash');});at(350,()=>curShow(true,false));
  C(250,'In the sidebar, open <b>Operations → Employees</b>');
  let t=mc(500,'#sg-emp .sb-h',()=>sbOpen('emp',true),650);
  C(t+300,'Choose <b>Image Submissions</b>');
  t=mc(t+500,'#sl-img',()=>{sbActive('img');page('pg-img');renderImg('all');},450);
  C(t+200,'The page opens with <b>today’s</b> submissions for all of your clients');
  mv(t+700,'#irows',600,{fy:.2,fx:.4});
  return t+3000;
}

function S_filter(){
  const C=(t,h)=>cap(t,2,'Filter & search',h);
  C(0,'Narrow the scope: pick a <b>Client</b>, then a <b>City</b> — the store list follows');
  let t=DD(300,'#i-client',['Al Noor Foods','Gulf Beverages Co.','Riyadh Home Care','Desert Dairy'],0);
  t=DD(t+200,'#i-city',['Riyadh','Jeddah','Dammam','Makkah','Khobar'],0);
  C(t+100,'<b>From / To</b> default to today — change them to look at other days');
  mv(t+300,'.fg.date .fi',500,{fx:.4});
  C(t+1700,'Data loads only when you click <b>Search</b>');
  t=mc(t+2000,'#i-go',()=>renderImg('ruh'),500);
  return t+1800;
}

function S_kpi(){
  const C=(t,h)=>cap(t,3,'KPI cards',h);
  C(0,'The cards count employees by status: <b>Completed</b>, <b>Partial</b> and <b>Missed</b>');
  let t=0;mv(300,'#k-completed',500);mv(1100,'#k-partial',400);mv(1800,'#k-missed',400);
  C(2600,'Click a card to filter the table — e.g. <b>Partial</b> (orange rows)');
  t=mc(2900,'#k-partial',()=>renderImg('ruh','partial'),500);
  C(t+1600,'Click <b>Total Employees</b> to show everyone again');
  t=mc(t+1900,'#k-all',()=>renderImg('ruh'),500);
  return t+1500;
}

function S_expand(){
  const C=(t,h)=>cap(t,4,'Image details',h);
  C(0,'Search an employee by <b>name, employment no. or ID</b>');
  let t=mc(300,'#i-search',()=>focusEl('#i-search'),500,{fx:.3});
  t=typ(t+50,'#i-search','Khalid',70);
  t=mc(t+200,'#i-go',()=>{blurAll();renderImg('one');},450);
  C(t+300,'Click the row to expand it');
  t=mc(t+700,'#ir1 .nm',expand,500);
  C(t+300,'Each required image: <b>scheduled vs. actual</b> time and <b>On Time / Late / Missed / Upcoming</b>');
  mv(t+500,'#idet .ev-late .evh',600,{fx:.3});
  mv(t+2300,'#idet .ev-missed .evh',500,{fx:.3});
  C(t+3800,'The day’s <b>check-in location</b> is shown, with distance and a <b>Map</b> button');
  mv(t+4000,'#idet .rng',500);
  C(t+5600,'Click a thumbnail to see the photo');
  t=mc(t+5900,'#th2',()=>previewOpen(2),600);
  t=mc(t+2200,'#pv-x',()=>unmodal('pv'),500);
  return t+700;
}

function S_export(){
  const C=(t,h)=>cap(t,5,'Export to Excel',h);
  C(0,'Open <b>Quick Actions</b> to export what’s on screen');
  let t=mc(300,'#qa',()=>qaMenu(true),600);
  C(t+200,'<b>Export Summary Excel</b> — one row per employee and day');
  mv(t+400,'#qa-sum',400);at(t+900,()=>$('#qa-sum').classList.add('hl'));
  t=mc(t+1300,'#qa-sum',()=>{qaMenu(false);dl('ImageSubmissions_Summary_2026-10-21.xlsx');},150);
  at(t+700,()=>{$('#dls').innerHTML='✓ Completed · 22 KB';});
  C(t+1600,'<b>Export Detailed Excel</b> — one row per required image');
  t=mc(t+1900,'#qa',()=>qaMenu(true),450);
  mv(t+300,'#qa-det',400);at(t+800,()=>$('#qa-det').classList.add('hl'));
  t=mc(t+1100,'#qa-det',()=>{qaMenu(false);dl('ImageSubmissions_Detailed_2026-10-21.xlsx');},150);
  at(t+700,()=>{$('#dls').innerHTML='✓ Completed · 61 KB';});
  return t+2600;
}

function S_outro(){at(0,()=>{layer('L-outro');curShow(false);$('#cap').classList.add('hide');capN=0;$$('#ov > *').forEach(e=>e.remove());});return 4000;}

const SCENES=[['Intro',S_intro],['Open the page',S_open,1,'Open'],['Filter & search',S_filter,2,'Filter'],['KPI cards',S_kpi,3,'KPI cards'],['Image details',S_expand,4,'Expand a row'],['Export to Excel',S_export,5,'Export'],['Outro',S_outro]];
const CH=[];let TOTAL=0;
for(const [n,f,num,short] of SCENES){base=TOTAL;CH.push({n,t:TOTAL,num,short});TOTAL+=f();}
E.sort((a,b)=>a.t-b.t||a.o-b.o);

/* ======================= player ======================= */
let clock=0,idx=0,playing=false,last=0,frozen=[];
const run=e=>{try{e.fn()}catch(err){console.warn(err)}};
function freeze(){frozen=document.getAnimations().filter(a=>a.playState==='running');frozen.forEach(a=>a.pause());}
function thaw(){frozen.forEach(a=>{if(a.playState==='paused')a.play();});frozen=[];}
function seek(ms){
  ms=Math.max(0,Math.min(TOTAL,ms));seeking=true;stage.classList.add('instant');build();
  idx=0;clock=ms;while(idx<E.length&&E[idx].t<=ms)run(E[idx++]);
  void stage.offsetWidth;
  requestAnimationFrame(()=>{
    stage.classList.remove('instant');seeking=false;
    document.getAnimations().forEach(a=>{if(isFinite(a.effect.getComputedTiming().endTime))a.finish();});
    if(!playing)freeze();
  });
}
function play(){if(clock>=TOTAL)seek(0);playing=true;thaw();ui();}
function pause(){playing=false;freeze();ui();}
const toggle=()=>playing?pause():play();
const fmt=ms=>{const s=Math.floor(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
const bp=document.getElementById('bp');
function ui(){
  const f=clock/TOTAL;document.getElementById('fill').style.width=f*100+'%';document.getElementById('knob').style.left=f*100+'%';
  document.getElementById('tm').textContent=fmt(clock)+' / '+fmt(TOTAL);
  let c=CH[0];for(const x of CH)if(x.t<=clock)c=x;document.getElementById('chap').textContent=c.n;
  document.getElementById('stp').textContent=c.num?`Step ${c.num} / ${NSTEPS}`:(clock<CH[1].t?'Intro':'Done');
  bp.innerHTML=playing?'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>':'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4l13 8-13 8z"/></svg>';
  document.getElementById('player').classList.toggle('paused',!playing);
}
function loop(now){
  const dt=Math.min(100,now-(last||now));last=now;
  if(playing){clock+=dt;while(idx<E.length&&E[idx].t<=clock)run(E[idx++]);if(clock>=TOTAL){clock=TOTAL;pause();}}
  ui();requestAnimationFrame(loop);
}
function fit(){const w=vp.clientWidth,h=vp.clientHeight;SC=Math.min(w/W,h/H);stage.style.transform=`translate(${(w-W*SC)/2}px,${(h-H*SC)/2}px) scale(${SC})`;}
window.addEventListener('resize',fit);
bp.onclick=toggle;
document.getElementById('br').onclick=()=>{seek(0);play();};
vp.addEventListener('click',toggle);
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();toggle();}});
document.getElementById('ticks').innerHTML=CH.slice(1).map(c=>`<i class="tick" style="left:${c.t/TOTAL*100}%" title="${c.n}"></i>`).join('');
const bar=document.getElementById('bar');let drag=false,wasPlaying=false;
const barMs=e=>{const r=bar.getBoundingClientRect();return Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*TOTAL;};
bar.addEventListener('pointerdown',e=>{drag=true;wasPlaying=playing;bar.setPointerCapture(e.pointerId);if(playing){playing=false;}seek(barMs(e));});
bar.addEventListener('pointermove',e=>{if(drag){clock=barMs(e);}});
bar.addEventListener('pointerup',e=>{if(!drag)return;drag=false;seek(barMs(e));if(wasPlaying)play();else freeze();});

fit();
// Seek hooks: #t=<seconds>, or #step=<n>[&at=<seconds into the step>]; add &p to start paused.
function fromHash(){
  const hp=new URLSearchParams(location.hash.slice(1));let ms=(parseFloat(hp.get('t'))||0)*1000;
  if(hp.has('step')){const c=CH.find(x=>x.num==hp.get('step'));if(c)ms=c.t+(parseFloat(hp.get('at'))||0)*1000;}
  if(hp.has('shot'))document.getElementById('big').style.display='none';
  seek(ms);if(!hp.has('p'))play();else pause();
}
window.addEventListener('hashchange',fromHash);
fromHash();
requestAnimationFrame(loop);
</script>
</body>
