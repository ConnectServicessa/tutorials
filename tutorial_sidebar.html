<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portal Navigation Guide</title>
<style>
:root{--p:#1a5c4c;--ph:#154d40;--pd:#0f3d32;--ac:#1D9E75;--acs:#e3f4ee;--bg:#F5F5F5;--sm:#F8F9FA;--zb:#FAFAFA;--bd:#E8E8E8;--t1:#333;--t2:#666;--t3:#999;--ok:#22C55E;--err:#EF4444;--warn:#F59E0B;--info:#3B82F6;--blue:#1565C0;--r:8px;--rl:12px;--sh:0 2px 8px rgba(0,0,0,.08);--pop:0 12px 32px rgba(0,0,0,.14);
 --font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0b1a16;overflow:hidden;font-family:var(--font);-webkit-font-smoothing:antialiased}
.player{display:flex;flex-direction:column;height:100%}
.vp{flex:1;position:relative;overflow:hidden;cursor:pointer}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;background:var(--bg);color:var(--t1);font-size:14px}
.ic{width:1em;height:1em;flex:none;vertical-align:-.125em}
button{font:inherit;cursor:pointer}
.instant,.instant *{transition:none!important;animation:none!important}
.layer{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s,visibility 0s .5s}
.layer.on{opacity:1;visibility:visible;transition:opacity .5s}
@keyframes fade{from{opacity:0}}
@keyframes up{from{opacity:0;transform:translateY(18px)}}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}}

/* ---------- intro / outro ---------- */
.hero{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;
 background:radial-gradient(circle at 80% 16%,rgba(29,158,117,.38),transparent 42%),radial-gradient(circle at 10% 92%,rgba(29,158,117,.22),transparent 40%),linear-gradient(135deg,#0f3d32,#1a5c4c 62%,#1f6e5a)}
.hero .lgw{background:#fff;border-radius:16px;padding:16px 28px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.hero .lgw img{height:58px;display:block}
.hero h1{font-size:60px;margin:32px 0 10px;font-weight:700;letter-spacing:-.02em}
.hero p{font-size:23px;margin:0;color:#c9efe1}
.pills{display:flex;gap:10px;margin-top:36px;flex-wrap:wrap;justify-content:center;max-width:1000px}
.pills span{border:1px solid rgba(255,255,255,.26);background:rgba(255,255,255,.08);border-radius:30px;padding:9px 16px;font-size:15px;color:#e6f7f2}
.pills span b{color:#7fe0bf;margin-right:6px}
.layer.on .hero>*{animation:up .6s both}
.layer.on .hero>:nth-child(2){animation-delay:.15s}.layer.on .hero>:nth-child(3){animation-delay:.3s}.layer.on .hero>:nth-child(4){animation-delay:.45s}.layer.on .hero>:nth-child(5){animation-delay:.6s}
.hero .done{width:78px;height:78px;border-radius:50%;background:var(--ac);display:grid;place-items:center;font-size:40px;color:#fff;margin-bottom:26px}
.hero .sub2{font-size:16px;color:#a9dccb;margin-top:28px}
.hero ul{list-style:none;padding:0;margin:26px 0 0;display:flex;gap:12px;flex-wrap:wrap;justify-content:center;max-width:980px}
.hero li{background:rgba(255,255,255,.1);border-radius:12px;padding:10px 16px;font-size:15px;color:#e6f7f2;display:flex;gap:8px;align-items:center}
.hero li .ic{color:#7fe0bf}

/* ---------- shell: sidebar ---------- */
#L-portal{background:var(--bg)}
.app-sidebar{position:absolute;left:0;top:0;bottom:0;width:250px;display:flex;flex-direction:column;background:var(--p);color:#fff;box-shadow:2px 0 12px rgba(0,0,0,.12);transition:width .22s ease;overflow:hidden;z-index:20}
.sb-brand{position:relative;flex:none;height:60px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.sb-logo{display:flex;align-items:center;justify-content:center;width:100%;height:42px;padding:6px 14px;background:#fff;border-radius:var(--r)}
.sb-logo img{max-height:100%;max-width:100%;object-fit:contain}
.sb-logo-mini{display:none;width:36px;height:36px;margin:0 auto;border-radius:10px;background:#fff;color:var(--p);font-weight:800;font-size:20px;align-items:center;justify-content:center}
.sb-search{flex:none;padding:12px 14px 4px;position:relative}
.sb-search-box{position:relative;display:flex;align-items:center}
.sb-search-box>.ic{position:absolute;left:11px;font-size:13px;color:rgba(255,255,255,.6)}
.sb-in{width:100%;height:36px;padding:0 30px 0 32px;border:1px solid rgba(255,255,255,.14);border-radius:var(--r);background:rgba(255,255,255,.08);color:#fff;font-size:13px;display:flex;align-items:center;white-space:nowrap;overflow:hidden;transition:background .15s,border-color .15s}
.sb-in.empty:before{content:attr(data-ph);color:rgba(255,255,255,.55)}
.sb-in.focus{background:rgba(255,255,255,.14);border-color:var(--ac)}
.sb-in.focus .v:after{content:'';display:inline-block;width:1.5px;height:1.1em;background:#fff;vertical-align:-3px;margin-left:1px;animation:blink 1s steps(1) infinite}
.sb-clear{position:absolute;right:4px;width:26px;height:26px;border:0;border-radius:6px;background:transparent;color:rgba(255,255,255,.75);font-size:11px;display:none;place-items:center;padding:0}
.sb-clear.on{display:grid}
.sb-search-rail{display:none;position:relative;width:100%;height:40px;border:0;border-radius:var(--r);background:transparent;color:rgba(255,255,255,.86);font-size:16px;place-items:center}
.sb-nav{flex:1;position:relative;overflow:hidden}
.sb-nav>.si{padding:4px 0 10px;transition:transform .45s cubic-bezier(.4,0,.2,1)}
.sb-section+.sb-section{margin-top:6px}
.sb-section-title{padding:14px 20px 6px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.5);white-space:nowrap;overflow:hidden;transition:background .3s,color .3s}
.sb-empty{display:none;padding:16px 20px;font-size:13px;color:rgba(255,255,255,.6)}
.sb-empty.on{display:block;animation:fade .25s both}
.sb-group{position:relative}
.sb-head,.sb-link{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:42px;padding:0 18px;border:0;border-left:3px solid transparent;background:transparent;color:rgba(255,255,255,.86);font-size:14px;font-weight:500;text-align:left;transition:background-color .15s,color .15s,border-color .15s}
.sb-head.hov,.sb-link.hov{background:rgba(255,255,255,.07);color:#fff}
.sb-direct.active,.sb-link.active{color:#fff;background:rgba(255,255,255,.12);border-left-color:var(--ac)}
.sb-icon{flex:0 0 20px;font-size:17px;text-align:center}
.sb-label{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-caret{flex:none;font-size:11px;opacity:.7;transition:transform .2s}
.sb-group.has-active>.sb-head{color:#fff}
.sb-group.open>.sb-head .sb-caret,.searching .sb-group>.sb-head .sb-caret{transform:rotate(180deg)}
.sb-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .22s ease}
.sb-group.open>.sb-body,.searching .sb-group>.sb-body{grid-template-rows:1fr}
.sb-inner{min-height:0;overflow:hidden}
.sb-fly-title{display:none}
.sb-link{min-height:38px;padding-left:50px;font-size:13.5px;color:rgba(255,255,255,.72)}
.sb-link:before{content:'';position:absolute;left:27px;top:50%;margin-top:-2.5px;width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.55}
.sb-link .sb-li{position:absolute;left:22px;font-size:14px}
.sb-link.wi:before{display:none}
.sb-link.active:before{opacity:1;background:var(--ac)}
.sb-tip{display:none}
.hide{display:none!important}
.sb-link.match{box-shadow:inset 0 0 0 2px rgba(127,224,191,.85);border-radius:6px}
.sb-profile{flex:none;display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.12)}
.sb-av{flex:0 0 34px;width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:#fff;color:var(--p);display:grid;place-items:center;font-weight:800;font-size:13px}
.sb-ptext{display:flex;flex-direction:column;line-height:1.25}
.sb-pname{font-size:13px;font-weight:600;color:#fff}
.sb-prole{font-size:11.5px;color:rgba(255,255,255,.65)}
.sb-logout{position:relative;flex:none;width:32px;height:32px;border:0;border-radius:8px;background:transparent;color:rgba(255,255,255,.8);display:grid;place-items:center;font-size:16px;padding:0}
.sb-logout.hov{background:rgba(255,255,255,.12);color:#fff}
/* tutorial annotation ring */
.ring{position:absolute;border:2.5px solid #7fe0bf;border-radius:10px;box-shadow:0 0 0 4px rgba(127,224,191,.25),0 0 22px rgba(29,158,117,.5);pointer-events:none;z-index:60;animation:ringin .35s both;transition:all .35s}
@keyframes ringin{from{opacity:0;transform:scale(1.06)}}
.note{position:absolute;background:#fff;color:var(--t1);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.2);padding:12px 14px;font-size:13.5px;line-height:1.45;width:270px;z-index:61;animation:pop .3s both;border-left:4px solid var(--ac)}
.note b{color:var(--p)}
.note small{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ac);margin-bottom:3px}

/* rail (collapsed) */
.mini .app-sidebar{width:60px;overflow:visible}
.mini .sb-brand{padding:0 12px}.mini .sb-logo{display:none}.mini .sb-logo-mini{display:flex}
.mini .sb-search{padding:8px 8px 0}.mini .sb-search-box{display:none}.mini .sb-search-rail{display:grid}
.mini .sb-nav{overflow:visible}.mini .sb-nav>.si{transform:none!important}
.mini .sb-section-title{height:1px;margin:8px 14px;padding:0;font-size:0;background:rgba(255,255,255,.16)}
.mini .sb-section+.sb-section{margin-top:0}
.mini .sb-head{justify-content:center;padding:0;gap:0}
.mini .sb-head .sb-label,.mini .sb-head .sb-caret{display:none}
.mini .sb-group.has-active>.sb-head{border-left-color:var(--ac);background:rgba(255,255,255,.1)}
.mini .sb-tip{display:block;position:absolute;top:50%;left:calc(100% + 10px);z-index:5;padding:6px 10px;border-radius:6px;background:#10382e;color:#fff;font-size:12.5px;font-weight:500;white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.22);opacity:0;visibility:hidden;transform:translateY(-50%);transition:opacity .12s,visibility .12s}
.mini .hov>.sb-tip{opacity:1;visibility:visible}
.mini .sb-group>.sb-body{display:block;position:absolute;top:0;left:100%;z-index:6;min-width:220px;padding:0 0 6px;background:var(--p);border-radius:0 var(--r) var(--r) 0;box-shadow:0 8px 24px rgba(0,0,0,.22);visibility:hidden;opacity:0;transform:translateX(-6px);transition:opacity .15s,transform .15s,visibility .15s}
.mini .sb-group.fly>.sb-body{visibility:visible;opacity:1;transform:none}
.mini .sb-inner{overflow:visible}
.mini .sb-fly-title{display:block;padding:12px 16px 8px;margin-bottom:4px;border-bottom:1px solid rgba(255,255,255,.1);font-size:12px;font-weight:700;letter-spacing:.04em;color:rgba(255,255,255,.7);text-transform:uppercase;white-space:nowrap}
.mini .sb-link{padding-left:40px;padding-right:16px}.mini .sb-link:before{left:18px}.mini .sb-link .sb-li{left:14px}
.mini .sb-profile{justify-content:center;padding:12px 0}.mini .sb-av,.mini .sb-ptext{display:none}

/* ---------- topbar ---------- */
.tb{position:absolute;left:250px;right:0;top:0;height:60px;display:flex;align-items:center;gap:12px;padding:0 20px;background:#fff;box-shadow:0 1px 0 var(--bd),0 2px 8px rgba(0,0,0,.04);z-index:15;transition:left .22s ease}
.mini .tb,.mini .pm{left:60px}
.tb-ham{height:38px;min-width:38px;border:0;border-radius:var(--r);background:transparent;color:var(--t2);font-size:20px;display:grid;place-items:center;padding:0 9px;transition:background .15s,color .15s}
.tb-ham.hov{background:var(--acs);color:var(--p)}
.tb-bc{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--t2)}
.tb-bc .ic{font-size:14px;color:var(--t3)}.tb-bc .sep{font-size:11px;color:#bbb}
.tb-bc b{color:var(--t1);font-weight:500}
.tb-act{margin-left:auto;display:flex;align-items:center;gap:6px}
.tb-ib{position:relative;display:inline-flex;align-items:center;gap:6px;height:38px;min-width:38px;padding:0 10px;border-radius:var(--r);color:var(--t2);font-size:18px}
.tb-ib small{font-size:12px;font-weight:700}
.tb-badge{position:absolute;top:3px;right:2px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--err);color:#fff;font-size:10.5px;font-weight:700;line-height:18px;text-align:center;box-shadow:0 0 0 2px #fff}
.tb-prof{display:flex;align-items:center;gap:10px;padding:4px 8px}
.tb-av{width:36px;height:36px;border-radius:50%;background:var(--acs);color:var(--p);display:grid;place-items:center;font-weight:800;font-size:13px}
.tb-prof b{display:block;font-size:13.5px;font-weight:600;color:var(--t1)}
.tb-prof small{display:block;font-size:11.5px;color:var(--t2)}
.tb-prof>.ic{font-size:13px;color:var(--t3)}

/* ---------- main ---------- */
.pm{position:absolute;left:250px;right:0;top:60px;bottom:0;overflow:hidden;transition:left .22s ease}
.pm>.si{transition:transform .45s cubic-bezier(.4,0,.2,1);padding:0 28px 120px}
.pg{display:none}.pg.on{display:block;animation:fade .3s both}
.phd{display:flex;justify-content:space-between;align-items:center;padding:24px 0 20px}
.pt{display:flex;align-items:center;gap:14px}
.pic{width:44px;height:44px;border-radius:10px;background:#e8f2ee;display:grid;place-items:center;color:var(--p);font-size:21px}
.pt h1{margin:0;font-size:22px;font-weight:700;color:var(--t1);letter-spacing:-.01em}
.card{background:#fff;border-radius:var(--rl);box-shadow:var(--sh);padding:18px;margin-bottom:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 16px;border-radius:var(--r);font-size:14px;font-weight:600;border:1px solid transparent;transition:filter .15s,background .2s;white-space:nowrap}
.btn.pri{background:var(--p);color:#fff}.btn.acc{background:var(--ac);color:#fff}
.btn.out{background:#fff;color:var(--p);border-color:var(--p)}
.btn.lt{background:#fff;color:var(--t1);border-color:var(--bd)}
.btn.sm{height:30px;padding:0 12px;font-size:12.5px}
.btn .ic{font-size:15px}
.pr{filter:brightness(.88)}
.qa{position:relative}
.btn.dd-btn .ic:last-child{font-size:12px;margin-left:2px}
.menu{position:absolute;min-width:210px;padding:6px;background:#fff;border:1px solid var(--bd);border-radius:var(--rl);box-shadow:var(--pop);z-index:30;animation:pop .16s both}
.menu div{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:6px;font-size:13.5px;color:var(--t1);white-space:nowrap}
.menu div .ic{color:var(--t2);font-size:15px}
.menu div.hl{background:var(--acs);color:var(--p)}.menu div.hl .ic{color:var(--p)}
.menu div.danger,.menu div.danger .ic{color:var(--err)}
.menu div.danger.hl{background:#fee2e2}
/* toolbar */
.tctl{display:flex;align-items:center;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--bd)}
.srch{width:280px;height:38px;border:1px solid var(--bd);border-radius:20px;background:var(--sm);display:flex;align-items:center;gap:10px;padding:0 14px;color:var(--t1);font-size:14px;transition:border-color .2s,box-shadow .2s}
.srch>.ic{color:var(--t3);font-size:15px}
.srch .fi{border:0;background:transparent;height:auto;padding:0;flex:1;box-shadow:none}
.srch.focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(29,158,117,.15);background:#fff}
.advb{height:38px;display:flex;align-items:center;gap:10px;padding:0 16px;border:1px solid var(--bd);border-radius:var(--r);font-size:14px;font-weight:500;color:var(--t1);background:#fff;transition:all .2s}
.advb .ic{color:var(--t2);font-size:16px}
.advb.has{background:var(--acs);border-color:var(--ac);color:var(--p)}.advb.has .ic{color:var(--p)}
.colb{height:38px;width:50px;display:grid;place-items:center;border:1px solid var(--bd);border-radius:var(--r);color:var(--t2);font-size:16px}
.pgn{display:flex;align-items:center;gap:8px;padding:14px 0;font-size:13px;color:var(--t2)}
.pgn i{font-style:normal;width:32px;height:32px;border:1px solid var(--bd);border-radius:6px;display:grid;place-items:center;color:var(--t1);background:#fff}
.pgn i.on{background:var(--p);border-color:var(--p);color:#fff}
.pgn .sp{flex:1}.pgn b{color:var(--ac)}
.pgn .sel{height:32px;border:1px solid var(--bd);border-radius:6px;display:flex;align-items:center;gap:6px;padding:0 8px;color:var(--t1)}
/* table */
.tbl{border:1px solid var(--bd);border-radius:var(--r);overflow:hidden}
.tr{display:grid;align-items:center;column-gap:12px;padding:0 14px;min-height:50px;border-top:1px solid var(--bd);font-size:13px;color:var(--t1);max-height:80px;transition:max-height .4s,opacity .35s,min-height .4s,background 1.2s}
.tr:nth-child(odd):not(.th){background:var(--zb)}
.tr.th{border-top:0;background:var(--sm);font-weight:600;font-size:12.5px;min-height:52px;color:var(--t1)}
.tr.gone{max-height:0;min-height:0;opacity:0;overflow:hidden;border-top-width:0}
.tr.flash,.tr.flash:nth-child(odd){background:#cfe5fb}
.tr.in{animation:fade .4s both}
.tr>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cb{display:inline-block;width:18px;height:18px;border:1.5px solid #c9cfcd;border-radius:4px;background:#fff;vertical-align:middle}
.red{color:var(--err)}
.pill{display:inline-flex;align-items:center;justify-content:center;height:24px;min-width:34px;padding:0 10px;border-radius:16px;font-size:11px;font-weight:700}
.pill.on{background:#dcfce7;color:#15803d}.pill.off{background:#eef0ef;color:var(--t2)}
.pill.ty{background:#E3F2FD;color:var(--blue)}
.rowact{height:30px;display:inline-flex;align-items:center;gap:6px;padding:0 10px 0 12px;border:1px solid var(--bd);border-radius:var(--r);font-size:12.5px;font-weight:500;color:var(--t1);background:#fff}
.rowact .ic{font-size:11px;color:var(--t2)}
/* form fields */
.fg label{display:block;margin-bottom:9px;font-size:12.5px;font-weight:600;color:var(--t2)}
.fi,.dd{border:1px solid var(--bd);border-radius:var(--r);padding:0 12px;height:38px;font-size:14px;color:var(--t1);background:#fff;position:relative;display:flex;align-items:center;transition:border-color .2s,box-shadow .2s;white-space:nowrap;overflow:hidden}
.fi.empty:before{content:attr(data-ph);position:absolute;left:12px;color:var(--t3);pointer-events:none}
.srch .fi.empty:before{left:0}
.fi.focus,.dd.open{border-color:var(--ac);box-shadow:0 0 0 3px rgba(29,158,117,.15);overflow:visible}
.srch .fi.focus{box-shadow:none}
.fi.focus .v:after{content:'';display:inline-block;width:1.5px;height:1.1em;background:var(--t1);vertical-align:-3px;margin-left:1px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.fi.date{justify-content:space-between}.fi.date>.ic{position:absolute;right:11px;color:var(--t1);font-size:15px}
.fi.dis{background:var(--sm);color:var(--t2)}
.fi.area{height:76px;align-items:flex-start;padding-top:9px;white-space:normal}
.fi.area.empty:before{top:9px}
.dd{justify-content:space-between;gap:8px}.dd .lbl{overflow:hidden;text-overflow:ellipsis}
.dd .lbl.ph{color:var(--t3)}.dd>.ic{color:var(--t2);font-size:13px}
.ddp{position:absolute;background:#fff;border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--pop);padding:4px;font-size:14px;color:var(--t1);z-index:40;animation:pop .16s both}
.ddp div{padding:0 12px;height:36px;display:flex;align-items:center;border-radius:6px;white-space:nowrap}
.ddp div.hl{background:var(--acs);color:var(--p)}
.sw{display:inline-block;width:44px;height:24px;border-radius:30px;background:#d7dcda;position:relative;transition:background .25s;vertical-align:middle}
.sw:after{content:'';position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .25s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw.on{background:var(--p)}.sw.on:after{transform:translateX(20px)}
/* overlays */
#ov{position:absolute;inset:0;z-index:50;pointer-events:none}
.toast{position:absolute;right:20px;top:72px;width:360px;background:#fff;border-left:4px solid var(--ok);border-radius:var(--r);padding:14px 16px;display:flex;gap:12px;box-shadow:var(--pop);animation:tin .35s both;font-size:14px}
.toast>.ic{font-size:20px;color:var(--ok);margin-top:1px}
.toast b{display:block;color:var(--t1)}.toast p{margin:3px 0 0;color:var(--t2);font-size:13.5px;line-height:1.35}
.toast.out{animation:tout .35s both}
@keyframes tin{from{opacity:0;transform:translateX(40px)}}
@keyframes tout{to{opacity:0;transform:translateX(40px)}}
.mbg{position:absolute;inset:0;background:rgba(15,30,26,.55);display:flex;align-items:center;justify-content:center;animation:fade .2s both}
.dlg{background:#fff;border-radius:var(--rl);width:460px;box-shadow:0 24px 64px rgba(0,0,0,.25);overflow:hidden;animation:pop .2s both}
.dlh{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;border-bottom:1px solid var(--bd);font-size:17px;font-weight:700}
.dlh .ic{color:var(--t2);font-size:16px}
.dlb{display:flex;gap:12px;padding:24px;line-height:1.5;align-items:flex-start;font-size:14.5px}
.dlb>.ic{font-size:24px;color:var(--warn)}
.dlf{display:flex;justify-content:flex-end;gap:10px;padding:14px 24px 20px;border-top:1px solid var(--bd)}

/* ---------- caption & cursor ---------- */
#cap{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:rgba(12,44,36,.95);color:#fff;border-radius:14px;padding:10px 20px 11px 12px;display:flex;gap:13px;align-items:center;max-width:900px;box-shadow:0 10px 30px rgba(0,0,0,.28);z-index:80;transition:opacity .3s;white-space:nowrap}
#cap.hide{opacity:0}
#cap .cn{min-width:38px;height:38px;border-radius:10px;background:var(--ac);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:16px;line-height:1;flex:none;padding:0 4px}
#cap .cn i{font-style:normal;font-size:9.5px;font-weight:600;opacity:.85;margin-top:2px}
#cap small{display:block;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:#7fe0bf;font-weight:700}
#cap .tx{font-size:17px;margin-top:1px}
#cap .tx b{color:#a6f0d6}
#cap .tx.sw2{animation:fade .3s both}
#cur{position:absolute;left:0;top:0;z-index:100;pointer-events:none;opacity:0;transition:transform .45s cubic-bezier(.45,.05,.25,1),opacity .3s}
#cur.vis{opacity:1}
#cur svg{position:absolute;left:-4px;top:-3px;width:28px;height:28px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35));transform-origin:4px 3px}
#cur.p svg{animation:cp .25s}
@keyframes cp{50%{transform:scale(.78)}}
.rip{position:absolute;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;border:2.5px solid var(--ac);z-index:99;pointer-events:none;animation:rip .55s ease-out forwards}
@keyframes rip{from{transform:scale(.2);opacity:1}to{transform:scale(1.4);opacity:0}}
.key{position:absolute;z-index:99;background:#fff;border:1px solid #cfd6d3;border-bottom-width:3px;border-radius:8px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--t1);box-shadow:0 6px 16px rgba(0,0,0,.2);animation:pop .2s both}

/* ---------- controls ---------- */
.ctl{height:48px;flex:none;background:#0d211c;display:flex;align-items:center;gap:6px;padding:0 12px;color:#cfe3de;font-size:13px;user-select:none}
.ctl button{background:none;border:0;color:#e9f6f2;width:36px;height:36px;border-radius:8px;display:grid;place-items:center;flex:none}
.ctl button:hover{background:rgba(255,255,255,.08)}
.ctl button svg{width:20px;height:20px}
#tm{font-variant-numeric:tabular-nums;min-width:86px;text-align:center;flex:none}
#bar{position:relative;flex:1;height:28px;cursor:pointer;touch-action:none}
#bar .trk{position:absolute;left:0;right:0;top:12px;height:5px;border-radius:3px;background:rgba(255,255,255,.16)}
#fill{position:absolute;left:0;top:12px;height:5px;border-radius:3px;background:var(--ac);width:0}
#knob{position:absolute;top:8px;width:13px;height:13px;margin-left:-6.5px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.tick{position:absolute;top:10px;width:2px;height:9px;background:#0d211c;margin-left:-1px}
#chap{flex:none;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#9fcfc3;padding-left:8px}
@media (max-width:560px){#chap{display:none}#tm{min-width:70px;font-size:12px}.ctl{padding:0 6px;gap:2px}}
#big{position:absolute;left:50%;top:50%;width:76px;height:76px;margin:-38px 0 0 -38px;border-radius:50%;background:rgba(15,61,50,.88);display:grid;place-items:center;opacity:0;transition:opacity .25s;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.35)}
#big svg{width:34px;height:34px;color:#fff;margin-left:4px}
.paused #big{opacity:1}
.sb-pname,.sb-prole{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sb-ptext{min-width:0}
.sb-in.focus.empty:before{order:2}.sb-in.focus.empty .v{order:1}

.capt{font-size:12px;font-weight:600;color:#76808f;text-transform:uppercase;letter-spacing:.04em;margin:0 0 10px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.kpi{display:flex;align-items:center;gap:14px;background:#fff;border-radius:var(--r);border-left:5px solid #1a5c4c;padding:16px 18px;box-shadow:var(--sh)}
.kpi .ki{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:22px;color:#fff;background:#1a5c4c;flex:none}
.kpi .kv{font-size:24px;font-weight:700;color:#22304a;line-height:1.1}
.kpi .kv.tx{font-size:18px}
.kpi .kl{font-size:12px;color:#76808f;margin-top:3px}
.kpi.vac{border-left-color:var(--blue)}.kpi.vac .ki{background:#E3F2FD;color:var(--blue)}
.kpi.vac.strong .ki{background:var(--blue);color:#fff}
.kpi.inf{border-left-color:#1D9E75}.kpi.inf .ki{background:#1D9E75}
.chr{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:16px}
.chr.two{grid-template-columns:1fr 1fr}
.rc{background:#fff;border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.rch{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;color:#22304a;padding:14px 16px;border-bottom:1px solid #eef0f6}
.rch>.ic{font-size:15px;color:var(--t2)}
.rch .note2{margin-left:auto;font-weight:400;font-size:12px;color:#9aa2b1}
.rcb{padding:14px 16px;height:290px;position:relative}
.tb-gen .tr{grid-template-columns:22px repeat(var(--n),1fr)}
.note{width:360px}
.note ul{margin:6px 0 0;padding:0;list-style:none}
.note li{padding:3px 0;font-size:13px;color:#555}
.note li b{color:var(--p)}
.note .dl{display:inline-block;background:var(--acs);color:var(--p);border-radius:6px;padding:1px 7px;font-size:11.5px;font-weight:700;margin-left:4px}
.ph-chart{height:250px;display:flex;align-items:flex-end;gap:14px;padding:20px}
.ph-chart i{flex:1;background:linear-gradient(#22C55E,#1D9E75);border-radius:4px 4px 0 0;opacity:.8}
.tb-gen[data-h] .tr{grid-template-columns:22px 50px repeat(calc(var(--n) - 1),1fr)}

</style>
</head>

 at(t+500,()=>noteOn('n1',NX,130,'Results for “vac”','<b>Dashboard → Vacations</b> matches by page name.<br><b>Vacations</b> matches by group name, so all its pages are kept.'));
 at(t+3600,()=>{ringOff('r1');noteOff('n1');});
 t=bksp(t+3700,'#sb-q','vac',80,q=>sbQuery(q));
 t=typ(t+200,'#sb-q','official',90,q=>sbQuery(q));
 C(t+200,'Press <b>Enter</b> to open the first match');
 at(t+400,()=>{$('#i-vac-official').classList.add('match');});
 keyShow(t+1300,'Enter ↵','#sb-q',0,44);
 at(t+1700,()=>{$('#i-vac-official').classList.remove('match');setVal('#sb-q','');sbQuery('');blurAll();sbOpen('vacations',true);sbActive('vac-official');showPage('off');});
 C(t+1800,'<b>Official Vacations</b> opens and the search box clears itself');
 mv(t+1900,'#i-vac-official',600);
 t+=4400;
 C(t,'If nothing matches, you\'ll see <b>No matching pages</b>');
 t=mc(t+200,'#sb-q',()=>focusEl('#sb-q'),500,{fx:.3});
 t=typ(t+150,'#sb-q','payroll',90,q=>sbQuery(q));
 at(t+300,()=>ringOn('r1','#sb-empty',0));at(t+2000,()=>ringOff('r1'));
 C(t+2000,'Click <b>×</b> (or press Esc) to clear the search and see the full menu');
 t=mc(t+2200,'#sb-clear',()=>{setVal('#sb-q','');sbQuery('');blurAll();},500);
 return t+1800;
}

function S_rail(){
 const C=(t,h)=>cap(t,4,CHAPS[3],h);
 C(0,'Need more room? Click <b>☰</b> in the top bar');
 let t=mc(300,'#tb-ham',()=>{sbHov('#tb-ham',false);sbMini(true);},700);
 at(t-300,()=>sbHov('#tb-ham',true));
 C(t+500,'The sidebar shrinks to a <b>60px icon rail</b>; sections become thin dividers');
 at(t+800,()=>ringOn('r1','#sb',0));at(t+3000,()=>ringOff('r1'));
 C(t+3100,'Hover an icon to see its group as a <b>flyout</b>');
 mv(t+3300,'#g-vacations .sb-head',600);
 at(t+4000,()=>{sbHov('#g-vacations .sb-head',true);sbFly('vacations');});
 at(t+6000,()=>{sbHov('#g-vacations .sb-head',false);sbFly(null);});
 C(t+6000,'Direct links show a <b>tooltip</b>');
 mv(t+6000,'#l-clients',600);at(t+6700,()=>sbHov('#l-clients',true));at(t+8300,()=>sbHov('#l-clients',false));
 C(t+8300,'Click an icon to pin its flyout, then pick a page');
 t=mc(t+8400,'#g-employees .sb-head',()=>sbFly('employees'),600);
 t=mc(t+700,'#i-attendance',()=>{sbFly(null);sbOpen('employees',true);sbActive('attendance');showPage('attrec');},500);
 C(t+300,'The rail highlights the group of the current page');
 at(t+400,()=>ringOn('r1','#g-employees .sb-head',0));at(t+2400,()=>ringOff('r1'));
 C(t+2500,'The <b>search icon</b> expands the sidebar and puts the cursor in the search box');
 t=mc(t+2800,'#sb-rail-search',()=>{sbMini(false);},600);
 at(t+400,()=>focusEl('#sb-q'));
 C(t+800,'Click <b>☰</b> again any time to switch between the full sidebar and the rail. Your choice is remembered');
 mv(t+900,'#tb-ham',600);at(t+1500,()=>sbHov('#tb-ham',true));at(t+3800,()=>{sbHov('#tb-ham',false);blurAll();});
 return t+4000;
}

function S_user(){
 const C=(t,h)=>cap(t,5,CHAPS[4],h);
 at(0,()=>{$('#cap').style.bottom='90px';});
 C(0,'At the bottom: the signed-in user, with role and organisation');
 at(200,()=>{ringOn('r1','#sb-prof',-2);noteOn('n1',NX,560,'Signed in as',`<b>${USER.name}</b><br>${USER.sub}`);});
 mv(200,'.sb-pname',600);
 at(3000,()=>noteOff('n1'));
 C(3000,'Click the <b>logout</b> icon to sign out; you return to the Login page');
 mv(3200,'#sb-logout',600);at(3800,()=>{sbHov('#sb-logout',true);ringOn('r1','#sb-logout',2);});
 at(6000,()=>{sbHov('#sb-logout',false);ringOff('r1');});
 C(6000,'Logout is also in the profile menu at the top right');
 at(6100,()=>ringOn('r1','.tb-prof',2));mv(6100,'.tb-prof',700);
 at(8400,()=>{ringOff('r1');$('#cap').style.bottom='';});
 return 8600;
}

function S_outro(){at(0,()=>{layer('L-outro');curShow(false);$('#cap').classList.add('hide');clearOv();});return 4500;}

const SCENES=[['Intro',S_intro],[CHAPS[0],S_sections,1],[CHAPS[1],S_groups,2],[CHAPS[2],S_search,3],[CHAPS[3],S_rail,4],[CHAPS[4],S_user,5],['Outro',S_outro]];

const CH=[];let TOTAL=0;
NCH=SCENES.filter(s=>s[2]).length;
for(const [n,f,num,short] of SCENES){base=TOTAL;CH.push({n,t:TOTAL,num,short});TOTAL+=f();}
E.sort((a,b)=>a.t-b.t||a.o-b.o);

let clock=0,idx=0,playing=false,last=0,frozen=[];
const run=e=>{try{e.fn()}catch(err){console.warn(err)}};
function freeze(){frozen=document.getAnimations().filter(a=>a.playState==='running');frozen.forEach(a=>a.pause());}
function thaw(){frozen.forEach(a=>{if(a.playState==='paused')a.play();});frozen=[];}
function seek(ms){
 ms=Math.max(0,Math.min(TOTAL,ms));seeking=true;stage.classList.add('instant');build();
 idx=0;clock=ms;while(idx<E.length&&E[idx].t<=ms)run(E[idx++]);
 void stage.offsetWidth;
 requestAnimationFrame(()=>{
  stage.classList.remove('instant');seeking=false;
  document.getAnimations().forEach(a=>{if(isFinite(a.effect.getComputedTiming().endTime))a.finish();});
  if(!playing)freeze();
 });
}
function play(){if(clock>=TOTAL)seek(0);playing=true;thaw();ui();}
function pause(){playing=false;freeze();ui();}
const toggle=()=>playing?pause():play();
const fmt=ms=>{const s=Math.floor(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
const bp=document.getElementById('bp');
function ui(){
 const f=clock/TOTAL;document.getElementById('fill').style.width=f*100+'%';document.getElementById('knob').style.left=f*100+'%';
 document.getElementById('tm').textContent=fmt(clock)+' / '+fmt(TOTAL);
 let c=CH[0];for(const x of CH)if(x.t<=clock)c=x;document.getElementById('chap').textContent=c.num?`Step ${c.num}/${NCH} · ${c.n}`:c.n;
 bp.innerHTML=playing?'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>':'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4l13 8-13 8z"/></svg>';
 document.getElementById('player').classList.toggle('paused',!playing);
}
function loop(now){
 const dt=Math.min(100,now-(last||now));last=now;
 if(playing){clock+=dt;while(idx<E.length&&E[idx].t<=clock)run(E[idx++]);if(clock>=TOTAL){clock=TOTAL;pause();}}
 ui();requestAnimationFrame(loop);
}
function fit(){const w=vp.clientWidth,h=vp.clientHeight;SC=Math.min(w/1280,h/720);stage.style.transform=`translate(${(w-1280*SC)/2}px,${(h-720*SC)/2}px) scale(${SC})`;}
window.addEventListener('resize',fit);
bp.onclick=e=>{e.stopPropagation();toggle();};
document.getElementById('br').onclick=()=>{seek(0);play();};
vp.addEventListener('click',toggle);
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();toggle();}
 if(e.code==='ArrowRight'||e.code==='ArrowLeft'){const d=e.code==='ArrowRight'?1:-1;let i=0;CH.forEach((c,j)=>{if(c.t<=clock+1)i=j;});i=Math.max(0,Math.min(CH.length-1,i+(d>0?1:(clock-CH[i].t>1500?0:-1))));const w=playing;seek(CH[i].t);if(w)play();}});
document.getElementById('ticks').innerHTML=CH.slice(1).map(c=>`<i class="tick" style="left:${c.t/TOTAL*100}%" title="${c.n}"></i>`).join('');
const bar=document.getElementById('bar');let drag=false,wasPlaying=false;
const barMs=e=>{const r=bar.getBoundingClientRect();return Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*TOTAL;};
bar.addEventListener('pointerdown',e=>{drag=true;wasPlaying=playing;bar.setPointerCapture(e.pointerId);if(playing){playing=false;}seek(barMs(e));});
bar.addEventListener('pointermove',e=>{if(drag){clock=barMs(e);}});
bar.addEventListener('pointerup',e=>{if(!drag)return;drag=false;seek(barMs(e));if(wasPlaying)play();else freeze();});

fit();
// Seek hooks: #t=<seconds>  |  #step=<chapter number>[&o=<ms offset into that step>]  |  add &p to start paused
const hp=new URLSearchParams(location.hash.slice(1));
let start=(parseFloat(hp.get('t'))||0)*1000;
if(hp.has('step')){const n=+hp.get('step'),c=CH.find(x=>x.num===n)||(n===0?CH[0]:CH[CH.length-1]);start=c.t+(+hp.get('o')||0);}
if(hp.has("shot"))document.getElementById("big").style.display="none";
seek(start);
if(!hp.has('p'))play();else pause();
requestAnimationFrame(loop);

</script>
