<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Managing Employees</title>
<style>
:root{--p:#1a5c4c;--pd:#0f3d32;--ph:#154d40;--a:#1D9E75;--ah:#1a8e69;--as:#e3f4ee;--bg:#F5F5F5;--sm:#F8F9FA;--bd:#E8E8E8;--t1:#333;--t2:#666;--t3:#999;
 --ok:#22C55E;--err:#EF4444;--warn:#F59E0B;--att:#2E7D32;--attbg:#E8F5E9;--abs:#E53935;--absbg:#FFEBEE;--sh:0 2px 8px rgba(0,0,0,.08);--pop:0 12px 32px rgba(0,0,0,.14);
 --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0b1a17;overflow:hidden;font-family:var(--font)}
.player{display:flex;flex-direction:column;height:100%}
.vp{flex:1;position:relative;overflow:hidden;cursor:pointer}
#stage{position:absolute;left:0;top:0;width:1440px;height:810px;transform-origin:0 0;overflow:hidden;background:var(--bg);color:var(--t1);font-size:14px}
.ic{width:1em;height:1em;flex:none;vertical-align:-.125em}
button{font:inherit;cursor:pointer}
.instant,.instant *{transition:none!important;animation:none!important}
.layer{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s,visibility 0s .5s}
.layer.on{opacity:1;visibility:visible;transition:opacity .5s}
@keyframes fade{from{opacity:0}}
@keyframes up{from{opacity:0;transform:translateY(18px)}}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}}

/* ---------- hero ---------- */
.hero{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;
 background:radial-gradient(circle at 80% 15%,rgba(29,158,117,.35),transparent 45%),radial-gradient(circle at 10% 92%,rgba(29,158,117,.22),transparent 42%),linear-gradient(135deg,#0f3d32,#1a5c4c 60%,#1f6e5a)}
.hero .lgw{background:#fff;border-radius:16px;padding:18px 32px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.hero .lgw img{height:64px;display:block}
.hero h1{font-size:68px;margin:36px 0 10px;font-weight:800;letter-spacing:-.02em}
.hero p{font-size:25px;margin:0;color:#c7eee0}
.pills{display:flex;gap:10px;margin-top:40px;flex-wrap:wrap;justify-content:center;max-width:1100px}
.pills span{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);border-radius:30px;padding:9px 16px;font-size:15px;color:#e8f8f2}
.pills b{color:#7fe0bd;margin-right:4px}
.layer.on .hero>*{animation:up .6s both}
.layer.on .hero>:nth-child(2){animation-delay:.15s}.layer.on .hero>:nth-child(3){animation-delay:.3s}.layer.on .hero>:nth-child(4){animation-delay:.45s}.layer.on .hero>:nth-child(5){animation-delay:.6s}
.hero .done{width:82px;height:82px;border-radius:50%;background:var(--a);display:grid;place-items:center;font-size:42px;color:#fff;margin-bottom:26px}
.hero .sub2{font-size:16px;color:#a9dccb;margin-top:30px}

/* ---------- sidebar ---------- */
.sb{position:absolute;left:0;top:0;bottom:0;width:250px;background:var(--p);color:#fff;display:flex;flex-direction:column;box-shadow:2px 0 12px rgba(0,0,0,.12);z-index:7}
.sb-brand{height:60px;flex:none;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.sb-logo{width:100%;height:42px;padding:6px 14px;background:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center}
.sb-logo img{max-height:100%;max-width:100%;display:block}
.sb-search{padding:12px 14px 4px;flex:none}
.sb-sbox{height:36px;border:1px solid rgba(255,255,255,.14);border-radius:8px;background:rgba(255,255,255,.08);display:flex;align-items:center;gap:9px;padding:0 11px;color:rgba(255,255,255,.55);font-size:13px}
.sb-nav{flex:1;overflow:hidden;padding:4px 0 10px;position:relative}
.sb-sec+.sb-sec{margin-top:6px}
.sb-st{padding:14px 20px 6px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.5)}
.sb-gh,.sb-ln{position:relative;display:flex;align-items:center;gap:12px;min-height:42px;padding:0 18px;border-left:3px solid transparent;color:rgba(255,255,255,.86);font-size:14px;font-weight:500;transition:background .15s,color .15s}
.sb-gh>.ic{font-size:17px;width:20px}
.sb-gh .lb{flex:1;white-space:nowrap}
.sb-gh .cr{font-size:11px;opacity:.7;transition:transform .2s}
.sb-g.open>.sb-gh .cr{transform:rotate(180deg)}
.sb-g.has>.sb-gh{color:#fff}
.sb-gb{display:grid;grid-template-rows:0fr;transition:grid-template-rows .22s}
.sb-g.open>.sb-gb{grid-template-rows:1fr}
.sb-gi{min-height:0;overflow:hidden}
.sb-ln{min-height:38px;padding-left:50px;font-size:13.5px;color:rgba(255,255,255,.72)}
.sb-ln:before{content:'';position:absolute;left:27px;width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.55}
.sb-ln.wi:before{display:none}
.sb-ln .li{position:absolute;left:22px;font-size:14px}
.sb-ln.active,.sb-gh.active{color:#fff;background:rgba(255,255,255,.12);border-left-color:var(--a)}
.sb-ln.active:before{opacity:1;background:var(--a)}
.sb-ln.pr,.sb-gh.pr{background:rgba(255,255,255,.16)}
.sb-prof{flex:none;display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid rgba(255,255,255,.1);background:#164f41}
.sb-av{width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:#fff;color:var(--p);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.sb-pt{flex:1;display:flex;flex-direction:column;line-height:1.25;min-width:0}
.sb-pt b{font-size:13px}.sb-pt small{font-size:11.5px;color:rgba(255,255,255,.65);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-prof>.ic{font-size:16px;color:rgba(255,255,255,.8)}

/* ---------- topbar ---------- */
.tb{position:absolute;left:250px;right:0;top:0;height:60px;background:#fff;box-shadow:0 1px 0 var(--bd),0 2px 8px rgba(0,0,0,.04);display:flex;align-items:center;gap:12px;padding:0 20px;z-index:6}
.tb-ham{width:38px;height:38px;border-radius:8px;display:grid;place-items:center;color:var(--t2);font-size:19px}
.bc{display:flex;align-items:center;gap:0;font-size:13.5px;color:var(--t2);margin-left:14px}
.bc a{display:flex;align-items:center;gap:6px}.bc a .ic{font-size:15px;color:var(--t3)}
.bc a:not(:last-child):after{content:'';width:6px;height:6px;border-right:1.5px solid var(--t3);border-top:1.5px solid var(--t3);transform:rotate(45deg);margin:0 14px 0 10px}
.bc a:last-child{color:var(--t1);font-weight:600}.bc a:last-child .ic{color:var(--a)}
.tb-act{margin-left:auto;display:flex;align-items:center;gap:8px}
.tb-ib{height:38px;min-width:38px;border-radius:8px;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--t2);font-size:18px;position:relative;padding:0 8px}
.tb-ib small{font-size:12px;font-weight:700}
.tb-bdg{position:absolute;top:3px;right:2px;background:var(--err);color:#fff;font-size:10px;font-weight:700;border-radius:9px;min-width:17px;height:17px;display:grid;place-items:center;border:2px solid #fff}
.tb-pro{display:flex;align-items:center;gap:10px;padding:4px 8px 4px 4px;border-radius:24px;margin-left:6px}
.tb-av{width:36px;height:36px;border-radius:50%;background:var(--as);color:var(--p);display:grid;place-items:center;font-weight:800;font-size:13px}
.tb-pro span{display:flex;flex-direction:column;line-height:1.2}.tb-pro b{font-size:13.5px}.tb-pro small{font-size:11.5px;color:var(--t3)}
.tb-pro>.ic{font-size:12px;color:var(--t3)}

/* ---------- main ---------- */
.pm{position:absolute;left:250px;right:0;top:60px;bottom:0;overflow:hidden}
.si{transition:transform .45s cubic-bezier(.4,0,.2,1);padding-bottom:40px}
.pg{display:none}.pg.on{display:block;animation:fade .3s both}
#pg-form{padding-bottom:110px}
.phd{display:flex;justify-content:space-between;align-items:center;padding:24px 28px;gap:12px}
.pt{display:flex;align-items:center;gap:14px}
.pic{width:44px;height:44px;border-radius:12px;background:var(--as);display:grid;place-items:center;color:var(--p);font-size:22px}
.pt h1{margin:0;font-size:22px;font-weight:700;color:var(--t1)}
.pc{padding:0 28px 28px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 16px;border-radius:8px;font-size:14px;font-weight:600;border:1px solid transparent;white-space:nowrap;transition:filter .15s,background .15s}
.btn.pri{background:var(--p);border-color:var(--p);color:#fff}
.btn.acc{background:var(--a);border-color:var(--a);color:#fff}
.btn.sec{background:#fff;border-color:var(--p);color:var(--p)}
.btn.grn{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.sm{height:30px;padding:0 12px;font-size:12.5px}
.btn .cr{font-size:11px;transition:transform .15s}
.pr{filter:brightness(.88)}
.spot{box-shadow:0 0 0 3px rgba(29,158,117,.55),0 0 0 8px rgba(29,158,117,.18)!important;transition:box-shadow .3s}
.card{background:#fff;border-radius:8px;box-shadow:var(--sh)}
.flab{display:block;font-size:12.5px;font-weight:600;color:var(--t2);margin-bottom:8px}
.flab em{color:var(--err);font-style:normal}
.fi,.dd{border:1px solid #D9DEDC;border-radius:8px;padding:0 12px;height:36px;font-size:14px;color:var(--t1);background:#fff;position:relative;display:flex;align-items:center;transition:border-color .15s,box-shadow .15s;white-space:nowrap;overflow:hidden}
.fi.empty:before{content:attr(data-ph);position:absolute;left:12px;color:var(--t3);pointer-events:none}
.fi.focus,.dd.open{border-color:var(--a);box-shadow:0 0 0 3px rgba(29,158,117,.15);overflow:visible}
.fi.focus .v:after{content:'';display:inline-block;width:1.5px;height:1.1em;background:var(--t1);vertical-align:-3px;margin-left:1px;animation:blink 1s steps(1) infinite}
.fi.selall .v{background:var(--a);color:#fff}
.fi.selall .v:after{display:none}
@keyframes blink{50%{opacity:0}}
.fi.dis{background:var(--sm);color:var(--t2)}
.fi.wic{padding-right:34px}.fi>.ic{position:absolute;right:11px;color:var(--t3);font-size:15px}
.dd{justify-content:space-between;gap:8px;padding-right:10px}
.dd .lbl{overflow:hidden;text-overflow:ellipsis}.dd .lbl.ph{color:var(--t3)}
.dd .tr2{display:flex;align-items:center;gap:10px;color:var(--t3);font-size:13px}
.dd .clr{display:none;font-size:11px}.dd.val .clr{display:inline}
.cbx{display:inline-grid;place-items:center;width:20px;height:20px;border:1.5px solid #b9c2bf;border-radius:4px;background:#fff;color:#fff;font-size:13px;flex:none;transition:background .15s,border-color .15s}
.cbx .ic{opacity:0}.cbx.on{background:var(--a);border-color:var(--a)}.cbx.on .ic{opacity:1}

/* list */
.emp-qa{position:relative}
.emp-qa.open .btn .cr{transform:rotate(180deg)}
.menu{position:absolute;z-index:20;min-width:220px;padding:6px;background:#fff;border:1px solid var(--bd);border-radius:12px;box-shadow:var(--pop);animation:pop .16s both}
.emp-qa .menu{top:calc(100% + 6px);right:0}
.menu div{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:6px;font-size:13.5px;font-weight:500;color:var(--t1);white-space:nowrap}
.menu div .ic{color:var(--t2);font-size:15px}
.menu div.hl{background:var(--as);color:var(--p)}.menu div.hl .ic{color:var(--p)}
.menu div.danger,.menu div.danger .ic{color:var(--abs)}
.emp-filters{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;padding:16px;margin-bottom:16px}
.ef{display:flex;flex-direction:column;flex:1 1 160px;min-width:140px}
.ef.search{flex:2 1 260px}.ef.auto{flex:0 0 auto;min-width:0}
.emp-arch{display:inline-flex;align-items:center;gap:8px;margin-bottom:8px;color:var(--t2);font-size:13px;white-space:nowrap}
.emp-arch .cbx{width:16px;height:16px;border-radius:3px}
.emp-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.kpi{--kc:var(--p);--kb:var(--as);display:flex;align-items:center;gap:14px;padding:16px;border:2px solid transparent;border-left:5px solid var(--kc);border-radius:8px;background:#fff;box-shadow:var(--sh);transition:background .2s,border-color .2s}
.kpi.selected{border-color:var(--kc);background:var(--kb)}
.kpi.act{--kc:var(--att);--kb:var(--attbg)}.kpi.ina{--kc:var(--abs);--kb:var(--absbg)}
.kpi-i{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--kb);color:var(--kc);font-size:20px;flex:none}
.kpi.selected .kpi-i{background:var(--kc);color:#fff}
.kpi-v{font-size:26px;font-weight:700;line-height:1.1;display:block}
.kpi-l{font-size:12.5px;font-weight:600;color:var(--t2)}
.emp-card{overflow:hidden}
.tr{display:grid;grid-template-columns:84px 1.35fr 102px 1.5fr 102px 1.2fr 66px 1.4fr 68px 56px 92px 52px;align-items:center;border-bottom:1px solid rgba(0,0,0,.05);font-size:13px;transition:background .6s}
.tr>span{min-width:0;padding:8px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr.th{background:var(--sm);border-bottom:1px solid var(--bd);color:var(--t2);font-weight:700;font-size:12px;align-items:stretch}
.tr.th>span{white-space:normal;line-height:1.3;display:flex;align-items:flex-end;gap:5px;padding:10px}
.tr.th .so{font-size:9.5px;opacity:.35;line-height:1.6}
.tr.th .sorted{background:var(--as);color:var(--p)}.tr.th .sorted .so{opacity:1}
.tr .nm{font-weight:600}
.tr.flash{background:#fff6d6}
.tr.in{animation:fade .35s both}
.mapb{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:16px;background:var(--as);color:var(--p);font-size:12px;font-weight:600}
.av{width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;border:1px solid var(--bd);font-size:11px;font-weight:700;color:#fff;vertical-align:middle}
.av.none{background:var(--sm);color:var(--t3);font-size:14px}
.bdg{display:inline-flex;align-items:center;justify-content:center;min-width:64px;height:24px;padding:0 10px;border-radius:16px;font-size:12px;font-weight:700}
.bdg.on{background:var(--attbg);color:var(--att)}.bdg.off{background:var(--absbg);color:var(--abs)}
.rbtn{width:30px;height:30px;border:1px solid var(--bd);border-radius:8px;background:#fff;color:var(--t2);display:inline-grid;place-items:center;font-size:15px;padding:0}
.rbtn.op{color:var(--p);border-color:var(--p)}
.emp-foot{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-top:1px solid var(--bd);font-size:13px;color:var(--t2)}
.pager{display:flex;gap:4px}.pager span{min-width:32px;height:32px;border:1px solid var(--bd);border-radius:8px;display:grid;place-items:center;color:var(--t2)}.pager span.cur{background:var(--p);border-color:var(--p);color:#fff}
.pgsz{display:flex;align-items:center;gap:8px}.pgsz i{font-style:normal;border:1px solid #D9DEDC;border-radius:8px;height:32px;padding:0 10px;display:flex;align-items:center;gap:14px;color:var(--t1)}
.lempty{padding:40px 16px;text-align:center;color:var(--t3)}

/* dashboard */
.dstats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.dstat{padding:16px}.dstat small{color:var(--t2);font-size:12.5px;font-weight:600}.dstat b{display:block;font-size:26px;margin-top:4px}
.bars{display:flex;align-items:flex-end;gap:18px;height:300px;padding:20px}
.bars i{flex:1;background:linear-gradient(var(--a),var(--p));border-radius:6px 6px 0 0;opacity:.85}

/* form */
.box{background:#fff;border-radius:8px;box-shadow:var(--sh);padding:16px 24px 6px}
.tabs{display:flex;border-bottom:1px solid var(--bd);margin-bottom:18px}
.tabs span{padding:10px 16px;color:var(--t2);font-weight:600;font-size:14px;border-bottom:2px solid transparent;margin-bottom:-1px;margin-right:4px;transition:color .15s,border-color .15s}
.tabs span.on{color:var(--p);border-bottom-color:var(--a)}
.pn{display:none}.pn.on{display:block;animation:fade .25s both}
.g3{display:grid;grid-template-columns:repeat(3,1fr);column-gap:28px}
.fg{margin-bottom:20px;min-width:0}
.chkrow{height:36px;display:flex;align-items:center}
.tbl{border:1px solid var(--bd);border-radius:8px;overflow:hidden;margin-bottom:18px}
.tbl .r{display:grid;align-items:center;border-bottom:1px solid rgba(0,0,0,.05);font-size:13.5px}
.tbl .r>span{padding:8px 14px}
.tbl .r.h{background:var(--sm);color:var(--t2);font-weight:700;font-size:12.5px}
.tbl .r.h>span{padding:11px 14px}
.tbl .r:last-child{border-bottom:0}
.tbl.ts .r{grid-template-columns:1fr 1fr 1fr 1fr 110px}
.tbl.ts .fi{height:34px}
.tbl.ck .r{grid-template-columns:150px 1fr 220px}
.chips{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--sm);border:1px solid var(--bd);border-radius:16px;padding:3px 6px 3px 10px;font-size:12.5px}
.chip .ic{font-size:12px;color:var(--t3)}
.sqb{width:28px;height:28px;border-radius:8px;display:inline-grid;place-items:center;background:var(--ok);color:#fff;font-size:13px}
.img-col{width:33.4%;min-width:340px}
.ifl{display:flex;align-items:center;gap:8px}.ifl .fi{flex:1}
.hint{font-size:12.5px;color:var(--t3)}
.native{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--t1);height:36px}
.native span:first-child{border:1px solid #b9c2bf;border-radius:4px;background:#f1f1f1;padding:4px 10px;font-size:13px}
.att-g{display:grid;grid-template-columns:1fr 1fr 2fr;gap:28px;align-items:start}
.photo{width:200px;height:200px;border-radius:8px;overflow:hidden;border:1px solid var(--bd);animation:fade .4s both}
.gal-f{display:grid;grid-template-columns:220px 220px 140px;gap:16px;align-items:end;margin-bottom:8px}
.gal-d{font-size:16px;font-weight:600;margin:16px 0 10px}
.gal{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:6px}
.gc{border-radius:8px;overflow:hidden;box-shadow:var(--sh);border:1px solid var(--bd);animation:fade .35s both;background:#fff}
.gc svg{display:block;width:100%;height:120px}
.gc small{display:block;text-align:center;padding:7px;font-size:12px}
.rnav{display:flex;justify-content:center;gap:10px;margin-top:16px}
.abar{position:absolute;left:250px;right:0;bottom:0;z-index:5;display:none;justify-content:flex-end;gap:10px;padding:12px 28px;background:rgba(255,255,255,.97);border-top:1px solid var(--bd);box-shadow:0 -4px 16px rgba(0,0,0,.06)}
.abar.on{display:flex}

/* overlays */
#ov{position:absolute;inset:0;z-index:50;pointer-events:none}
.ddp{position:absolute;background:#fff;border:1px solid var(--bd);border-radius:8px;box-shadow:var(--pop);font-size:14px;z-index:3;animation:pop .16s both;overflow:hidden}
.ddp .ddh{padding:8px;background:var(--sm);border-bottom:1px solid var(--bd)}
.ddp .ddh .fi{height:32px}
.ddp .it{padding:0 12px;height:36px;display:flex;align-items:center;gap:9px;white-space:nowrap}
.ddp .it.hl{background:var(--as);color:var(--p)}
.ddp .it.sel{background:var(--p);color:#fff}
.ddp .it .cbx{width:18px;height:18px}
.rmenu{position:absolute;width:220px}
.toast{position:absolute;right:20px;top:72px;width:360px;background:#fff;border-left:4px solid var(--ok);border-radius:8px;padding:14px 16px;display:flex;gap:12px;align-items:center;box-shadow:var(--pop);animation:tin .35s both;font-size:13.5px;color:var(--t2)}
.toast .ic{font-size:20px;color:var(--ok)}
.toast.out{animation:tout .35s both}
@keyframes tin{from{opacity:0;transform:translateX(40px)}}
@keyframes tout{to{opacity:0;transform:translateX(40px)}}
.dlc{position:absolute;right:20px;top:72px;width:340px;background:#fff;border-radius:12px;box-shadow:var(--pop);padding:14px;display:flex;gap:12px;align-items:center;animation:tin .3s both}
.xl{width:38px;height:44px;border-radius:6px;background:#1d6f42;color:#fff;font-weight:800;display:grid;place-items:center;font-size:15px;flex:none}
.dlc b{font-size:13.5px;display:block}.dlc small{color:var(--t2);font-size:12px}
.dlb{height:4px;background:#e6e9ee;border-radius:3px;margin:7px 0 5px;overflow:hidden}
.dlb i{display:block;height:100%;width:0;background:#1d6f42;transition:width .6s}
.dlc.ok .dlb i{width:100%}
.mbg{position:absolute;inset:0;background:rgba(10,25,21,.45);display:flex;align-items:center;justify-content:center;animation:fade .25s both}
.xw{width:max-content;max-width:1420px;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.35);font-family:Calibri,"Segoe UI",Arial,sans-serif}
.xw .xt{background:#1d6f42;color:#fff;padding:9px 16px;font-size:13px;display:flex;justify-content:space-between;align-items:center}
.xg{display:grid;font-size:11px;border-left:1px solid #d4d4d4}
.xg>span{border-right:1px solid #d4d4d4;border-bottom:1px solid #d4d4d4;padding:5px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:24px}
.xg .cl{background:#f3f3f3;color:#666;text-align:center;font-size:10.5px;padding:3px}
.xg .ttl{grid-column:2/-1;font-weight:700;font-size:13px;color:#1a5c4c;height:28px}
.xg .hd{background:#1A5C4C;color:#fff;font-weight:700;height:30px;display:flex;align-items:center}
.xg .on{background:#E8F5E9;color:#2E7D32;font-weight:700}.xg .off{background:#FFEBEE;color:#C62828;font-weight:700}
.xg .lk{color:#0563c1;text-decoration:underline}
.xg .tot{background:#F1F3F2;font-weight:700}
.xs{display:flex;gap:2px;background:#f3f3f3;border-top:1px solid #d4d4d4;padding:0 10px;font-size:12px}
.xs span{padding:7px 16px;color:#444}.xs span.on{background:#fff;color:#1d6f42;font-weight:700;border-bottom:2px solid #1d6f42}
.xstat{padding:16px 22px;display:grid;grid-template-columns:repeat(4,1fr);gap:22px;font-size:12.5px;min-height:420px}
.xstat h4{margin:0 0 8px;color:#1a5c4c;font-size:13.5px}
.xstat div div{display:flex;justify-content:space-between;border-bottom:1px solid #e5e5e5;padding:5px 2px}

/* caption & cursor */
#cap{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:rgba(15,61,50,.95);color:#fff;border-radius:14px;padding:10px 22px 11px 12px;display:flex;gap:13px;align-items:center;max-width:980px;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:80;transition:opacity .3s,bottom .35s;white-space:nowrap}
#cap.up{bottom:76px}
#cap.hide{opacity:0}
#cap .cn{width:36px;height:36px;border-radius:10px;background:var(--a);color:#fff;display:grid;place-items:center;font-weight:800;font-size:17px;flex:none}
#cap small{display:block;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:#8fe3c4;font-weight:700}
#cap .tx{font-size:17.5px;margin-top:1px}
#cap .tx b{color:#a9f0d5}
#cap .tx.sw2{animation:fade .3s both}
#cur{position:absolute;left:0;top:0;z-index:100;pointer-events:none;opacity:0;transition:transform .45s cubic-bezier(.45,.05,.25,1),opacity .3s}
#cur.vis{opacity:1}
#cur svg{position:absolute;left:-4px;top:-3px;width:28px;height:28px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35));transform-origin:4px 3px}
#cur.p svg{animation:cp .25s}
@keyframes cp{50%{transform:scale(.78)}}
.rip{position:absolute;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;border:2.5px solid var(--a);z-index:99;pointer-events:none;animation:rip .55s ease-out forwards}
@keyframes rip{from{transform:scale(.2);opacity:1}to{transform:scale(1.4);opacity:0}}
.spin{animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* controls */
.ctl{height:48px;flex:none;background:#0f201c;display:flex;align-items:center;gap:6px;padding:0 12px;color:#cfe3de;font-size:13px;user-select:none}
.ctl button{background:none;border:0;color:#e9f6f2;width:36px;height:36px;border-radius:8px;display:grid;place-items:center;flex:none}
.ctl button:hover{background:rgba(255,255,255,.08)}
.ctl button svg{width:20px;height:20px}
#tm{font-variant-numeric:tabular-nums;min-width:86px;text-align:center;flex:none}
#sc{flex:none;color:#8fe3c4;font-weight:600;min-width:74px;text-align:center}
#bar{position:relative;flex:1;height:28px;cursor:pointer;touch-action:none}
#bar .trk{position:absolute;left:0;right:0;top:12px;height:5px;border-radius:3px;background:rgba(255,255,255,.16)}
#fill{position:absolute;left:0;top:12px;height:5px;border-radius:3px;background:var(--a);width:0}
#knob{position:absolute;top:8px;width:13px;height:13px;margin-left:-6.5px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.tick{position:absolute;top:10px;width:2px;height:9px;background:#0f201c;margin-left:-1px}
#chap{flex:none;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#9fcfc3;padding-left:8px}
@media (max-width:560px){#chap,#sc{display:none}#tm{min-width:70px;font-size:12px}.ctl{padding:0 6px;gap:2px}}
#big{position:absolute;left:50%;top:50%;width:76px;height:76px;margin:-38px 0 0 -38px;border-radius:50%;background:rgba(15,61,50,.88);display:grid;place-items:center;opacity:0;transition:opacity .25s;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.35)}
#big svg{width:34px;height:34px;color:#fff;margin-left:4px}
.paused #big{opacity:1}
.shot #big{display:none}
</style>
</head>

<div class="player" id="player">
  <div class="vp" id="vp"><div id="stage"></div><div id="big"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4l13 8-13 8z"/></svg></div></div>
  <div class="ctl">
    <button id="bp" aria-label="Play or pause"></button>
    <button id="br" aria-label="Restart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
    <span id="tm">0:00 / 0:00</span>
    <span id="sc"></span>
    <div id="bar"><div class="trk"></div><div id="fill"></div><div id="ticks"></div><div id="knob"></div></div>
    <span id="chap"></span>
  </div>
</div>

function rel(el){const s=stage.getBoundingClientRect(),r=el.getBoundingClientRect();return{x:(r.left-s.left)/SC,y:(r.top-s.top)/SC,w:r.width/SC,h:r.height/SC};}
function setXY(x,y,dur,ease){cx=x;cy=y;cur.style.transitionDuration=dur+'ms, 300ms';cur.style.transitionTimingFunction=ease?ease+', ease':'';cur.style.transform=`translate(${x}px,${y}px)`;}
function finalRect(el){
  const r=rel(el), sc=el.closest('.scroll'); if(!sc) return r;
  const inner=sc.firstElementChild, ri=rel(inner), rs=rel(sc), tIn=r.y-ri.y;
  const off=+sc.dataset.off||0, vh=sc.clientHeight, mb=+(sc.dataset.mb||110), top=tIn-off; let n=off;
  if(top<16||top+r.h>vh-mb){n=tIn-vh*.4;n=Math.max(0,Math.min(Math.max(0,inner.offsetHeight-vh),n));}
  if(Math.abs(n-off)>1){inner.style.transform=`translateY(${-n}px)`;sc.dataset.off=n;}else n=off;
  return{x:r.x,w:r.w,h:r.h,y:rs.y+tIn-n};
}

/* ======================= timeline DSL ======================= */
const E=[];let base=0;
const at=(t,fn)=>E.push({t:base+t,fn,o:E.length});
const mv=(t,sel,dur=450,o)=>at(t,()=>cursorTo($(sel),dur,o));
const clk=(t,sel,fn)=>at(t,()=>{press(sel);fn&&fn();});
function mc(t,sel,fn,dur=450,o){mv(t,sel,dur,o);clk(t+dur+60,sel,()=>{const el=$(sel);if(el&&el.classList.contains('fi'))focusEl(sel);else blurAll();fn&&fn();});return t+dur+60;}
function typ(t,sel,text,step=45,keep=''){at(t,()=>focusEl(sel));for(let i=1;i<=text.length;i++)at(t+i*step,()=>setVal(sel,keep+text.slice(0,i)));return t+text.length*step;}
// click a field, select its current value, then type over it
function retype(t,sel,text,step=60,dur=380){let c=mc(t,sel,()=>{focusEl(sel);$(sel).classList.add('selall');},dur,{fx:.35});return typ(c+350,sel,text,step);}
function fill(t,sel,text,step=40,dur=380){const c=mc(t,sel,null,dur,{fx:.3});return typ(c+60,sel,text,step);}
function DD(t,sel,items,i,o={}){
  const c=mc(t,sel,()=>ddOpen(sel,items,o),o.dur||420), it=`#ddp [data-i="${i}"]`;
  let k=c+250;
  if(o.q){mv(k,'#ddf',300,{fx:.3});k+=350;k=typ(k,'#ddf',o.q,70);const q=o.q;at(k+10,()=>ddFilter(items,q));k+=250;}
  mv(k,it,330,{fx:.3});at(k+300,()=>{const e=$(it);e&&e.classList.add('hl');});
  clk(k+480,it,()=>{ddPick(sel,o.label||items[i]);o.after&&o.after();});
  return k+480;
}
function toast(t,msg='Record saved successfully',dur=2400){const id='t'+(tid++);at(t,()=>toastShow(id,msg));at(t+dur,()=>{const e=$('#'+id);e&&e.classList.add('out');});at(t+dur+400,()=>{const e=$('#'+id);e&&e.remove();});}
const cap=(t,n,l,h)=>at(t,()=>setCap(n,l,h));

  C(0,'Open <b>Quick Actions → Export Excel</b> — the file uses the filters on screen');
  let t=mc(300,'#btn-qa',()=>qaMenu(true),550);
  at(t+300,()=>hl('#qa-export'));
  t=mc(t+500,'#qa-export',()=>{qaMenu(false);$('#qa-ic').innerHTML=ic('spinner','spin');},380);
  at(t+900,()=>{$('#qa-ic').innerHTML=ic('bolt');const d=document.createElement('div');d.className='dlc';d.id='dlc';d.innerHTML=`<span class="xl">X</span><div style="flex:1"><b>Employees_2026-10-22.xlsx</b><div class="dlb"><i></i></div><small id="dls">Downloading…</small></div>`;$('#ov').appendChild(d);});
  at(t+1000,()=>{const d=$('#dlc');d&&d.classList.add('ok');});
  at(t+1700,()=>{const d=$('#dls');d&&(d.innerHTML='✓ Completed · 38 KB');});
  C(t+1000,'Employees_<b>YYYY-MM-DD</b>.xlsx downloads');
  at(t+2600,()=>{const d=$('#dlc');d&&d.remove();excelModal();});
  C(t+2700,'Sheet 1 <b>Employee List</b>: every column, coloured status and a totals row');
  at(t+3000,()=>curShow(false));
  at(t+6500,()=>excelStats());
  C(t+6500,'Sheet 2 <b>Employee Statistics</b>: totals by status, client, city and region');
  at(t+9500,()=>{const m=$('#xm');m&&m.remove();});
  return t+9800;
}

function S_outro(){at(0,()=>{layer('L-outro');curShow(false);$('#cap').classList.add('hide');$$('#ov > *').forEach(e=>e.remove());});return 4500;}

const SCENES=[['Intro',S_intro],['Employee list',S_list,1,'Employee list'],['Search',S_search,2,'Search'],['Add an employee',S_add,3,'Add employee'],['Employee settings',S_settings,4,'Settings'],['Activate / deactivate',S_toggle,5,'Activate / deactivate'],['Employee details',S_details,6,'Details'],['Export to Excel',S_export,7,'Export'],['Outro',S_outro]];
const CH=[];let TOTAL=0;
for(const [n,f,num,short] of SCENES){base=TOTAL;CH.push({n,t:TOTAL,num,short});TOTAL+=f();}
E.sort((a,b)=>a.t-b.t||a.o-b.o);
const NSTEP=CH.filter(c=>c.num).length;

/* ======================= player ======================= */
let clock=0,idx=0,playing=false,last=0,frozen=[];
const run=e=>{try{e.fn()}catch(err){console.warn(err)}};
function freeze(){frozen=document.getAnimations().filter(a=>a.playState==='running');frozen.forEach(a=>a.pause());}
function thaw(){frozen.forEach(a=>{if(a.playState==='paused')a.play();});frozen=[];}
function seek(ms){
  ms=Math.max(0,Math.min(TOTAL,ms));seeking=true;stage.classList.add('instant');build();
  idx=0;clock=ms;while(idx<E.length&&E[idx].t<=ms)run(E[idx++]);
  void stage.offsetWidth;
  requestAnimationFrame(()=>{
    stage.classList.remove('instant');seeking=false;
    document.getAnimations().forEach(a=>{if(isFinite(a.effect.getComputedTiming().endTime))a.finish();});
    if(!playing)freeze();
  });
}
function play(){if(clock>=TOTAL)seek(0);playing=true;thaw();ui();}
function pause(){playing=false;freeze();ui();}
const toggle=()=>playing?pause():play();
const fmt=ms=>{const s=Math.floor(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
const bp=document.getElementById('bp');
function ui(){
  const f=clock/TOTAL;document.getElementById('fill').style.width=f*100+'%';document.getElementById('knob').style.left=f*100+'%';
  document.getElementById('tm').textContent=fmt(clock)+' / '+fmt(TOTAL);
  let c=CH[0];for(const x of CH)if(x.t<=clock)c=x;document.getElementById('chap').textContent=c.n;
  document.getElementById('sc').textContent=c.num?`Step ${c.num} / ${NSTEP}`:'';
  bp.innerHTML=playing?'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>':'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4l13 8-13 8z"/></svg>';
  document.getElementById('player').classList.toggle('paused',!playing);
}
function loop(now){
  const dt=Math.min(100,now-(last||now));last=now;
  if(playing){clock+=dt;while(idx<E.length&&E[idx].t<=clock)run(E[idx++]);if(clock>=TOTAL){clock=TOTAL;pause();}}
  ui();requestAnimationFrame(loop);
}
function fit(){const w=vp.clientWidth,h=vp.clientHeight;SC=Math.min(w/W,h/H);stage.style.transform=`translate(${(w-W*SC)/2}px,${(h-H*SC)/2}px) scale(${SC})`;}
window.addEventListener('resize',fit);
bp.onclick=toggle;
document.getElementById('br').onclick=()=>{seek(0);play();};
vp.addEventListener('click',toggle);
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();toggle();}
  else if(e.code==='ArrowRight'||e.code==='ArrowLeft'){let d=e.code==='ArrowRight'?1:-1;let i=0;CH.forEach((c,k)=>{if(c.t<=clock)i=k;});if(d<0&&clock-CH[i].t>1500)d=0;const j=Math.max(0,Math.min(CH.length-1,i+(d||0)));const wp=playing;seek(CH[j].t);if(wp)play();}});
document.getElementById('ticks').innerHTML=CH.slice(1).map(c=>`<i class="tick" style="left:${c.t/TOTAL*100}%" title="${c.n}"></i>`).join('');
const bar=document.getElementById('bar');let drag=false,wasPlaying=false;
const barMs=e=>{const r=bar.getBoundingClientRect();return Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*TOTAL;};
bar.addEventListener('pointerdown',e=>{drag=true;wasPlaying=playing;bar.setPointerCapture(e.pointerId);if(playing){playing=false;}seek(barMs(e));});
bar.addEventListener('pointermove',e=>{if(drag){clock=barMs(e);}});
bar.addEventListener('pointerup',e=>{if(!drag)return;drag=false;seek(barMs(e));if(wasPlaying)play();else freeze();});

fit();
// Seek hooks: #t=SECONDS, #step=N (chapter start) with optional &o=MS offset, &p to start paused.
function fromHash(){
  const hp=new URLSearchParams(location.hash.slice(1));
  document.body.classList.toggle('shot',hp.has('shot'));
  let ms=(parseFloat(hp.get('t'))||0)*1000;
  if(hp.has('step')){const c=CH.find(x=>x.num===+hp.get('step'));if(c)ms=c.t+(+hp.get('o')||0);}
  seek(ms);
  if(!hp.has('p'))play();else pause();
}
window.addEventListener('hashchange',fromHash);
fromHash();
requestAnimationFrame(loop);
</script>
</body>
</html>
