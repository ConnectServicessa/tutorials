<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Attendance Tutorial</title>
<style>
:root{
  --brand-primary:#1a5c4c;--brand-primary-hover:#154d40;--brand-primary-dark:#0f3d32;--brand-accent:#1D9E75;--brand-accent-soft:#e3f4ee;
  --page-bg:#F5F5F5;--surface:#fff;--surface-muted:#F8F9FA;--border:#E8E8E8;--text-primary:#333;--text-secondary:#666;--text-muted:#999;
  --radius:8px;--radius-lg:12px;--radius-pill:16px;--shadow-card:0 2px 8px rgba(0,0,0,.08);--shadow-pop:0 12px 32px rgba(0,0,0,.14);
  --att-attend-bg:#E8F5E9;--att-attend:#2E7D32;--att-late-bg:#FFF3E0;--att-late:#F57C00;--att-absent-bg:#FFEBEE;--att-absent:#E53935;
  --att-vacation-bg:#E3F2FD;--att-vacation:#1565C0;--att-earlyOut-bg:#EDE9FE;--att-earlyOut:#7C3AED;
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0a1f1a;overflow:hidden;font-family:var(--font)}
.player{display:flex;flex-direction:column;height:100%}
.vp{flex:1;position:relative;overflow:hidden;cursor:pointer}
#stage{position:absolute;left:0;top:0;width:1440px;height:810px;transform-origin:0 0;overflow:hidden;background:var(--page-bg);font-family:var(--font);color:var(--text-primary);-webkit-font-smoothing:antialiased}
.ic{width:1em;height:1em;flex:none;vertical-align:-.125em}
button{font:inherit;cursor:pointer}
.instant,.instant *{transition:none!important;animation:none!important}
.layer{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s,visibility 0s .5s}
.layer.on{opacity:1;visibility:visible;transition:opacity .5s}
@keyframes fade{from{opacity:0}}
@keyframes up{from{opacity:0;transform:translateY(18px)}}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}}

/* ---------- intro / outro ---------- */
.hero{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;
  background:radial-gradient(circle at 80% 16%,rgba(29,158,117,.35),transparent 42%),radial-gradient(circle at 10% 90%,rgba(29,158,117,.22),transparent 40%),linear-gradient(135deg,#0f3d32,#1a5c4c 62%,#1D9E75)}
.hero .lgw{background:#fff;border-radius:16px;padding:18px 32px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.hero .lgw img{height:66px;display:block}
.hero h1{font-size:62px;margin:36px 0 12px;font-weight:700;letter-spacing:-.02em}
.hero p{font-size:24px;margin:0;color:#c9efe2}
.pills{display:flex;gap:10px;margin-top:40px;flex-wrap:wrap;justify-content:center;max-width:1100px}
.pills span{border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.08);border-radius:30px;padding:9px 17px;font-size:16px;color:#e6f7f2}
.pills b{color:#9ff0d6;margin-right:6px}
.layer.on .hero>*{animation:up .6s both}
.layer.on .hero>:nth-child(2){animation-delay:.15s}.layer.on .hero>:nth-child(3){animation-delay:.3s}.layer.on .hero>:nth-child(4){animation-delay:.45s}
.hero .done{width:82px;height:82px;border-radius:50%;background:#1D9E75;display:grid;place-items:center;font-size:42px;color:#fff;margin-bottom:26px;box-shadow:0 0 0 10px rgba(255,255,255,.1)}
.hero .sub2{font-size:16px;color:#a8dccb;margin-top:30px}
.hero ul{list-style:none;padding:0;margin:26px 0 0;display:grid;grid-template-columns:1fr 1fr;gap:10px 34px;text-align:left;font-size:17px;color:#e3f6ef}
.hero ul li{display:flex;gap:10px;align-items:center}.hero ul .ic{color:#9ff0d6}

/* ---------- sidebar (new design) ---------- */
#L-portal{background:var(--page-bg)}
.sb{position:absolute;left:0;top:0;bottom:0;width:250px;background:var(--brand-primary);color:#fff;display:flex;flex-direction:column;box-shadow:2px 0 12px rgba(0,0,0,.12);z-index:6;overflow:hidden}
.sb-brand{height:60px;flex:none;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.sb-logo{display:flex;align-items:center;justify-content:center;width:100%;height:42px;padding:6px 14px;background:#fff;border-radius:var(--radius)}
.sb-logo img{max-height:100%;max-width:100%;object-fit:contain}
.sb-search{padding:12px 14px 4px;flex:none}
.sb-sbox{position:relative;height:36px;border:1px solid rgba(255,255,255,.14);border-radius:var(--radius);background:rgba(255,255,255,.08);display:flex;align-items:center;padding-left:32px;font-size:13px;color:rgba(255,255,255,.55)}
.sb-sbox .ic{position:absolute;left:11px;font-size:13px;color:rgba(255,255,255,.6)}
.sb-nav{flex:1;overflow:hidden;padding:4px 0 10px}
.sb-section+.sb-section{margin-top:6px}
.sb-st{padding:14px 20px 6px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.5)}
.sb-head,.sb-link{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:42px;padding:0 18px;border-left:3px solid transparent;color:rgba(255,255,255,.86);font-size:14px;font-weight:500;transition:background-color .15s,color .15s}
.sb-head .sb-ic{flex:0 0 20px;font-size:17px;text-align:center;display:grid;place-items:center}
.sb-head .lb{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-caret{font-size:11px;opacity:.7;transition:transform .2s}
.sb-group.open>.sb-head .sb-caret{transform:rotate(180deg)}
.sb-group.has-active>.sb-head{color:#fff}
.sb-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .22s ease}
.sb-group.open>.sb-body{grid-template-rows:1fr}
.sb-inner{min-height:0;overflow:hidden}
.sb-link{min-height:38px;padding-left:50px;font-size:13.5px;color:rgba(255,255,255,.72)}
.sb-link:before{content:'';position:absolute;left:27px;top:50%;margin-top:-2.5px;width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.55}
.sb-link.wi:before{display:none}
.sb-link .li{position:absolute;left:22px;font-size:14px;top:50%;margin-top:-7px}
.sb-link.active,.sb-direct.active{color:#fff;background:rgba(255,255,255,.12);border-left-color:var(--brand-accent)}
.sb-link.active:before{opacity:1;background:var(--brand-accent)}
.sb-link.hv,.sb-head.hv{background:rgba(255,255,255,.07);color:#fff}
.sb-profile{flex:none;display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.12)}
.sb-av{flex:0 0 34px;width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:#e3f4ee;color:var(--brand-primary);display:grid;place-items:center;font-weight:700;font-size:13px}
.sb-pt{flex:1;display:flex;flex-direction:column;line-height:1.25;min-width:0}
.sb-pt b{font-size:13px}.sb-pt small{font-size:11.5px;color:rgba(255,255,255,.65)}
.sb-out{width:32px;height:32px;display:grid;place-items:center;color:rgba(255,255,255,.8);font-size:16px}

/* ---------- top bar ---------- */
.tb{position:absolute;left:250px;right:0;top:0;height:60px;background:#fff;box-shadow:0 1px 0 var(--border),0 2px 8px rgba(0,0,0,.04);display:flex;align-items:center;gap:12px;padding:0 20px;z-index:5}
.tb-btn{height:38px;min-width:38px;padding:0 10px;border-radius:var(--radius);display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--text-secondary);font-size:18px;position:relative}
.tb-btn small{font-size:12px;font-weight:700}
.tb-badge{position:absolute;top:3px;right:2px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#EF4444;color:#fff;font-size:10.5px;font-weight:700;line-height:18px;text-align:center;box-shadow:0 0 0 2px #fff}
.bc{display:flex;align-items:center;gap:0;font-size:13.5px;color:var(--text-secondary);margin-left:12px}
.bc span{display:inline-flex;align-items:center;gap:6px}
.bc span .ic{font-size:15px;color:var(--text-muted)}
.bc span:last-child{color:var(--text-primary);font-weight:600}.bc span:last-child .ic{color:var(--brand-accent)}
.bc i{width:7px;height:7px;border-right:1.5px solid var(--text-muted);border-top:1.5px solid var(--text-muted);transform:rotate(45deg);margin:0 14px}
.tb-act{margin-left:auto;display:flex;align-items:center;gap:6px}
.tb-prof{display:flex;align-items:center;gap:10px;padding:4px 8px 4px 4px;border-radius:var(--radius);margin-left:6px}
.tb-prof .sb-av{border-color:var(--border)}
.tb-pt{display:flex;flex-direction:column;line-height:1.2}
.tb-pt b{font-size:13.5px;color:var(--text-primary)}.tb-pt small{font-size:11.5px;color:var(--text-secondary)}
.tb-prof>.ic{color:var(--text-muted);font-size:13px}

/* ---------- main area ---------- */
.pm{position:absolute;left:250px;right:0;top:60px;bottom:0;overflow:hidden}
.si{position:relative;transition:transform .4s cubic-bezier(.4,0,.2,1);padding-bottom:140px}
.pg{display:none}.pg.on{display:block;animation:fade .3s both}
.phd{display:flex;align-items:center;gap:14px;padding:24px 28px}
.phd .pic{width:44px;height:44px;border-radius:var(--radius-lg);background:var(--brand-accent-soft);color:var(--brand-primary);display:grid;place-items:center;font-size:22px}
.phd h1{margin:0;font-size:21.6px;font-weight:700;color:var(--text-primary)}
.pc{padding:0 28px 28px}
label.fl{display:block;font-weight:600;font-size:12px;color:#5b6577;margin-bottom:4px}
.pdd,.fi{height:36px;border:1px solid #D9DEDC;border-radius:var(--radius);background:#fff;display:flex;align-items:center;padding:0 12px;font-size:14px;color:var(--text-primary);position:relative;white-space:nowrap;overflow:hidden;transition:border-color .15s,box-shadow .15s}
.pdd{justify-content:space-between;gap:6px;padding-right:8px}
.pdd .lbl{flex:1;overflow:hidden;text-overflow:ellipsis}
.pdd .lbl.ph,.fi.empty .v:before{color:var(--text-muted)}
.pdd .clr{font-size:11px;color:var(--text-muted);display:none}.pdd.has .clr{display:block}
.pdd>.ic:last-child{color:var(--text-muted);font-size:14px}
.pdd.open,.fi.focus{border-color:var(--brand-accent);box-shadow:0 0 0 3px rgba(29,158,117,.15)}
.fi.empty .v:before{content:attr(data-ph)}
.fi .v{flex:1}
.fi.date>.ic{color:#555;font-size:15px}
.fi.focus .v:after{content:'';display:inline-block;width:1.5px;height:1.05em;background:#333;vertical-align:-3px;margin-left:1px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 16px;border-radius:var(--radius);font-size:14px;font-weight:600;white-space:nowrap;border:1px solid transparent;transition:background-color .15s,filter .15s}
.btn.pri{background:var(--brand-primary);border-color:var(--brand-primary);color:#fff}
.btn.sec{background:transparent;border-color:var(--brand-primary);color:var(--brand-primary)}
.pr{filter:brightness(.88)}
.spin{width:15px;height:15px;border:2.2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:rot .7s linear infinite;display:inline-block}
@keyframes rot{to{transform:rotate(360deg)}}

/* dashboard */
.rf{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;background:#fff;box-shadow:var(--shadow-card);border-radius:10px;padding:14px 16px;margin-bottom:18px}
.rf .it{display:flex;flex-direction:column;min-width:160px;flex:1 1 160px}
.rf .it.date{flex:0 1 150px;min-width:140px}
.rf .it.search{flex:2 1 260px}
.rf .it.reset{flex:0 0 auto;min-width:auto}
.sbx{display:flex;gap:8px}.sbx .fi{flex:1;min-width:0}
.cap2{font-size:12px;font-weight:600;color:#76808f;text-transform:uppercase;letter-spacing:.04em;margin:4px 2px 10px}
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.kpi-card{display:flex;align-items:center;gap:14px;background:#fff;box-shadow:var(--shadow-card);border-left:5px solid #1a5c4c;border-radius:var(--radius);padding:16px 18px;min-width:0;position:relative}
.kpi-icon{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font-size:22px;color:#fff;flex:none;background:#1a5c4c}
.kpi-body{min-width:0}
.kpi-value{font-size:24px;font-weight:700;line-height:1.1;color:#22304a;white-space:nowrap}
.kpi-value small{font-size:13px;font-weight:600;color:#76808f;margin-left:2px}
.kpi-pct{font-size:13px;font-weight:600;color:#76808f;margin-left:4px}
.kpi-label{font-size:12px;color:#76808f;margin-top:2px;white-space:nowrap}
.kpi-avg{font-size:11px;color:#9aa3af;margin-top:1px;white-space:nowrap}
.kpi-card.good{border-left-color:var(--att-attend)}.kpi-card.good .kpi-icon{background:var(--att-attend-bg);color:var(--att-attend)}
.kpi-card.warn{border-left-color:var(--att-late)}.kpi-card.warn .kpi-icon{background:var(--att-late-bg);color:var(--att-late)}
.kpi-card.bad{border-left-color:var(--att-absent)}.kpi-card.bad .kpi-icon{background:var(--att-absent-bg);color:var(--att-absent)}
.kpi-card.info{border-left-color:#1D9E75}.kpi-card.info .kpi-icon{background:#1D9E75}
.kpi-card.early{border-left-color:var(--att-earlyOut)}.kpi-card.early .kpi-icon{background:var(--att-earlyOut-bg);color:var(--att-earlyOut)}.kpi-card.early .kpi-value{color:var(--att-earlyOut)}
.kpi-go{position:absolute;right:10px;top:10px;color:var(--att-earlyOut);font-size:16px}
.kpi-card.early{padding-right:24px}
.charts-row{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:20px}
.charts-row.two{grid-template-columns:1fr 1fr}.charts-row.single{grid-template-columns:1fr}.charts-row.three{grid-template-columns:repeat(3,1fr)}
.rc{background:#fff;box-shadow:var(--shadow-card);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.rch{font-weight:600;font-size:14px;color:#22304a;padding:14px 16px;border-bottom:1px solid #eef0f6;display:flex;align-items:center;gap:7px}
.rch .ic{color:var(--text-secondary)}
.rcb{padding:12px 16px 14px;position:relative}
.lg{display:flex;justify-content:center;flex-wrap:wrap;gap:6px 16px;font-size:11.5px;color:#666;margin-bottom:6px}
.lg span{display:inline-flex;align-items:center;gap:6px}.lg i{width:28px;height:10px;border-radius:2px;display:inline-block}
.chart svg{display:block}
.chart text{font-family:var(--font);font-size:11px;fill:#666}
.cnote{font-size:11px;color:#9aa3af;text-align:center;margin-top:4px}
.ctip{position:absolute;background:rgba(0,0,0,.8);color:#fff;border-radius:6px;padding:7px 10px;font-size:12px;line-height:1.5;pointer-events:none;z-index:40;white-space:nowrap;animation:fade .15s both}
.ctip b{display:block;font-size:12.5px}
.ctip i{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:-1px;border:1px solid #fff}
table{border-collapse:separate;border-spacing:0;width:100%}
.rt th{font-size:12px;color:#76808f;font-weight:600;border-bottom:1px solid #eef0f6;padding:8px 8px;text-align:left;white-space:nowrap}
.rt td{font-size:12.5px;color:#37445c;padding:7px 8px;border-bottom:1px solid #f4f5f9;vertical-align:middle}
.rt .num{text-align:right}
.rt td.ell{max-width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cl{display:block;color:#9aa2b1;font-size:11.5px}
.badge{display:inline-flex;align-items:center;justify-content:center;gap:4px;min-width:72px;height:24px;padding:0 10px;border-radius:var(--radius-pill);font-size:12px;font-weight:700;line-height:1;white-space:nowrap;background:#eef0ef;color:var(--text-secondary)}
.badge.sm{min-width:0;height:20px;padding:0 8px;font-size:11px}
.badge.attend,.badge.onTime{background:var(--att-attend-bg);color:var(--att-attend)}
.badge.late{background:var(--att-late-bg);color:var(--att-late)}
.badge.absent,.badge.missed{background:var(--att-absent-bg);color:var(--att-absent)}
.badge.vacation{background:var(--att-vacation-bg);color:var(--att-vacation)}
.badge.earlyOut{background:var(--att-earlyOut-bg);color:var(--att-earlyOut)}
.blk{position:absolute;left:250px;top:60px;right:0;bottom:0;background:rgba(255,255,255,.55);display:none;align-items:center;justify-content:center;z-index:30}
.blk.on{display:flex;animation:fade .2s both}
.blk div{display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;padding:14px 20px;box-shadow:var(--shadow-pop);font-weight:600;color:var(--brand-primary)}
.blk .spin{border-color:rgba(26,92,76,.2);border-top-color:var(--brand-primary);width:22px;height:22px}

/* attendance records */
.af{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;padding:16px;margin-bottom:16px;background:#fff;border-radius:var(--radius);box-shadow:var(--shadow-card)}
.af .it{display:flex;flex-direction:column;flex:1 1 170px;min-width:150px}
.af .it label.fl{margin-bottom:8px}
.af .it.date{flex:0 1 160px}.af .it.search{flex:2 1 280px}.af .it.reset{flex:0 0 auto;min-width:0}
.af .it.actions{flex:0 0 auto;min-width:0;margin-left:auto;position:relative}
.qa-car{font-size:11px;transition:transform .15s}.open>.qa-car,.qa.open .qa-car{transform:rotate(180deg)}
.qmenu{position:absolute;top:calc(100% + 6px);right:0;z-index:20;background:#fff;min-width:220px;padding:6px;border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-pop);animation:pop .15s both}
.qmenu div{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:6px;font-size:13.5px;color:var(--text-primary)}
.qmenu div .ic{color:var(--text-secondary)}
.qmenu div.hl{background:var(--brand-accent-soft);color:var(--brand-primary)}.qmenu div.hl .ic{color:var(--brand-primary)}
.akp{display:grid;grid-template-columns:repeat(6,1fr);gap:16px;margin-bottom:16px}
.ak{--kc:var(--brand-primary);--kb:var(--brand-accent-soft);display:flex;align-items:center;gap:14px;padding:16px;border:2px solid transparent;border-left:5px solid var(--kc);border-radius:var(--radius);background:#fff;box-shadow:var(--shadow-card);text-align:left;transition:background-color .2s,border-color .2s}
.ak.sel{border-color:var(--kc);background:var(--kb)}
.ak.attend{--kc:var(--att-attend);--kb:var(--att-attend-bg)}.ak.late{--kc:var(--att-late);--kb:var(--att-late-bg)}.ak.absent{--kc:var(--att-absent);--kb:var(--att-absent-bg)}
.ak.vacation{--kc:var(--att-vacation);--kb:var(--att-vacation-bg)}.ak.earlyOut{--kc:var(--att-earlyOut);--kb:var(--att-earlyOut-bg)}
.ak-ic{flex:0 0 44px;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--kb);color:var(--kc);font-size:20px;transition:.2s}
.ak.sel .ak-ic{background:var(--kc);color:#fff}
.ak-b{display:flex;flex-direction:column;min-width:0}
.ak-v{font-size:26px;font-weight:700;line-height:1.1;color:var(--text-primary)}
.ak-l{font-size:12.5px;color:var(--text-secondary);font-weight:600;white-space:nowrap}
.acard{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow-card);overflow:hidden}
.tabs{display:flex;gap:4px;padding:0 12px;border-bottom:1px solid var(--border)}
.tab{display:inline-flex;align-items:center;gap:8px;padding:14px 14px 12px;border-bottom:3px solid transparent;color:var(--text-secondary);font-weight:600;font-size:14px;white-space:nowrap;transition:color .2s,border-color .2s}
.tab .tc{min-width:26px;padding:1px 8px;border-radius:10px;background:var(--surface-muted);font-size:12px;text-align:center}
.tab.active{color:var(--brand-primary);border-bottom-color:var(--brand-accent)}
.tab.attend.active{color:var(--att-attend);border-color:var(--att-attend)}.tab.late.active{color:var(--att-late);border-color:var(--att-late)}
.tab.absent.active{color:var(--att-absent);border-color:var(--att-absent)}.tab.vacation.active{color:var(--att-vacation);border-color:var(--att-vacation)}
.tab.earlyOut.active{color:var(--att-earlyOut);border-color:var(--att-earlyOut)}
.at th{padding:9px 7px;background:var(--surface-muted);border-bottom:1px solid var(--border);color:var(--text-secondary);font-size:12px;font-weight:700;text-align:left;line-height:1.3;vertical-align:bottom}
.at th .so{font-size:9px;opacity:.35;margin-left:4px}
.at .badge{min-width:62px}.at td{padding:9px 7px;border-bottom:1px solid rgba(0,0,0,.05);font-size:13px;color:var(--text-primary);white-space:nowrap;vertical-align:middle}
.at .tg{width:34px;text-align:center;color:var(--text-muted)}
.at .nm{font-weight:600;max-width:140px;overflow:hidden;text-overflow:ellipsis}
.at .el{max-width:104px;overflow:hidden;text-overflow:ellipsis}
.at tr.row td{transition:background-color .2s}
.at tr.r-attend td{background:var(--att-attend-bg)}.at tr.r-attend td:first-child{box-shadow:inset 4px 0 0 var(--att-attend)}
.at tr.r-late td{background:var(--att-late-bg)}.at tr.r-late td:first-child{box-shadow:inset 4px 0 0 var(--att-late)}
.at tr.r-absent td{background:var(--att-absent-bg)}.at tr.r-absent td:first-child{box-shadow:inset 4px 0 0 var(--att-absent)}
.at tr.r-vacation td{background:var(--att-vacation-bg)}.at tr.r-vacation td:first-child{box-shadow:inset 4px 0 0 var(--att-vacation)}
.at tr.r-early td{background:var(--att-earlyOut-bg)}.at tr.r-early td:first-child{box-shadow:inset 4px 0 0 var(--att-earlyOut)}
.at tr.row .badge.attend,.at tr.r-attend .badge.attend{background:#fff;box-shadow:inset 0 0 0 1.5px var(--att-attend)}
.at tr.r-late .badge.late{background:#fff;box-shadow:inset 0 0 0 1.5px var(--att-late)}
.at tr.r-absent .badge.absent{background:#fff;box-shadow:inset 0 0 0 1.5px var(--att-absent)}
.at tr.r-vacation .badge.vacation{background:#fff;box-shadow:inset 0 0 0 1.5px var(--att-vacation)}
.at tr.exp td{border-bottom-color:transparent}
.at tr.in td{animation:fade .35s both}
.badge+.badge{margin-left:6px}
.rk{display:inline-block;min-width:40px;padding:2px 8px;border-radius:10px;background:rgba(0,0,0,.05);font-weight:700;text-align:center}.rk.ok{color:var(--att-attend)}
.dr>td{padding:0!important;background:#fff!important;white-space:normal!important;box-shadow:none!important}
.det{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;padding:18px 20px 22px;border-bottom:2px solid var(--border);animation:fade .35s both}
.tl h4{margin:0 0 12px;font-size:14px;font-weight:700}
.tl ol{list-style:none;margin:0;padding:0;position:relative}
.tl ol:before{content:'';position:absolute;top:8px;bottom:8px;left:15px;width:2px;background:var(--border)}
.ev{position:relative;display:flex;gap:12px;padding:0 0 14px}
.evd{position:relative;z-index:1;flex:0 0 32px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#eef0ef;color:var(--text-secondary);border:2px solid #fff;font-size:14px}
.ev.ci .evd,.ev.onTime .evd{background:var(--att-attend-bg);color:var(--att-attend)}
.ev.late .evd{background:var(--att-late-bg);color:var(--att-late)}
.ev.co .evd{background:#EFEBE9;color:#6D4C41}
.evb{flex:1;min-width:0;padding-top:4px}
.evh{display:flex;align-items:center;gap:8px;font-size:13.5px}
.lby{color:var(--att-late);font-size:12px;font-weight:700}
.evm{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:4px;font-size:12.5px;color:var(--text-secondary)}
.evm span,.evm a{display:inline-flex;align-items:center;gap:4px}
.evm .ic{font-size:12px;color:var(--text-muted)}
.evm a{color:var(--brand-accent);font-weight:600}.evm a .ic{color:var(--brand-accent)}
.rng{padding:1px 8px;border-radius:10px;background:var(--att-attend-bg);color:var(--att-attend);font-weight:600}
.rng.out{background:var(--att-late-bg);color:var(--att-late)}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.map{height:260px;border-radius:var(--radius);border:1px solid var(--border);overflow:hidden;position:relative;background:#eef1ec}
.map svg{position:absolute;inset:0}
.mzoom{position:absolute;left:10px;top:10px;background:#fff;border-radius:4px;box-shadow:0 1px 5px rgba(0,0,0,.4);display:flex;flex-direction:column;font-size:16px;font-weight:700;color:#333}
.mzoom span{width:28px;height:28px;display:grid;place-items:center;border-bottom:1px solid #ccc}.mzoom span:last-child{border:0}
.mtip{position:absolute;background:#fff;border-radius:4px;padding:5px 8px;font-size:12px;box-shadow:0 1px 4px rgba(0,0,0,.35);white-space:nowrap;transform:translate(-50%,-100%);margin-top:-14px;animation:fade .15s both;color:#333}
.photos{display:flex;flex-wrap:wrap;gap:10px}
.photos figure{margin:0;width:92px}
.photos .im{width:92px;height:92px;border-radius:var(--radius);border:1px solid var(--border);overflow:hidden;display:block}
.photos figcaption{margin-top:4px;font-size:11.5px;color:var(--text-secondary);text-align:center}
.foot{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-top:1px solid var(--border);font-size:13px;color:var(--text-secondary)}

/* overlays */
#ov{position:absolute;inset:0;z-index:50;pointer-events:none}
.ring{position:absolute;border:2.5px solid #1D9E75;box-shadow:0 0 0 4px rgba(29,158,117,.22),0 0 18px rgba(29,158,117,.35);pointer-events:none;z-index:25;animation:ringin .3s both,ringp 1.3s .3s ease-in-out infinite}
@keyframes ringin{from{opacity:0;transform:scale(1.06)}}
@keyframes ringp{50%{box-shadow:0 0 0 8px rgba(29,158,117,.10),0 0 22px rgba(29,158,117,.45)}}
.ddp{position:absolute;background:#fff;border-radius:var(--radius);box-shadow:var(--shadow-pop);border:1px solid var(--border);padding:0 0 4px;font-size:14px;color:#333;z-index:3;animation:pop .16s both;overflow:hidden}
.ddp .ddf{height:44px;padding:6px 8px;border-bottom:1px solid var(--border)}
.ddp .ddf span{display:flex;align-items:center;justify-content:space-between;height:32px;border:1px solid #D9DEDC;border-radius:6px;padding:0 10px;color:var(--text-muted);font-size:13px}
.ddp [data-i]{padding:0 14px;height:36px;display:flex;align-items:center;white-space:nowrap}
.ddp [data-i].hl{background:var(--brand-accent-soft);color:var(--brand-primary)}
.dlc{position:absolute;right:24px;top:72px;width:350px;background:#fff;border-radius:12px;box-shadow:0 10px 28px rgba(0,0,0,.2);padding:14px;display:flex;gap:12px;align-items:center;animation:tin .3s both;z-index:4}
.dlc.out{animation:tout .35s both}
@keyframes tin{from{opacity:0;transform:translateX(40px)}}
@keyframes tout{to{opacity:0;transform:translateX(40px)}}
.xl{width:38px;height:44px;border-radius:5px;background:#1d6f42;color:#fff;font-weight:800;display:grid;place-items:center;font-size:15px;flex:none}
.dlc b{font-size:13.5px;color:#22304a;display:block}.dlc small{color:#6b7280;font-size:12px}
.dlb{height:4px;background:#e6e9ee;border-radius:3px;margin:7px 0 5px;overflow:hidden}
.dlb i{display:block;height:100%;width:0;background:#1d6f42;transition:width .7s}
.dlc.ok .dlb i{width:100%}
.lbx{position:absolute;inset:0;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;animation:fade .2s both;z-index:2}
.lbx .big{width:440px;height:440px;border-radius:10px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.lbx .cls{position:absolute;top:28px;right:34px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;display:grid;place-items:center;font-size:20px}
.lbx .lt{position:absolute;bottom:110px;left:0;right:0;text-align:center;color:#fff;font-size:15px}
.xw{position:absolute;left:272px;top:78px;width:1150px;background:#fff;border-radius:10px;box-shadow:0 24px 60px rgba(0,0,0,.35);overflow:hidden;animation:xin .35s both;z-index:3;font-family:Calibri,'Segoe UI',Arial,sans-serif}
.xw.out{animation:tout .3s both}
@keyframes xin{from{opacity:0;transform:translateY(24px) scale(.97)}}
.xbar{background:#1d6f42;color:#fff;height:38px;display:flex;align-items:center;gap:10px;padding:0 14px;font-size:13px}
.xbar .xl{width:22px;height:22px;font-size:11px;background:#fff;color:#1d6f42;border-radius:4px}
.xbar span:last-child{margin-left:auto;opacity:.8;letter-spacing:6px}
.xfx{height:28px;border-bottom:1px solid #d6d6d6;display:flex;align-items:center;font-size:12px;color:#444;background:#fafafa}
.xfx b{width:60px;text-align:center;border-right:1px solid #d6d6d6;font-weight:400}.xfx i{padding:0 10px;font-style:italic;color:#888}
.xg{overflow:hidden;height:304px;position:relative}
.xg table{border-collapse:collapse;width:max-content;font-size:12px}
.xg td,.xg th{border:1px solid #e1e1e1;padding:0 7px;height:22px;white-space:nowrap;color:#222}
.xg th{background:#f3f3f3;font-weight:400;color:#555;text-align:center;height:20px}
.xg td.rn{background:#f3f3f3;color:#555;text-align:center;width:34px;padding:0}
.xg .xt td.c{color:#1A5C4C;font-weight:700;font-size:14px;height:28px}
.xg .xh td.c{background:#1A5C4C;color:#fff;font-weight:700}
.xg .xtot td.c{background:#F1F3F2;font-weight:700}
.xtabs{height:30px;border-top:1px solid #d6d6d6;background:#f3f3f3;display:flex;align-items:flex-end;padding-left:40px;font-size:12px}
.xtabs span{background:#fff;padding:6px 18px;border:1px solid #d6d6d6;border-top:0;color:#1d6f42;font-weight:700;border-bottom:3px solid #1d6f42}

/* caption & cursor */
#cap{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:rgba(10,38,32,.94);color:#fff;border-radius:14px;padding:10px 22px 11px 12px;display:flex;gap:13px;align-items:center;max-width:1000px;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:80;transition:opacity .3s;white-space:nowrap}
#cap.hide{opacity:0}
#cap .cn{width:36px;height:36px;border-radius:10px;background:#1D9E75;color:#fff;display:grid;place-items:center;font-weight:800;font-size:16px;flex:none}
#cap small{display:block;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:#7fdcbc;font-weight:700}
#cap small em{font-style:normal;color:rgba(255,255,255,.5);margin-left:8px;letter-spacing:.06em}
#cap .tx{font-size:17.5px;margin-top:1px}
#cap .tx b{color:#9ff0d6}
#cap .tx.sw2{animation:fade .3s both}
#cur{position:absolute;left:0;top:0;z-index:100;pointer-events:none;opacity:0;transition:transform .45s cubic-bezier(.45,.05,.25,1),opacity .3s}
#cur.vis{opacity:1}
#cur svg.ar{position:absolute;left:-4px;top:-3px;width:30px;height:30px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35));transform-origin:4px 3px}
#cur.p svg.ar{animation:cp .25s}
@keyframes cp{50%{transform:scale(.78)}}
.rip{position:absolute;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;border:3px solid #1D9E75;z-index:99;pointer-events:none;animation:rip .55s ease-out forwards}
@keyframes rip{from{transform:scale(.2);opacity:1}to{transform:scale(1.4);opacity:0}}

/* controls */
.ctl{height:48px;flex:none;background:#0d2420;display:flex;align-items:center;gap:6px;padding:0 12px;color:#cfe3de;font-size:13px;user-select:none}
.ctl button{background:none;border:0;color:#e9f6f2;width:36px;height:36px;border-radius:8px;display:grid;place-items:center;flex:none}
.ctl button:hover{background:rgba(255,255,255,.08)}
.ctl button svg{width:20px;height:20px}
#tm{font-variant-numeric:tabular-nums;min-width:86px;text-align:center;flex:none}
#stp{flex:none;font-variant-numeric:tabular-nums;color:#9fdcc7;padding:0 6px;min-width:76px}
#bar{position:relative;flex:1;height:28px;cursor:pointer;touch-action:none}
#bar .trk{position:absolute;left:0;right:0;top:12px;height:5px;border-radius:3px;background:rgba(255,255,255,.16)}
#fill{position:absolute;left:0;top:12px;height:5px;border-radius:3px;background:#1D9E75;width:0}
#knob{position:absolute;top:8px;width:13px;height:13px;margin-left:-6.5px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.tick{position:absolute;top:10px;width:2px;height:9px;background:#0d2420;margin-left:-1px}
#chap{flex:none;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#9fcfc3;padding-left:8px}
@media (max-width:560px){#chap,#stp{display:none}#tm{min-width:70px;font-size:12px}.ctl{padding:0 6px;gap:2px}}
#big{position:absolute;left:50%;top:50%;width:76px;height:76px;margin:-38px 0 0 -38px;border-radius:50%;background:rgba(15,61,50,.88);display:grid;place-items:center;opacity:0;transition:opacity .25s;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.35)}
#big svg{width:34px;height:34px;color:#fff;margin-left:4px}
.paused #big{opacity:1}
</style>
</head>

function niceMax(v){if(v<=0)return 5;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;return(n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p;}
const legend=items=>`<div class="lg">${items.map(([n,c])=>`<span><i style="background:${c}"></i>${n}</span>`).join('')}</div>`;
function axes(w,h,L,R,T,B,max){let s='';for(let k=0;k<=5;k++){const v=max*k/5,y=T+(h-T-B)*(1-k/5);s+=`<line x1="${L}" x2="${w-R}" y1="${y}" y2="${y}" stroke="${k?'#eceff1':'#cfd5d3'}"/><text x="${L-6}" y="${y+4}" text-anchor="end">${Math.round(v*10)/10}</text>`;}return s;}
function lineChart(id,D,w,h){
  const T=8,B=24,L=34,R=8,S=[['On time','on',C.onTime],['Late','la',C.late],['Absent','ab',C.absent],['Early Out','eo',C.earlyOut]];
  const max=niceMax(Math.max(...D.trend.map(p=>p.on))*1.08),n=D.trend.length,iw=w-L-R,ih=h-T-B;
  const x=i=>L+iw*(n===1?.5:i/(n-1)),y=v=>T+ih*(1-v/max);
  let s=axes(w,h,L,R,T,B,max);const every=Math.ceil(n/11);
  D.trend.forEach((p,i)=>{if(i%every===0&&x(i)<w-R-24)s+=`<text x="${x(i)}" y="${h-6}" text-anchor="middle">${p.l}</text>`;});
  S.forEach(([nm,k,c])=>{const pts=D.trend.map((p,i)=>[x(i),y(p[k])]);
    let d=`M${pts[0][0]},${pts[0][1]}`;for(let i=1;i<pts.length;i++){const p0=pts[i-2]||pts[i-1],p1=pts[i-1],p2=pts[i],p3=pts[i+1]||p2,t=.18;
      d+=` C${p1[0]+(p2[0]-p0[0])*t},${p1[1]+(p2[1]-p0[1])*t} ${p2[0]-(p3[0]-p1[0])*t},${p2[1]-(p3[1]-p1[1])*t} ${p2[0]},${p2[1]}`;}
    s+=`<path d="${d}" fill="none" stroke="${c}" stroke-width="2"/>`+pts.map(([a,b])=>`<circle cx="${a}" cy="${b}" r="2.6" fill="${c}"/>`).join('');});
  const hi=Math.min(n-1,Math.round(n*.62));

}
function donutChart(D,w,h){
  const v=D.donut,tot=v.reduce((a,b)=>a+b,0),cx=w/2,cy=h/2+2,R=Math.min(w,h)/2-6,r=R*.5,cols=[C.onTime,C.late,C.absent,C.earlyOut];let a0=-Math.PI/2,s='';
  v.forEach((x,i)=>{const a1=a0+2*Math.PI*x/tot,lg=a1-a0>Math.PI?1:0;const P=(rr,a)=>`${cx+rr*Math.cos(a)},${cy+rr*Math.sin(a)}`;

function stackChart(groups,w,h){
  const T=8,B=34,L=40,R=8,max=niceMax(Math.max(...groups.map(g=>g[1]+g[2]+g[3]))*1.05),n=groups.length,gw=(w-L-R)/n,bw=Math.min(46,gw*.32),ih=h-T-B;

    s+=`<rect x="${gx+2}" y="${y(g[4])}" width="${bw}" height="${y(0)-y(g[4])}" fill="${C.earlyOut}"/>`;
    const parts=g[0].replace(' (',' |(').split('|');s+=`<text x="${gx}" y="${h-B+15}" text-anchor="middle">${parts[0]}</text>`+(parts[1]?`<text x="${gx}" y="${h-B+28}" text-anchor="middle">${parts[1]}</text>`:'');});

function barChart(data,w,h){

/* ======================= player ======================= */
let clock=0,idx=0,playing=false,last=0,frozen=[];
const run=e=>{try{e.fn()}catch(err){console.warn(err)}};
function freeze(){frozen=document.getAnimations().filter(a=>a.playState==='running');frozen.forEach(a=>a.pause());}
function thaw(){frozen.forEach(a=>{if(a.playState==='paused')a.play();});frozen=[];}
function seek(ms){
  ms=Math.max(0,Math.min(TOTAL,ms));seeking=true;stage.classList.add('instant');build();
  idx=0;clock=ms;while(idx<E.length&&E[idx].t<=ms)run(E[idx++]);
  void stage.offsetWidth;
  requestAnimationFrame(()=>{
    stage.classList.remove('instant');seeking=false;
    document.getAnimations().forEach(a=>{const t=a.effect&&a.effect.getComputedTiming();if(t&&isFinite(t.endTime))a.finish();});
    if(!playing)freeze();
  });
}
function play(){if(clock>=TOTAL)seek(0);playing=true;thaw();ui();}
function pause(){playing=false;freeze();ui();}
const toggle=()=>playing?pause():play();
const fmt=ms=>{const s=Math.floor(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
const bp=document.getElementById('bp');
function ui(){
  const f=clock/TOTAL;document.getElementById('fill').style.width=f*100+'%';document.getElementById('knob').style.left=f*100+'%';
  document.getElementById('tm').textContent=fmt(clock)+' / '+fmt(TOTAL);
  let c=CH[0];for(const x of CH)if(x.t<=clock)c=x;document.getElementById('chap').textContent=c.n;
  document.getElementById('stp').textContent=c.num?`Step ${c.num} / ${CAPN}`:(c===CH[0]?'Intro':'Done');
  bp.innerHTML=playing?'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>':'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4l13 8-13 8z"/></svg>';
  document.getElementById('player').classList.toggle('paused',!playing);
}
function loop(now){
  const dt=Math.min(100,now-(last||now));last=now;
  if(playing){clock+=dt;while(idx<E.length&&E[idx].t<=clock)run(E[idx++]);if(clock>=TOTAL){clock=TOTAL;pause();}}
  ui();requestAnimationFrame(loop);
}
function fit(){const w=vp.clientWidth,h=vp.clientHeight;SC=Math.min(w/W,h/H);stage.style.transform=`translate(${(w-W*SC)/2}px,${(h-H*SC)/2}px) scale(${SC})`;}
window.addEventListener('resize',fit);

vp.addEventListener('click',toggle);
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();toggle();}
  if(e.code==='ArrowRight'||e.code==='ArrowLeft'){const d=e.code==='ArrowRight'?1:-1;let i=CH.findIndex((c,k)=>k===CH.length-1||CH[k+1].t>clock);i=Math.max(0,Math.min(CH.length-1,i+d));seek(CH[i].t);}});
document.getElementById('ticks').innerHTML=CH.slice(1).map(c=>`<i class="tick" style="left:${c.t/TOTAL*100}%" title="${c.n}"></i>`).join('');
const bar=document.getElementById('bar');let drag=false,wasPlaying=false;
const barMs=e=>{const r=bar.getBoundingClientRect();return Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*TOTAL;};
bar.addEventListener('pointerdown',e=>{drag=true;wasPlaying=playing;bar.setPointerCapture(e.pointerId);if(playing){playing=false;}seek(barMs(e));});
bar.addEventListener('pointermove',e=>{if(drag){clock=barMs(e);}});
bar.addEventListener('pointerup',e=>{if(!drag)return;drag=false;seek(barMs(e));if(wasPlaying)play();else freeze();});

fit();
/* Seek hooks: #t=SECONDS, #step=N (optionally &o=SECONDS into that step); add &p to start paused. */
const hp=new URLSearchParams(location.hash.slice(1));
let start=(parseFloat(hp.get('t'))||0)*1000;
if(hp.has('step')){const c=CH.find(x=>x.num===+hp.get('step'));if(c)start=c.t+(parseFloat(hp.get('o'))||0)*1000;}
seek(start);
if(!hp.has('p'))play();else pause();
requestAnimationFrame(loop);
window.__TUT={TOTAL,CH};
</script>
